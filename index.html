async function applyBackgroundReward(p, team) {
  if (!p.lastSeen) { p.lastSeen = Date.now(); return; }
  const elapsedMs = Date.now() - p.lastSeen;
  const cappedMs = Math.min(elapsedMs, BACKGROUND_MAX_HOURS * 60 * 60 * 1000);
  const elapsedHours = cappedMs / (60 * 60 * 1000);
  const grantedTap = Math.floor(elapsedHours * getBackgroundTapPerHour(p));

  if (grantedTap > 0) {
    let coinGain = 0;
    let cardGain = 0;
    for (let i = 0; i < grantedTap; i++) {
      const reward = rollTouchReward(null, p.pity); // 백그라운드 중엔 부스트 미적용
      if (reward.type === "coin") {
        coinGain += reward.amount;
      } else {
        if (isAutoDismantleMatch(p, reward)) {
          const gr = getGrade(reward.gradeId);
          coinGain += gr.special ? 50000000 : Math.floor(gr.coin[0] + Math.random() * (gr.coin[1]-gr.coin[0]));
          p.materialsByType[gr.materialType] = (p.materialsByType[gr.materialType] || 0) + gr.materialAmt;
          p.stats_dismantleCount = (p.stats_dismantleCount || 0) + 1;
          markDexUnlocked(p, { teamId: reward.teamId, playerName: reward.playerName, gradeId: reward.gradeId, ovr: rollOVR(reward.gradeId) });
        } else {
          const newCard = createCard(reward);
          p.cards.push(newCard);
          markDexUnlocked(p, newCard);
        }
        updatePity(p.pity, reward.gradeId);
        bumpMission(p, "cardObtain", 1);
        if (["RARE","EPIC","UNIQUE","MYSTIC","LEGENDARY","TRANSCENDENT"].includes(reward.gradeId)) bumpMission(p, "rarePlusObtain", 1);
        cardGain++;
      }
    }
    p.personalTap += grantedTap;
    p.coins += coinGain;
    bumpMission(p, "touch", grantedTap);
    ensureSeason(p);
    p.season.touchCount += grantedTap;
    await bumpTeamWeeklyContribution(p, grantedTap);
    await bumpTeamTotal(team.id, grantedTap);
    toast(`🌙 오프라인 보상: +${grantedTap.toLocaleString()} TAP, +${coinGain.toLocaleString()} 코인${cardGain>0 ? `, 카드 ${cardGain}장` : ""}`);
  }
  p.lastSeen = Date.now();
}

// v2.5: 클라우드 동기화 - 유저가 많아져도 서버 부하가 커지지 않도록 매 액션마다 쓰지 않고
// 일정 주기로만 통째로 밀어넣음(push). 화면을 나가거나 숨길 때도 한 번 더 시도함.
// 로컬(localStorage)이 항상 "진짜" 저장소이고, 클라우드는 백업/기기간 이전용 보조 저장소임.
// v2.20: 20초 → 10초로 더 자주 동기화하고, 화면을 다시 켰을 때(visible로 전환)도 즉시 한 번 더 동기화함.
// (참고: 폰이 잠기거나 다른 앱으로 전환되면 모바일 브라우저가 이 페이지의 자바스크립트 실행 자체를 멈추기 때문에
//  그 시간 동안은 어떤 주기를 걸어도 동기화가 안 됨 - 로컬 저장은 항상 정상 동작하니 데이터 유실은 없음)
const CLOUD_SYNC_INTERVAL_MS = 10000; // 10초마다 한 번
let cloudSyncTimer = null;
async function pushToCloudNow() {
  if (!state.profile || !window.KBOCloud) return;
  const uid = window.KBOCloud.getUid();
  if (!uid) return;
  try {
    const result = await window.KBOCloud.pushProfile(state.profile);
    if (result.ok) {
      state.lastCloudSyncAt = Date.now();
      state.lastCloudSyncError = null;
    } else if (result.reason !== "not-signed-in") {
      state.lastCloudSyncError = result.reason;
    }
  } catch (e) { state.lastCloudSyncError = (e && e.message) || String(e); }
}
function startCloudSyncLoop() {
  if (cloudSyncTimer) clearInterval(cloudSyncTimer);
  cloudSyncTimer = setInterval(pushToCloudNow, CLOUD_SYNC_INTERVAL_MS);
  document.addEventListener("visibilitychange", () => {
    // 화면을 끄거나 백그라운드로 보낼 때도, 다시 켜서 돌아왔을 때도 항상 즉시 한 번 동기화
    pushToCloudNow();
  });
}
// v2.6: 서버 전체 공지 실시간 구독 (지금은 다른 유저의 TRANSCENDENT 카드 등장 알림).
// 구독 시작 직후 첫 콜백은 "구독 시점의 최신 상태"라 과거 공지일 수 있으므로 화면에 띄우지 않고 넘어감.
function startAnnouncementListener() {
  if (!window.KBOCloud || !window.KBOCloud.listenAnnouncements) return;
  let skippedInitial = false;
  window.KBOCloud.listenAnnouncements((data) => {
    if (!skippedInitial) { skippedInitial = true; return; }
    if (data && data.text) pushAnnouncement(data.text);
  });
}

// 오토터치는 1초 틱 기반으로 레벨별 intervalSec마다 발동, tapsPerTick만큼 한번에 처리
let autoTapTimer = null;
function restartAutoTapLoop() {
  if (autoTapTimer) clearInterval(autoTapTimer);
  autoTapTick = 0;
  autoTapTimer = setInterval(async () => {
    const p = state.profile;
    if (!p || !p.autoTapLevel || p.autoTapEnabled === false) return;
    // 자신이 강화해둔 레벨(p.autoTapLevel) 이하에서 실제로 가동할 레벨을 직접 선택할 수 있음
    // v2.18: 어떤 경로로든(치트/데이터 오류 등) autoTapLevel이 실제 테이블 범위를 벗어나면
    // 여기서 조용히 에러가 나서 오토터치 자체가 통째로 멈춰버리는 버그가 있어서 범위를 강제로 clamp함
    const maxDefinedLevel = AUTO_TAP_LEVELS.length;
    const effectiveLevel = Math.max(0, Math.min(p.autoTapActiveLevel || p.autoTapLevel, p.autoTapLevel, maxDefinedLevel));
    if (effectiveLevel <= 0) return;
    const levelInfo = AUTO_TAP_LEVELS[effectiveLevel - 1];
    if (!levelInfo) return; // 방어 코드: 테이블에 없는 레벨이면 조용히 스킵 (오토터치 전체가 멈추는 것 방지)
    autoTapTick++;
    if (autoTapTick < levelInfo.intervalSec) return;
    autoTapTick = 0;

    const team = TEAMS.find(t => t.id === p.teamId);
    let bestCardGrade = null, bestCardGradeIdx = -1, bestCardPlayer = null, gotTranscendent = false;

    for (let i = 0; i < levelInfo.tapsPerTick; i++) {
      const reward = rollTouchReward(p.activeBoost, p.pity, getEffectiveAdBoost(p), getEquippedDropRateMultiplier(p));
      p.personalTap += 1;
      if (reward.type === "coin") {
        p.coins += Math.round(reward.amount * getEquippedCoinMultiplier(p));
      } else {
        // 자동분해 설정에 걸리는 카드는 즉시 분해 (인벤토리에 쌓지 않음 → 카드 누적으로 인한 렉도 예방)
        if (isAutoDismantleMatch(p, reward)) {
          const gr = getGrade(reward.gradeId);
          const ovr = rollOVR(reward.gradeId);
          const coinGain = gr.special ? 50000000 : Math.floor(gr.coin[0] + Math.random() * (gr.coin[1]-gr.coin[0]));
          p.coins += Math.round(coinGain * getEquippedCoinMultiplier(p));
          p.materialsByType[gr.materialType] = (p.materialsByType[gr.materialType] || 0) + Math.round(gr.materialAmt * getEquippedMaterialMultiplier(p));
          p.stats_dismantleCount = (p.stats_dismantleCount || 0) + 1;
          markDexUnlocked(p, { teamId: reward.teamId, playerName: reward.playerName, gradeId: reward.gradeId, ovr });
        } else {
          const card = createCard(reward);
          p.cards.push(card);
          markDexUnlocked(p, card);
        }
        updatePity(p.pity, reward.gradeId);
        bumpMission(p, "cardObtain", 1);
        if (["RARE","EPIC","UNIQUE","MYSTIC","LEGENDARY","TRANSCENDENT"].includes(reward.gradeId)) bumpMission(p, "rarePlusObtain", 1);
        // 한 틱에 여러 장이 나올 때 낮은 등급에 묻히지 않도록, 그 틱에서 가장 높은 등급만 이펙트로 보여줌
        const gIdx = GRADES.findIndex(g => g.id === reward.gradeId);
        if (gIdx > bestCardGradeIdx) {
          bestCardGradeIdx = gIdx;
          bestCardGrade = getGrade(reward.gradeId);
          bestCardPlayer = reward.teamName + " " + reward.playerName;
        }
        if (reward.gradeId === "TRANSCENDENT") gotTranscendent = true;
      }
    }

    bumpMission(p, "touch", levelInfo.tapsPerTick);
    ensureSeason(p);
    p.season.touchCount += levelInfo.tapsPerTick;
    await bumpTeamWeeklyContribution(p, levelInfo.tapsPerTick);

    if (bestCardGrade && state.tab === "touch") showCardEffect(bestCardGrade, bestCardPlayer);
    if (gotTranscendent) {
      toast(`⚡ 오토터치로 TRANSCENDENT ${bestCardPlayer} 획득!`);
      pushAnnouncement(`🎉 초월 등장! ${p.nickname || team.name} 님이 TRANSCENDENT ${bestCardPlayer}을(를) 오토터치로 획득했어요!`);
    }

    await saveProfile(p);
    const newTotal = await bumpTeamTotal(team.id, levelInfo.tapsPerTick);
    state.teamTotals[team.id] = newTotal;
    if (state.tab === "touch") {
      const tv = document.querySelector(".tapValue");
      if (tv) tv.textContent = Math.floor(p.personalTap).toLocaleString();
      const pill = document.querySelector(".pill");
      if (pill) pill.innerHTML = `<span class="curColor">${state.currencyDisplay === "diamond" ? "💎 " + p.diamonds.toLocaleString() : "🪙 " + p.coins.toLocaleString()}</span>`;
    }
  }, 1000);
}

async function init() {
  let profile = await loadProfile();

  // v2.5: 로컬 저장이 없을 때만(새 기기/새 파일 등) 클라우드에서 복구를 시도함.
  // 로컬이 이미 있으면 그게 최신이라고 보고 절대 덮어쓰지 않음 (덮어쓰기는 설정 화면의 "코드로 복구하기"에서만).
  if (!profile && window.KBOCloud) {
    try {
      const uid = await Promise.race([
        window.KBOCloud.ready,
        new Promise(resolve => setTimeout(() => resolve(null), 4000)), // 4초 이상 걸리면 포기하고 로컬로 진행
      ]);
      if (uid) {
        const pull = await window.KBOCloud.pullMyProfile();
        if (pull.ok) {
          profile = pull.profile;
          toast("☁️ 클라우드에서 이전 진행상황을 불러왔어요!");
        }
      }
    } catch (e) { /* 클라우드 실패해도 아래에서 그냥 신규 유저로 진행됨 */ }
  }

  if (!profile) {
    renderTeamSelect();
    return;
  }
  // 구버전 저장 데이터 호환 (새 필드 기본값 채우기)
  if (!profile.pity) profile.pity = {};
  if (!profile.materialsByType) profile.materialsByType = {};
  if (profile.diamonds == null) profile.diamonds = 0;
  if (!profile.achievements) profile.achievements = {};
  if (!profile.titles) profile.titles = [];
  if (!profile.dexUnlocked) {
    profile.dexUnlocked = {};
    // 구버전 프로필 호환: 지금 보유 중인 카드 기준으로 일단 도감 기록을 채워둠(이미 분해한 건 소급 복원 불가)
    profile.cards.forEach(c => {
      const key = `${c.teamId}_${c.playerName}_${c.gradeId}`;
      if (!profile.dexUnlocked[key]) profile.dexUnlocked[key] = { ovr: c.ovr, firstObtainedAt: c.discoveredAt || Date.now() };
    });
  }
  if (profile.autoTapLevel == null) profile.autoTapLevel = 0;
  if (!profile.userId) profile.userId = "U" + Date.now() + Math.floor(Math.random() * 1000000);
  if (!profile.boostInventory) profile.boostInventory = {};
  if (profile.stats_marketSellCount == null) profile.stats_marketSellCount = 0;
  if (profile.stats_marketBuyCount == null) profile.stats_marketBuyCount = 0;
  if (profile.stats_teamChangeCount == null) profile.stats_teamChangeCount = 0;
  resetMissionsIfNeeded(profile);
  ensureAttendance(profile);
  ensureSeason(profile);
  ensureTeamWeekly(profile);
  if (profile.activeAdBoost === undefined) profile.activeAdBoost = null;
  if (profile.adRemovedUntil === undefined) profile.adRemovedUntil = null;
  if (profile.stats_dismantleCount == null) profile.stats_dismantleCount = 0;
  if (profile.stats_researchCount == null) profile.stats_researchCount = 0;
  if (profile.stats_researchMaxCount == null) profile.stats_researchMaxCount = 0;
  // v2.33: "카드 수집" 업적을 누적 획득수 기준으로 바꾸면서, 기존 유저는 최소한 지금 보유한 개수만큼은
  // 이미 얻었던 것으로 인정해줌 (분해/판매한 기록까지는 알 수 없어 보수적으로 보유 개수를 하한선으로 사용).
  if (profile.stats_totalCardsObtained == null) profile.stats_totalCardsObtained = profile.cards.length;
  if (profile.stats_transcendentDismantled == null) profile.stats_transcendentDismantled = 0;
  if (profile.stats_craftCount == null) profile.stats_craftCount = 0;
  if (profile.stats_enhanceCount == null) profile.stats_enhanceCount = 0;
  if (profile.stats_enhanceMaxCount == null) profile.stats_enhanceMaxCount = 0;
  if (profile.stats_boostUseCount == null) profile.stats_boostUseCount = 0;
  profile.cards.forEach(c => { if (c.enhanceLevel == null) c.enhanceLevel = 0; if (c.researchLevel == null) c.researchLevel = 0; });
  // v2.0: 럭키머신 / 슈퍼 럭키머신 / 카드 연구소
  if (profile.pill == null) profile.pill = 0;
  if (!profile.superLucky) profile.superLucky = { cycleCount: 0, totalResetCount: 0, resetsToday: 0, dateKey: getKSTDateKey() };
  if (!profile.cardLab) profile.cardLab = { slots: [] };
  if (!profile.cardLab.slots) profile.cardLab.slots = [];
  if (!profile.pillShop) profile.pillShop = { dateKey: getKSTDateKey(), coinBought: 0, diaBought: 0 };
  if (!profile.diamondBundleDaily) profile.diamondBundleDaily = { dateKey: getKSTDateKey(), counts: {} };
  if (!profile.redeemedCoupons) profile.redeemedCoupons = [];
  if (!profile.oneTimePurchases) profile.oneTimePurchases = {};
  if (!profile.rankRewardsClaimed) profile.rankRewardsClaimed = {};
  if (profile.bonusExp == null) profile.bonusExp = 0;
  ensureWorldChallenge(profile);
  ensureEquipment(profile);
  ensureEffectSettings(profile);
  if (!profile.social) profile.social = { friends: [], incomingRequests: [], outgoingRequests: [], whispers: {}, lastIncomingSpawnAt: 0 };
  ensureSkins(profile);
  ensureSoundSettings(profile);
  if (!profile.nickname) {
    const t0 = TEAMS.find(t => t.id === profile.teamId);
    profile.nickname = `${t0 ? t0.name : "선수"}팬${Math.floor(1000 + Math.random()*9000)}`;
  }
  if (profile.autoTapEnabled == null) profile.autoTapEnabled = true;
  if (profile.autoTapActiveLevel == null) profile.autoTapActiveLevel = 0;
  if (profile.managerRating == null) profile.managerRating = 1000;
  if (profile.managerWins == null) profile.managerWins = 0;
  if (profile.managerLosses == null) profile.managerLosses = 0;
  if (!profile.defenseLineup) profile.defenseLineup = {};
  if (!profile.defenseLineupSnapshot) profile.defenseLineupSnapshot = computeDefenseLineupSnapshot(profile);
  if (!profile.attackLineup) profile.attackLineup = {};
  if (!profile.managerMatchHistory) profile.managerMatchHistory = [];
  if (profile.managerTickets == null) profile.managerTickets = MANAGER_DAILY_TICKETS;
  if (!profile.managerTicketsDateKey) profile.managerTicketsDateKey = getKSTDateKey();
  if (profile.managerTicketBuyCount == null) profile.managerTicketBuyCount = 0;
  if (profile.managerTicketDiaBuyCount == null) profile.managerTicketDiaBuyCount = 0;
  if (profile.managerStreakTicketCount == null) profile.managerStreakTicketCount = 0;
  if (profile.managerWinStreak == null) profile.managerWinStreak = 0;
  if (!profile.managerLastTicketRegenAt) profile.managerLastTicketRegenAt = Date.now();

  // 로그인 연속일수 계산 (KST 기준, 하루에 한번만 갱신)
  const todayKey = getKSTDateKey();
  if (!profile.loginStreak) profile.loginStreak = { current: 0, longest: 0, lastLoginDateKey: null };
  if (profile.loginStreak.lastLoginDateKey !== todayKey) {
    const yesterdayKey = getKSTDateKey(Date.now() - 24*60*60*1000);
    if (profile.loginStreak.lastLoginDateKey === yesterdayKey) {
      profile.loginStreak.current += 1;
    } else {
      profile.loginStreak.current = 1;
    }
    profile.loginStreak.longest = Math.max(profile.loginStreak.longest, profile.loginStreak.current);
    profile.loginStreak.lastLoginDateKey = todayKey;
  }

  state.profile = profile;
  const team = TEAMS.find(t => t.id === profile.teamId);
  await applyBackgroundReward(profile, team);
  await saveProfile(profile);
  state.teamTotals = await getAllTeamTotals();
  render();
  restartAutoTapLoop();
  startCloudSyncLoop();
  startAnnouncementListener();
  claimPendingMarketPayouts(profile); // v2.80: 접속하자마자 밀린 거래소 판매 수익이 있으면 입금
  window.addEventListener("beforeunload", () => { profile.lastSeen = Date.now(); saveProfile(profile); pushToCloudNow(); });
}

function renderTeamSelect() {
  app.innerHTML = `
    <h1>응원할 구단을 선택하세요</h1>
    <div id="teamGrid"></div>
  `;
  const grid = document.getElementById("teamGrid");
  TEAMS.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "teamCard";
    btn.style.background = t.color;
    btn.textContent = t.name;
    btn.onclick = () => {
      renderNicknameSetup(t);
    };
    grid.appendChild(btn);
  });
}

// v2.17: 팀을 고른 뒤 닉네임을 직접 입력하는 단계를 추가함 (이전엔 자동생성만 됐음).
// 최초 1회는 무료, 이후 변경은 프로필 화면에서 다이아 500개가 듦(renderProfile 참고).
function renderNicknameSetup(team) {
  const suggested = `${team.name}팬${Math.floor(1000 + Math.random() * 9000)}`;
  app.innerHTML = `
    <h1>닉네임을 입력하세요</h1>
    <div class="sub" style="margin-bottom:16px;">다른 유저에게 보이는 이름이에요. 나중에 바꾸려면 💎500이 필요하니 신중하게 정해주세요!</div>
    <input id="startNicknameInput" type="text" maxlength="12" value="${suggested}"
      style="width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:16px; text-align:center; margin-bottom:14px;">
    <button id="startGameBtn" style="width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-weight:800; font-size:15px; margin-bottom:10px;">${team.name}(으)로 시작하기</button>
    <button id="backToTeamBtn" style="width:100%; padding:10px; border:none; border-radius:10px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:13px;">← 구단 다시 선택</button>
  `;
  document.getElementById("backToTeamBtn").onclick = () => renderTeamSelect();
  document.getElementById("startGameBtn").onclick = async () => {
    const input = document.getElementById("startNicknameInput");
    const nickname = (input.value || "").trim().slice(0, 12) || suggested;
    const startBtn = document.getElementById("startGameBtn");
    startBtn.disabled = true; startBtn.textContent = "확인 중...";
    if (await isNicknameTaken(nickname, null)) {
      toast("이미 사용 중인 닉네임이에요. 다른 닉네임을 입력해주세요.");
      startBtn.disabled = false; startBtn.textContent = `${team.name}(으)로 시작하기`;
      return;
    }
    await createNewProfile(team, nickname);
  };
}

// ---------------------------------------------------------------------------
// 인앱 다이얼로그 (브라우저 native prompt()/confirm() 대체)
// 일부 웹뷰 환경에서 window.prompt/confirm이 막혀있거나 즉시 취소로 처리되는 문제가 있어서
// 화면 안에 직접 그리는 다이얼로그로 전부 교체했어요.
// ---------------------------------------------------------------------------
function showDialog({ title, message, fields }) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;";
    const box = document.createElement("div");
    box.style.cssText = "background:#15151d; border-radius:14px; padding:18px; width:100%; max-width:340px; max-height:80vh; overflow-y:auto;";
    let html = "";
    if (title) html += `<div style="font-weight:800; font-size:15px; margin-bottom:10px;">${title}</div>`;
    if (message) html += `<div style="font-size:13px; color:#ddd; white-space:pre-line; margin-bottom:14px; line-height:1.5;">${message}</div>`;
    (fields || []).forEach(f => {
      html += `<div style="margin-bottom:10px;">
        <div style="font-size:12px; color:#999; margin-bottom:4px;">${f.label}</div>
        <input id="dlgField_${f.id}" type="${f.type || "text"}" inputmode="${f.type === "number" ? "numeric" : "text"}"
               value="${f.defaultValue ?? ""}" placeholder="${f.placeholder || ""}"
               style="width:100%; padding:10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:14px; box-sizing:border-box;" />
      </div>`;
    });
    html += `<div style="display:flex; gap:8px; margin-top:6px;">
      <button id="dlgCancelBtn" style="flex:1; padding:11px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff;">취소</button>
      <button id="dlgOkBtn" style="flex:1; padding:11px; border:none; border-radius:8px; background:#1e5c3a; color:#fff; font-weight:700;">확인</button>
    </div>`;
    box.innerHTML = html;
    overlay.classList.add("modalOverlay");
    box.classList.add("modalBox");
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const cleanup = (result) => { overlay.remove(); resolve(result); };
    box.querySelector("#dlgCancelBtn").onclick = () => cleanup(null);
    box.querySelector("#dlgOkBtn").onclick = () => {
      if (!fields || fields.length === 0) { cleanup(true); return; }
      const values = {};
      for (const f of fields) values[f.id] = document.getElementById("dlgField_" + f.id).value;
      cleanup(values);
    };
    overlay.onclick = (e) => { if (e.target === overlay) cleanup(null); };
    // 입력 필드가 있으면 첫번째 필드에 자동 포커스
    if (fields && fields.length > 0) {
      setTimeout(() => { const el = document.getElementById("dlgField_" + fields[0].id); if (el) el.focus(); }, 50);
    }
  });
}
async function askConfirm(message, title) {
  const r = await showDialog({ title, message });
  return r === true;
}
async function askInput(title, fields) {
  return await showDialog({ title, fields });
}

// v2.82: 슬롯머신 심볼 가중치를 실제 확률(%)로 변환 - weightedPick과 동일한 계산식이라 항상 실제와 일치함
function computeSlotProbabilities(symbols) {
  const total = symbols.reduce((a, s) => a + s.weight, 0);
  const perSymbol = symbols.map(s => ({ id: s.id, icon: s.icon, tier: s.tier, p: s.weight / total }));
  const twoMatchProb = perSymbol.reduce((sum, s) => sum + 3 * s.p * s.p * (1 - s.p), 0); // 정확히 2개만 일치
  const threeMatchProb = perSymbol.reduce((sum, s) => sum + s.p * s.p * s.p, 0); // 3개 전부 일치(잭팟)
  return { perSymbol, twoMatchProb, threeMatchProb };
}
function renderSlotProbabilitySection(title, symbols) {
  const { perSymbol, twoMatchProb, threeMatchProb } = computeSlotProbabilities(symbols);
  const rows = perSymbol.map(s => `
    <div class="row"><span>${s.icon} ${s.id}${s.tier === "legendary" ? " (전설)" : s.tier === "rare" ? " (희귀)" : ""}</span><span style="font-family:monospace;">${(s.p*100).toFixed(3)}% (릴 1개당)</span></div>
  `).join("");
  return `
    <div class="sectionTitle" style="margin-top:16px;">${title}</div>
    <div class="sub" style="margin-bottom:6px; font-size:11px;">릴 1개에 각 심볼이 나올 확률이에요. 아래 2개/3개 일치 확률은 이 값들로 자동 계산돼요.</div>
    ${rows}
    <div class="row" style="margin-top:6px;"><span>✨ 2개 일치(아무 심볼이나)</span><span style="font-family:monospace; color:#5fd97a;">${(twoMatchProb*100).toFixed(3)}%</span></div>
    <div class="row"><span>🎉 3개 일치(잭팟)</span><span style="font-family:monospace; color:#ffd700; font-weight:700;">${(threeMatchProb*100).toFixed(5)}%</span></div>
  `;
}

// 카드 드랍 확률표 - 실제 가챠 로직(computeBoostedProbabilities, rollTouchReward의
// dropChance 계산식)을 그대로 재사용해서 표시하므로, 절대 실제 확률과 어긋나지 않음.
// 부스트가 켜져 있으면 1초마다 자동 갱신되고, 부스트가 끝나면 즉시 기본 확률로 돌아옴.
// ---------------------------------------------------------------------------
let dropRatesTimer = null;
function renderDropRates(content, p) {
  if (dropRatesTimer) clearInterval(dropRatesTimer);

  function draw() {
    const baseProbs = computeBoostedProbabilities([], 1);
    const gradeBoostActive = p.activeBoost && p.activeBoost.expiresAt > Date.now();
    const effectiveAdBoost = getEffectiveAdBoost(p);
    const adBoostActive = effectiveAdBoost && effectiveAdBoost.expiresAt > Date.now();
    const curProbs = gradeBoostActive
      ? computeBoostedProbabilities(p.activeBoost.grades, p.activeBoost.multiplier)
      : baseProbs;

    const baseDropChance = 0.001; // rollTouchReward와 동일한 기준값(터치당 카드 자체가 나올 확률)
    const titleDropMultiplier = getEquippedDropRateMultiplier(p); // v2.45: 이 화면이 칭호 효과를 안 보여주던 버그 수정 (실제 게임 내 확률에는 이미 정상 적용되고 있었음)
    const curDropChance = baseDropChance * (adBoostActive ? effectiveAdBoost.multiplier : 1) * titleDropMultiplier;

    let rows = "";
    GRADES.forEach(g => {
      const basePct = (baseProbs[g.id] * 100);
      const curPct = (curProbs[g.id] * 100);
      const changed = Math.abs(basePct - curPct) > 0.0000001;
      rows += `
        <div class="row" style="flex-direction:column; align-items:flex-start;">
          <div style="width:100%; display:flex; justify-content:space-between;">
            <span style="font-weight:700; color:${g.color};">${g.label}</span>
            <span style="font-family:monospace;">
              ${basePct.toFixed(4)}%${changed ? ` → <span style="color:#4caf50; font-weight:700;">${curPct.toFixed(4)}%</span>` : ""}
            </span>
          </div>
        </div>

    });

      <div id="gradeRateList">${rows}</div>

      <div class="row">
        <span>기본</span><span style="font-family:monospace;">${(baseDropChance*100).toFixed(4)}%</span>
      </div>
      <div class="row">
        <span>현재 적용${adBoostActive ? " (📺 광고부스트 중)" : ""}</span>
        <span style="font-family:monospace; color:${adBoostActive ? '#4caf50' : '#fff'}; font-weight:${adBoostActive?700:400};">${(curDropChance*100).toFixed(4)}%</span>
      </div>
      <div class="sub" style="margin-top:14px;">
        ${gradeBoostActive ? `⚡ ${p.activeBoost.grades[0]} 등급 부스트 ×${p.activeBoost.multiplier} 적용 중 (남은 ${Math.max(0,Math.ceil((p.activeBoost.expiresAt-Date.now())/1000))}초)` : "현재 활성화된 등급 부스트가 없어요."}

      </div>

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =========================================================
   v2.83: 친구 요청/수락이 실제 Firestore 기반 실시간 시스템으로 전환됨.
   ========================================================= */
function ensureSocial(p) {
  if (!p.social) p.social = { friends: [], whispers: {}, blockedUsers: [] };
  if (!p.social.friends) p.social.friends = [];
  if (!p.social.whispers) p.social.whispers = {};
  if (!p.social.blockedUsers) p.social.blockedUsers = [];
}
async function sendFriendRequest(p, candidate) {
  ensureSocial(p);
  if (p.social.friends.some(f => f.userId === candidate.userId)) return { ok: false, reason: "이미 친구예요." };
  if (!window.KBOCloud || !window.KBOCloud.sendFriendRequest) return { ok: false, reason: "서버에 연결되어 있지 않아요." };
  const result = await window.KBOCloud.sendFriendRequest(candidate.userId, candidate.nickname, candidate.teamId, p.nickname || "익명", p.teamId);
  return result;
}
// 내가 보낸 요청 중 상대가 수락/거절한 게 있으면 반영하고 정리함 (친구 화면 진입 시 호출)
async function resolveOutgoingRequests(p) {
  ensureSocial(p);
  if (!window.KBOCloud || !window.KBOCloud.fetchOutgoingFriendRequests) return false;
  const result = await window.KBOCloud.fetchOutgoingFriendRequests();
  if (!result.ok) return false;
  let changed = false;
  for (const req of result.rows) {
    if (req.status === "accepted") {
      if (!p.social.friends.some(f => f.userId === req.toUid)) {
        p.social.friends.push({ userId: req.toUid, nickname: req.toNickname, teamId: req.toTeamId, addedAt: Date.now() });
        toast(`🎉 ${req.toNickname}님과 친구가 되었어요!`);
        changed = true;
      }
      await window.KBOCloud.deleteFriendRequest(req.requestId);
    } else if (req.status === "rejected") {
      toast(`${req.toNickname}님이 친구 요청을 거절했어요.`);
      await window.KBOCloud.deleteFriendRequest(req.requestId);
      changed = true;
    }
  }
  return changed;
}
async function respondIncomingRequest(p, requestId, accept, req) {
  ensureSocial(p);
  if (!window.KBOCloud || !window.KBOCloud.respondFriendRequest) return { ok: false };
  const result = await window.KBOCloud.respondFriendRequest(requestId, accept);
  if (!result.ok) return { ok: false };
  if (accept && req) p.social.friends.push({ userId: req.fromUid, nickname: req.fromNickname, teamId: req.fromTeamId, addedAt: Date.now() });
  return { ok: true, nickname: req ? req.fromNickname : "" };
}
function removeFriend(p, userId) {
  ensureSocial(p);
  p.social.friends = p.social.friends.filter(f => f.userId !== userId);
}
// 귓속말: 친구별로 로컬에만 저장되는 1:1 대화 로그. 실제로 상대에게 전송되지는 않음(로컬 프로토타입).
// v2.51: 채팅/귓속말 자체 검열 - 욕설/성적 표현/혐오 표현을 자동으로 별표 처리함.
// 아래 목록은 기본적인 수준만 넣어둔 것이라, 필요하면 이 배열에 단어를 추가해서 계속 확장하면 됨.
const CHAT_FILTER_WORDS = [
  "씨발", "시발", "ㅅㅂ", "병신", "ㅄ", "ㅂㅅ", "지랄", "ㅈㄹ", "개새끼", "새끼", "좆", "니미", "미친놈", "미친년", "썅", "닥쳐", "애미",
  "fuck", "shit", "bitch", "asshole", "nigger", "cunt", "faggot",
  "섹스", "ㅅㅅ", "자지", "보지", "떡치", "성기", "야동",
  "틀딱", "한남충", "한녀충", "김치녀", "맘충", "장애인새끼", "급식충",
];
function escapeRegExpChars(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function censorMessage(text) {
  let out = text;
  CHAT_FILTER_WORDS.forEach(word => {
    if (!word) return;
    const re = new RegExp(escapeRegExpChars(word), "gi");
    out = out.replace(re, m => "*".repeat(m.length));
  });
  return out;
}

function sendWhisper(p, userId, text) {
  ensureSocial(p);
  const clean = censorMessage(text);
  if (!p.social.whispers[userId]) p.social.whispers[userId] = [];
  p.social.whispers[userId].push({ fromMe: true, text: clean, ts: Date.now() });
  if (p.social.whispers[userId].length > 200) p.social.whispers[userId] = p.social.whispers[userId].slice(-200);
}
const WHISPER_AUTO_REPLIES = [
  "ㅋㅋㅋ 그러게요!", "오 좋은 정보 감사해요", "오늘 카드 잘 나왔어요?", "저도 럭키머신 돌려봐야겠어요",
  "화이팅입니다!", "다음에 감독모드 한 판 하실래요?", "네넵 알겠습니다!", "구단 랭킹 같이 올려봐요",
  "요즘 카드연구소 재밌더라고요", "슈퍼럭키머신 대박 나셨나요?",
];
function maybeAutoReplyWhisper(p, userId) {
  ensureSocial(p);
  if (!p.social.whispers[userId]) p.social.whispers[userId] = [];
  const reply = WHISPER_AUTO_REPLIES[Math.floor(Math.random() * WHISPER_AUTO_REPLIES.length)];
  p.social.whispers[userId].push({ fromMe: false, text: reply, ts: Date.now() });
}

// 채팅 - 지금은 서버가 없어서 이 기기 안에서만 보이는 로컬 채팅. 실시간 멀티서버 연동 시
// 이 저장 함수(loadChatLog/saveChatLog)만 서버 API 호출로 교체하면 되도록 구조를 분리해둠.
const CHAT_KEY = "kbo_touch_chat_log";
function loadChatLog() {
  try { return JSON.parse(localStorage.getItem(CHAT_KEY) || "[]"); } catch (e) { return []; }
}
function saveChatLog(log) {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify(log.slice(-200))); } catch (e) {}
}

// v2.68: 채팅을 로컬(localStorage) 방식에서 실제 Firestore 실시간 채팅으로 전환함.
// 화면을 나갈 때 이전 구독을 반드시 해제해야 중복 구독(+중복 렌더링)이 쌓이지 않음.
let chatListenerUnsub = null;
function renderChat(content, p) {
  const team = TEAMS.find(t => t.id === p.teamId);
  if (chatListenerUnsub) { chatListenerUnsub(); chatListenerUnsub = null; }
  const hasCloud = !!(window.KBOCloud && window.KBOCloud.getUid());
  content.innerHTML = `
    <div class="sub" style="margin-bottom:8px;">${hasCloud ? "🌐 실시간 채팅이에요. 다른 접속자와 실제로 대화할 수 있어요." : "🚧 서버에 연결되지 않아서 채팅을 사용할 수 없어요."}</div>
    <div id="chatLogWrap" style="height:52vh; overflow-y:auto; background:#0B0B12; border-radius:8px; padding:10px; margin-bottom:10px;"></div>
    <div style="display:flex; gap:6px;">
      <input id="chatInput" type="text" maxlength="200" placeholder="메시지를 입력하세요" ${hasCloud ? "" : "disabled"}
        style="flex:1; box-sizing:border-box; padding:10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:13px;">
      <button id="chatSendBtn" ${hasCloud ? "" : "disabled"} style="padding:10px 16px; border:none; border-radius:8px; background:${team.color}; color:#fff; font-weight:700;">전송</button>
    </div>
  `;
  function draw(log) {
    const wrap = document.getElementById("chatLogWrap");
    if (!wrap || state.tab !== "chat") return; // 이미 다른 화면으로 이동했으면 아무것도 안 함
    if (!log || log.length === 0) {
      wrap.innerHTML = `<div class="sub">아직 메시지가 없어요. 첫 메시지를 남겨보세요!</div>`;
      return;
    }
    wrap.innerHTML = log.map(m => {
      const timeStr = new Date(m.clientTime || m.ts || Date.now()).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      return `<div style="margin-bottom:8px;">
        <span style="font-size:10px; color:#666; margin-right:4px;">${timeStr}</span>
        <span style="color:${m.tierColor || "#666"}; font-size:10px; font-weight:800;">[${escapeHtml(m.tierLabel || "순위 외")}]</span>
        <span style="font-weight:700; font-size:12px;">[${escapeHtml(m.nickname || "익명")}]</span>
        ${m.title ? `<span style="color:${m.titleColor || "#ffd700"}; font-size:11px;">[${escapeHtml(m.title)}]</span>` : ""}
        <div style="color:#eee; font-size:13px; margin-top:2px;">${escapeHtml(m.text || "")}</div>
      </div>`;
    }).join("");
    wrap.scrollTop = wrap.scrollHeight;
  }
  if (hasCloud) {
    chatListenerUnsub = window.KBOCloud.listenChatMessages(50, (rows) => draw(rows));
  } else {
    draw([]);
  }
  const input = document.getElementById("chatInput");
  const send = async () => {
    const text = input.value.trim();
    if (!text || !hasCloud) return;
    const titleLabel = p.equippedTitle && TITLES[p.equippedTitle] ? TITLES[p.equippedTitle].label : null;
    const titleColor = p.equippedTitle && TITLES[p.equippedTitle] ? TITLES[p.equippedTitle].color : null;
    const isManagerUnlocked = isFeatureUnlocked(p, "manager");
    const tier = isManagerUnlocked ? getManagerTier(p.managerRating || 0) : null;
    input.value = "";
    const result = await window.KBOCloud.sendChatMessage({
      nickname: p.nickname || team.name, teamId: p.teamId, text: censorMessage(text.slice(0, 200)),
      title: titleLabel, titleColor: titleColor,
      tierLabel: tier ? tier.name : "순위 외", tierColor: tier ? tier.color : "#666",
    });
    if (!result.ok) toast("메시지 전송에 실패했어요.");
  };
  document.getElementById("chatSendBtn").onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}

async function renderFriends(content, p) {

    ? await window.KBOCloud.fetchIncomingFriendRequests()

    { id: "outgoing", label: `📤 보낸 요청` },
    { id: "search", label: "🔍 친구 찾기" },

    <div style="display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;">

    </div>
    <div id="friendsBody"></div>
  `;
  content.querySelectorAll(".friendsSubTab").forEach(b => {
    b.onclick = () => { state.friendsSubTab = b.dataset.sub; renderFriends(content, p); };
  });
  const body = document.getElementById("friendsBody");

  if (state.friendsSubTab === "list") {
    if (p.social.friends.length === 0) {
      body.innerHTML = `<div class="sub" style="margin-top:20px;">아직 친구가 없어요. [🔍 친구 찾기] 탭에서 친구를 추가해보세요.</div>`;
      return;
    }
    p.social.friends.forEach(f => {
      const t = TEAMS.find(x => x.id === f.teamId);
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span>${escapeHtml(f.nickname)} ${t ? `<span style="color:${t.color}; font-size:10px;">[${t.name}]</span>` : ""}</span>
        <span style="display:flex; gap:6px;">
          <button class="whisperBtn" style="padding:6px 10px; border:none; border-radius:6px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-size:11px; font-weight:700;">💬 귓속말</button>
          <button class="blockFriendBtn" style="padding:6px 10px; border:none; border-radius:6px; background:#8b1a1a; color:#fff; font-size:11px;">🚫 차단</button>
          <button class="removeFriendBtn" style="padding:6px 10px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;">삭제</button>
        </span>
      `;
      row.querySelector(".whisperBtn").onclick = () => { state.whisperTarget = f; state.tab = "whisper"; render(); };
      row.querySelector(".blockFriendBtn").onclick = async () => {
        const ok = await askConfirm(`${f.nickname}님을 차단할까요? 서로 메시지를 주고받을 수 없게 돼요.`, "차단하기");
        if (!ok) return;
        if (!p.social.blockedUsers.includes(f.userId)) p.social.blockedUsers.push(f.userId);
        await saveProfile(p);
        toast(`${f.nickname}님을 차단했어요.`);
        renderFriends(content, p);
      };
      row.querySelector(".removeFriendBtn").onclick = async () => {
        const ok = await askConfirm(`${f.nickname}님을 친구 목록에서 삭제할까요?`, "친구 삭제");
        if (!ok) return;
        removeFriend(p, f.userId);
        await saveProfile(p);
        renderFriends(content, p);
      };
      body.appendChild(row);
    });
    return;
  }

  if (state.friendsSubTab === "incoming") {
    if (state.incomingFriendRequests.length === 0) {
      body.innerHTML = `<div class="sub" style="margin-top:20px;">받은 친구 요청이 없어요.</div>`;
      return;
    }
    state.incomingFriendRequests.forEach(req => {
      const t = TEAMS.find(x => x.id === req.fromTeamId);
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span>${escapeHtml(req.fromNickname)} ${t ? `<span style="color:${t.color}; font-size:10px;">[${t.name}]</span>` : ""}</span>
        <span style="display:flex; gap:6px;">
          <button class="acceptReqBtn" style="padding:6px 10px; border:none; border-radius:6px; background:#4caf50; color:#fff; font-size:11px; font-weight:700;">수락</button>
          <button class="declineReqBtn" style="padding:6px 10px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;">거절</button>
        </span>
      `;
      row.querySelector(".acceptReqBtn").onclick = async () => {
        const result = await respondIncomingRequest(p, req.requestId, true, req);
        if (result.ok) {
          await saveProfile(p);
          toast(`${result.nickname}님과 친구가 되었어요!`);

        renderFriends(content, p);
      };
      row.querySelector(".declineReqBtn").onclick = async () => {
        await respondIncomingRequest(p, req.requestId, false, req);
        renderFriends(content, p);
      };
      body.appendChild(row);

      ? await window.KBOCloud.fetchOutgoingFriendRequests()

    if (state.tab !== "friends" || state.friendsSubTab !== "outgoing") return; // 그 사이 화면이 바뀌었으면 중단

    if (pending.length === 0) {
      body.innerHTML = `<div class="sub" style="margin-top:20px;">보낸 친구 요청이 없어요.</div>`;
      return;
    }
    body.innerHTML = "";
    pending.forEach(req => {
      const t = TEAMS.find(x => x.id === req.toTeamId);
      const row = document.createElement("div");

      row.innerHTML = `<span>${escapeHtml(req.toNickname)} ${t ? `<span style="color:${t.color}; font-size:10px;">[${t.name}]</span>` : ""}</span><span style="color:#999; font-size:11px;">응답 대기중...</span>`;
      body.appendChild(row);
    });

  }

  if (state.friendsSubTab === "search") {
    body.innerHTML = `
      <input id="friendSearchInput" type="text" placeholder="🔍 닉네임으로 검색 (비워두면 추천 목록)"

      <div id="friendSearchStatus" class="sub" style="margin-bottom:4px; display:none;"></div>
      <div id="friendSearchResults"></div>
    `;

    const statusEl = document.getElementById("friendSearchStatus");

    function renderResultRow(c, isRealPlayer) {
      const isFriend = p.social.friends.some(f => f.userId === c.userId);
      const isPending = !!(state.pendingOutgoingUids && state.pendingOutgoingUids.has(c.userId));
      const t = TEAMS.find(x => x.id === c.teamId);
      const label = isFriend ? "이미 친구" : isPending ? "대기중" : "요청 보내기";
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span>${escapeHtml(c.nickname)} ${isRealPlayer ? '<span style="color:#4caf50; font-size:9px; font-weight:700;">🌐 실제유저</span>' : ""} ${t ? `<span style="color:${t.color}; font-size:10px;">[${t.name}]</span>` : ""}</span>
        <button class="addFriendBtn" style="padding:6px 10px; border:none; border-radius:6px; background:${isFriend || isPending ? "#444" : "linear-gradient(135deg,#e6417f,#9e0038)"}; color:#fff; font-size:11px; font-weight:700;" ${isFriend || isPending ? "disabled" : ""}>${label}</button>
      `;
      row.querySelector(".addFriendBtn").onclick = async () => {
        if (isFriend || isPending) return;
        const result = await sendFriendRequest(p, c);
        if (!result.ok) { toast(result.reason || "요청을 보내지 못했어요."); return; }
        if (!state.pendingOutgoingUids) state.pendingOutgoingUids = new Set();
        state.pendingOutgoingUids.add(c.userId);

    async function drawResults(keyword) {
      const kw = (keyword || "").trim();
      if (!kw) {
        statusEl.style.display = "none";
        resultsEl.innerHTML = `<div class="sub">닉네임을 입력해서 실제 유저를 검색해보세요.</div>`;
        return;
      }
      if (window.KBOCloud && window.KBOCloud.searchProfilesByNickname) {
        statusEl.style.display = "block";
        statusEl.textContent = "🌐 서버에서 검색 중...";
        const result = await window.KBOCloud.searchProfilesByNickname(kw, 15);
        if (document.getElementById("friendSearchInput")?.value.trim() !== kw) return; // 그 사이 검색어가 바뀌었으면 무시
        if (result.ok && result.rows.length > 0) {
          statusEl.textContent = `🌐 실제 유저 ${result.rows.length}명 찾음`;
          resultsEl.innerHTML = "";
          result.rows.forEach(r => renderResultRow(r, true));
          return;
        }
        statusEl.textContent = result.ok ? "" : "서버 검색에 실패했어요.";
        resultsEl.innerHTML = `<div class="sub">${result.ok ? "일치하는 실제 유저가 없어요." : "검색에 실패했어요. 잠시 후 다시 시도해주세요."}</div>`;
      } else {
        statusEl.style.display = "none";
        resultsEl.innerHTML = `<div class="sub">서버에 연결되어 있지 않아요.</div>`;
      }
    }

    drawResults("");
    let searchDebounce = null;
    document.getElementById("friendSearchInput").addEventListener("input", (e) => {
      clearTimeout(searchDebounce);
      const val = e.target.value;
      searchDebounce = setTimeout(() => drawResults(val), 350); // 실시간 서버 검색이라 타이핑마다 바로 쏘지 않고 살짝 모아서 보냄
    });
    return;
  }

  if (state.friendsSubTab === "blocked") {
    if (p.social.blockedUsers.length === 0) {
      body.innerHTML = `<div class="sub" style="margin-top:20px;">차단한 유저가 없어요.</div>`;
      return;
    }
    p.social.blockedUsers.forEach(userId => {
      // 차단된 유저 정보는 친구 목록이나 귓속말 대화 기록에서 찾아서 표시함 (닉네임 표시용)
      const fromFriend = p.social.friends.find(f => f.userId === userId);

        <button class="unblockBtn" style="padding:6px 10px; border:none; border-radius:6px; background:#4caf50; color:#fff; font-size:11px; font-weight:700;">차단 해제</button>
      `;
      row.querySelector(".unblockBtn").onclick = async () => {
        p.social.blockedUsers = p.social.blockedUsers.filter(id => id !== userId);
        await saveProfile(p);
        toast(`${nickname}님을 차단 해제했어요.`);
        renderFriends(content, p);
      };
      body.appendChild(row);
    });
    return;
  }
}

      <button id="whisperBlockBtn" style="flex-shrink:0; margin-left:8px; padding:6px 10px; border:none; border-radius:8px; background:${isBlocked ? "linear-gradient(155deg,#3a3a47,#232330)" : "#8b1a1a"}; color:#fff; font-size:11px; font-weight:700;">${isBlocked ? "차단 해제" : "🚫 차단"}</button>
    </div>
    ${isBlocked ? `<div class="sub" style="margin-bottom:8px; color:#e53935;">이 유저를 차단했어요. 메시지를 보내거나 받을 수 없어요. (차단 해제는 친구 탭에서도 가능해요)</div>` : ""}
    <div id="whisperLog" style="height:50vh; overflow-y:auto; background:#0B0B12; border-radius:8px; padding:10px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;"></div>
    <div style="display:flex; gap:6px;">
      <input id="whisperInput" type="text" maxlength="200" placeholder="메시지 입력..." ${isBlocked || !hasCloud ? "disabled" : ""}
        style="flex:1; box-sizing:border-box; padding:10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:13px;">
      <button id="whisperSendBtn" ${isBlocked || !hasCloud ? "disabled" : ""} style="padding:10px 16px; border:none; border-radius:8px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-weight:700;">전송</button>
    </div>
  `;
  document.getElementById("whisperBlockBtn").onclick = async () => {
    if (isBlocked) {
      p.social.blockedUsers = p.social.blockedUsers.filter(id => id !== target.userId);
      toast(`${target.nickname}님을 차단 해제했어요.`);
    } else {
      const ok = await askConfirm(`${target.nickname}님을 차단할까요? 서로 메시지를 주고받을 수 없게 돼요.`, "차단하기");
      if (!ok) return;
      p.social.blockedUsers.push(target.userId);
      toast(`${target.nickname}님을 차단했어요.`);
    }
    await saveProfile(p);
    renderWhisper(content, p);
  };
  const myUid = hasCloud ? window.KBOCloud.getUid() : null;
  function draw(list) {
    const logEl = document.getElementById("whisperLog");
    if (!logEl || state.tab !== "whisper" || !state.whisperTarget || state.whisperTarget.userId !== target.userId) return;
    if (!list || list.length === 0) {
      logEl.innerHTML = `<div class="sub">아직 대화가 없어요. 첫 메시지를 보내보세요!</div>`;
      return;
    }
    logEl.innerHTML = list.map(m => {
      const fromMe = m.fromUid === myUid;
      return `<div style="align-self:${fromMe ? "flex-end" : "flex-start"}; background:${fromMe ? "linear-gradient(135deg,#e6417f,#9e0038)" : "linear-gradient(155deg,#2a2a35,#1a1a22)"}; padding:8px 12px; border-radius:14px; max-width:75%; font-size:13px; word-break:break-word;">
        ${escapeHtml(m.text || "")}
      </div>`;
    }).join("");
    logEl.scrollTop = logEl.scrollHeight;
  }
  if (hasCloud && !isBlocked) {
    whisperListenerUnsub = window.KBOCloud.listenWhisperConversation(target.userId, 200, draw);
  } else {
    draw([]);
  }
  const input = document.getElementById("whisperInput");
  const send = async () => {
    if (isBlocked || !hasCloud) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const result = await window.KBOCloud.sendWhisperMessage(target.userId, censorMessage(text.slice(0, 200)));
    if (!result.ok) toast("메시지 전송에 실패했어요.");
  };
  document.getElementById("whisperSendBtn").onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}

function formatMMSS(ms) {
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

let touchBoostStatusTimer = null;
function renderTouch(content, p, team) {
  const autoOn = p.autoTapLevel > 0 && p.autoTapEnabled !== false;
  const autoActiveLevel = Math.max(0, Math.min(p.autoTapActiveLevel || p.autoTapLevel || 0, p.autoTapLevel || 0));

  content.innerHTML = `
    <div class="sub" id="boostStatusBar"></div>
    <div id="touchArea" class="center" style="min-height:60vh; justify-content:center; cursor:pointer;">
      <div class="tapLabel">내 TAP</div>
      <div class="tapValue">${Math.floor(p.personalTap).toLocaleString()}</div>
      <div id="tapBtn" class="${getEquippedSkinStyle(p, team).className}" style="${getEquippedSkinStyle(p, team).style}">TAP</div>
      <div id="floatWrap"></div>
      <div class="sub" style="margin-top:14px">화면 아무 곳이나 터치하세요${autoOn ? ` · 🤖 오토터치 Lv.${autoActiveLevel} 작동중` : (p.autoTapLevel > 0 ? " · 🤖 오토터치 OFF" : "")}</div>
    </div>
  `;

  // 부스트 남은 시간을 1초마다 실시간 갱신 - 화면 이동/재진입 없이도 00:00이 되면 즉시 사라짐
  if (touchBoostStatusTimer) clearInterval(touchBoostStatusTimer);
  function drawBoostStatus() {
    const bar = document.getElementById("boostStatusBar");
    if (!bar) { clearInterval(touchBoostStatusTimer); return; }
    const gradeActive = p.activeBoost && p.activeBoost.expiresAt > Date.now();
    const effectiveAdBoost = getEffectiveAdBoost(p);
    const adActive = effectiveAdBoost && effectiveAdBoost.expiresAt > Date.now();
    const parts = [];
    if (gradeActive) parts.push(`⚡ 일반 부스트 ${p.activeBoost.grades[0]} ×${p.activeBoost.multiplier} · 남은 시간 ${formatMMSS(p.activeBoost.expiresAt - Date.now())}`);
    if (adActive) parts.push(`📺 광고 부스트 ×${effectiveAdBoost.multiplier} · 남은 시간 ${effectiveAdBoost.expiresAt === Infinity ? "∞" : formatMMSS(effectiveAdBoost.expiresAt - Date.now())}`);
    bar.innerHTML = parts.length ? parts.join("<br>") : "";
  }
  drawBoostStatus();
  touchBoostStatusTimer = setInterval(drawBoostStatus, 1000);

  const touchArea = document.getElementById("touchArea");

  async function processOneTap() {
    playSound("tap", "tap");
    const mult = getEquippedTapMultiplier(p);
    p.personalTap += mult;
    const reward = rollTouchReward(p.activeBoost, p.pity, getEffectiveAdBoost(p), getEquippedDropRateMultiplier(p));

    showFloat("+1 TAP");

    bumpMission(p, "touch", 1);
    ensureSeason(p);
    p.season.touchCount += 1;
    await bumpTeamWeeklyContribution(p, 1);

    if (reward.type === "coin") {
      const coinAmt = Math.round(reward.amount * getEquippedCoinMultiplier(p));
      p.coins += coinAmt;
      if (coinAmt >= 15) showFloat(`CRITICAL! +${coinAmt} COIN`);
    } else {
      const grade = getGrade(reward.gradeId);
      if (isAutoDismantleMatch(p, reward)) {
        const ovr = rollOVR(reward.gradeId);
        const coinGain = grade.special ? 50000000 : Math.floor(grade.coin[0] + Math.random() * (grade.coin[1]-grade.coin[0]));
        p.coins += Math.round(coinGain * getEquippedCoinMultiplier(p));
        p.materialsByType[grade.materialType] = (p.materialsByType[grade.materialType] || 0) + Math.round(grade.materialAmt * getEquippedMaterialMultiplier(p));
        p.stats_dismantleCount = (p.stats_dismantleCount || 0) + 1;
        markDexUnlocked(p, { teamId: reward.teamId, playerName: reward.playerName, gradeId: reward.gradeId, ovr });
        showFloat(`♻️ 자동분해: ${reward.playerName}`);
      } else {
        const card = createCard(reward);
        p.cards.push(card);
        markDexUnlocked(p, card);
        showCardEffect(grade, reward.teamName + " " + reward.playerName);
      }
      updatePity(p.pity, reward.gradeId);
      bumpMission(p, "cardObtain", 1);
      if (["RARE","EPIC","UNIQUE","MYSTIC","LEGENDARY","TRANSCENDENT"].includes(reward.gradeId)) bumpMission(p, "rarePlusObtain", 1);
      if (reward.gradeId === "TRANSCENDENT") {
        toast(`⚡ 서버 알림: TRANSCENDENT ${reward.teamName} ${reward.playerName} 획득! (최초 발견자: 나)`);
        pushAnnouncement(`🎉 초월 등장! ${p.nickname || team.name} 님이 TRANSCENDENT ${reward.teamName} ${reward.playerName}을(를) 획득했어요!`);
      }
    }

    await saveProfile(p);
    const newTotal = await bumpTeamTotal(team.id, 1);
    state.teamTotals[team.id] = newTotal;

    const tv = document.querySelector(".tapValue");
    if (tv) tv.textContent = Math.floor(p.personalTap).toLocaleString();
    const pill = document.querySelector(".pill");
    if (pill) pill.innerHTML = `<span class="curColor">${state.currencyDisplay === "diamond" ? "💎 " + p.diamonds.toLocaleString() : "🪙 " + p.coins.toLocaleString()}</span>`;
  }

  // touchstart로 각 손가락(터치포인트)마다 개별 처리 -> 동시에 여러 곳 터치해도 씹히지 않음
  touchArea.addEventListener("touchstart", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      processOneTap();
    }
  }, { passive: false });

  // 터치스크린이 아닌 환경(마우스/데스크탑 테스트용) 폴백
  touchArea.addEventListener("click", () => {
    processOneTap();
  });
}

function renderSkinShop(content, p) {
  ensureSkins(p);
  const team = TEAMS.find(t => t.id === p.teamId);
  content.innerHTML = `
    <div class="sectionTitle">🌀 터치 스킨</div>
    <div class="sub" style="margin-bottom:12px;">메인 터치 버튼의 겉모습만 바꾸는 순수 꾸미기 아이템이에요. 확률/재화 등 게임 밸런스에는 전혀 영향을 주지 않아요.</div>
    <div class="row"><span>보유 다이아</span><span style="font-weight:800;">💎 ${p.diamonds.toLocaleString()}</span></div>
    <div class="cardGrid" id="skinGrid" style="margin-top:12px;"></div>
  `;
  const grid = document.getElementById("skinGrid");
  TAP_SKINS.forEach(skin => {
    const owned = p.ownedSkins.includes(skin.id);
    const equipped = p.equippedSkin === skin.id;
    const previewStyle = skin.id === "default"
      ? `background:${team.color};`
      : skin.isBaseball
      ? BASEBALL_SKIN_CSS
      : skin.pearl
      ? `background: linear-gradient(90deg,#ffd1e3,#c8f4ff,#fff6c9,#d9ffd6,#e6d1ff,#ffd1e3); background-size:400% 100%; animation: pearlShift 1.4s linear infinite;`
      : `background:${skin.gradient};`;

    const card = document.createElement("div");
    card.className = "cardItem";
    card.style.borderColor = equipped ? "#d9b45c" : "transparent";
    card.style.textAlign = "center";
    const priceLabel = skin.packageOnly ? "📦 패키지 전용" : skin.price === 0 ? "기본 제공" : `💎 ${skin.price.toLocaleString()}`;
    const btnLabel = equipped ? "장착중" : owned ? "장착하기" : skin.packageOnly ? "미보유" : "구매하기";
    const btnDisabled = equipped || (skin.packageOnly && !owned);
    card.innerHTML = `
      <div style="width:64px; height:64px; border-radius:50%; margin:4px auto 10px; box-shadow:0 6px 16px rgba(0,0,0,0.4); ${previewStyle}"></div>
      <div class="name" style="text-align:center; font-weight:800;">${skin.name}</div>
      <div style="color:${skin.packageOnly && !owned ? "#d9b45c" : "#999"}; font-size:11px; margin-top:2px; text-align:center;">${priceLabel}</div>
      <button class="skinActionBtn" ${btnDisabled ? "disabled" : ""}>${btnLabel}</button>
    `;
    card.querySelector(".skinActionBtn").onclick = async () => {
      if (equipped || (skin.packageOnly && !owned)) return;
      if (!owned) {
        if (p.diamonds < skin.price) { toast("다이아가 부족해요."); return; }
        p.diamonds -= skin.price;
        p.ownedSkins.push(skin.id);
      }
      p.equippedSkin = skin.id;
      await saveProfile(p);
      toast(`${skin.name} 스킨을 장착했어요!`);
      renderSkinShop(content, p);
    };
    grid.appendChild(card);
  });
}

function renderPity(content, p) {
  content.innerHTML = `<div class="sectionTitle">천장 (등급별 카드드랍 횟수 기준, TAP 횟수 아님)</div><div id="pityList"></div>
    <div class="sub" style="margin-top:10px">해당 등급(또는 그 이상)을 못 얻은 채 카드드랍이 임계치를 넘으면 다음 카드드랍에서 강제로 지급돼요.</div>`;
  const list = document.getElementById("pityList");
  Object.keys(PITY_THRESHOLDS).forEach(gid => {
    const grade = getGrade(gid);
    const count = (p.pity && p.pity[gid]) || 0;
    const threshold = PITY_THRESHOLDS[gid];
    const remaining = Math.max(0, threshold - count);
    const pct = Math.min(100, Math.floor((count / threshold) * 100));
    const row = document.createElement("div");
    row.style.marginBottom = "10px";
    row.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
        <span style="color:${grade.color}; font-weight:700;">${grade.label}</span>
        <span style="color:#999;">${count.toLocaleString()} / ${threshold.toLocaleString()} · 다음 천장까지 ${remaining.toLocaleString()}장</span>
      </div>
      <div style="background:linear-gradient(155deg,#20202c,#131319); border-radius:6px; height:10px; overflow:hidden;">
        <div style="width:${pct}%; height:100%; background:${grade.color};"></div>
      </div>
    `;
    list.appendChild(row);
  });

  const t = getGrade("TRANSCENDENT");
  const noPity = document.createElement("div");
  noPity.style.cssText = "margin-top:16px; padding:12px; background:linear-gradient(155deg,#20202c,#131319); border-radius:8px; border:1px dashed #555;";
  noPity.innerHTML = `<span style="color:${t.color}; font-weight:800;">TRANSCENDENT</span> <span style="color:#777; font-size:12px;">— NO PITY / 천장 없음 (순수 확률)</span>`;
  list.appendChild(noPity);
}

function renderDex(content, p, team) {
  if (!state.dexTeamFilter) state.dexTeamFilter = "all";
  if (!state.dexGradeFilter) state.dexGradeFilter = "all";

  // 도감은 영구기록(dexUnlocked) 기준 - 분해/판매해도 한번 얻었으면 계속 표시됨
  // 현재 보유 개수는 별도로 세서 뱃지로만 보여줌
  const currentCount = {}; // key -> 현재 보유 장수
  p.cards.forEach(c => {
    const key = `${c.teamId}_${c.playerName}_${c.gradeId}`;
    currentCount[key] = (currentCount[key] || 0) + 1;
  });
  const owned = p.dexUnlocked; // key -> { ovr, firstObtainedAt }

  // 도감 완성률은 TRANSCENDENT를 빼고 계산 (초월은 얻은 뒤에야 도감에 슬롯이 "생기는" 특별 취급)
  const totalSlotsAll = ALL_PLAYERS.length * (GRADES.length - 1);
  const ownedSlotsAll = Object.keys(owned).filter(k => !k.endsWith("_TRANSCENDENT")).length;

  content.innerHTML = `
    <div class="sectionTitle">전체 도감 완성률: ${ownedSlotsAll} / ${totalSlotsAll} (${Math.floor(ownedSlotsAll/totalSlotsAll*100)}%)</div>
    <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px;">
      <button class="dexFilterTeam" data-team="all" style="flex-shrink:0; padding:6px 10px; border-radius:8px; border:none; font-size:11px; background:${state.dexTeamFilter==='all'?'#fff':'linear-gradient(155deg,#20202c,#131319)'}; color:${state.dexTeamFilter==='all'?'#000':'#ccc'};">전체구단</button>
      ${TEAMS.map(t => `<button class="dexFilterTeam" data-team="${t.id}" style="flex-shrink:0; padding:6px 10px; border-radius:8px; border:none; font-size:11px; background:${state.dexTeamFilter===t.id?t.color:'linear-gradient(155deg,#20202c,#131319)'}; color:#fff;">${t.name}</button>`).join("")}
    </div>
    <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:10px;">
      <button class="dexFilterGrade" data-grade="all" style="flex-shrink:0; padding:6px 10px; border-radius:8px; border:none; font-size:11px; background:${state.dexGradeFilter==='all'?'#fff':'linear-gradient(155deg,#20202c,#131319)'}; color:${state.dexGradeFilter==='all'?'#000':'#ccc'};">전체등급</button>
      ${GRADES.map(g => `<button class="dexFilterGrade" data-grade="${g.id}" style="flex-shrink:0; padding:6px 10px; border-radius:8px; border:none; font-size:11px; background:${state.dexGradeFilter===g.id?g.color:'linear-gradient(155deg,#20202c,#131319)'}; color:${state.dexGradeFilter===g.id?'#000':'#ccc'};">${g.label}</button>`).join("")}
    </div>
    <div id="dexTable"></div>
  `;

  content.querySelectorAll(".dexFilterTeam").forEach(b => {
    b.onclick = () => { state.dexTeamFilter = b.dataset.team; renderDex(content, p, team); };
  });
  content.querySelectorAll(".dexFilterGrade").forEach(b => {
    b.onclick = () => { state.dexGradeFilter = b.dataset.grade; renderDex(content, p, team); };
  });

  const tableWrap = document.getElementById("dexTable");
  const gradesToShow = state.dexGradeFilter === "all" ? GRADES : [getGrade(state.dexGradeFilter)];
  const teamsToShow = state.dexTeamFilter === "all" ? TEAMS : TEAMS.filter(t => t.id === state.dexTeamFilter);
  // 특정 구단만 볼 땐 바로 펼치고, 전체구단 볼 땐 기본 접어서 렉 방지 (선수 50명 x 등급 다 그리면 무거움)
  const startExpanded = state.dexTeamFilter !== "all";

  function buildPlayerGrid(t, players) {
    const wrap = document.createElement("div");
    players.forEach(playerName => {
      const row = document.createElement("div");
      row.style.marginBottom = "8px";
      row.innerHTML = `<div style="font-size:12px; color:#ccc; margin-bottom:4px;">${playerName}</div>`;
      const gradeRow = document.createElement("div");
      gradeRow.style.display = "flex";
      gradeRow.style.gap = "5px";
      gradeRow.style.flexWrap = "wrap";
      gradesToShow.forEach(grade => {
        const key = `${t.id}_${playerName}_${grade.id}`;
        const info = owned[key];
        const has = !!info;
        if (grade.id === "TRANSCENDENT" && !has) return; // 초월은 얻기 전엔 도감에 아예 표시 안 함

        const nowCount = currentCount[key] || 0;
        const cell = document.createElement("div");
        const isTranscendentCell = grade.id === "TRANSCENDENT";
        cell.style.cssText = `
          width:44px; height:44px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
          font-size:8px; font-weight:800; text-align:center; position:relative;
          border:2px solid ${has ? (isTranscendentCell ? "#f3e9ff" : grade.color) : "#2a2a35"};
          background:${has ? grade.color + "22" : "#15151d"};
          color:${has ? grade.color : "#444"};
        `;
        cell.innerHTML = has
          ? `<div>${grade.label.slice(0,3)}</div><div style="font-size:8px; opacity:0.8;">${info.ovr}</div>`
          : `<div style="font-size:13px;">???</div>`;
        if (has && nowCount > 1) {
          const badge = document.createElement("div");
          badge.style.cssText = "position:absolute; top:-6px; right:-6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:9px; border-radius:8px; padding:1px 4px;";
          badge.textContent = "x" + nowCount;
          cell.appendChild(badge);
        }
        gradeRow.appendChild(cell);
      });
      row.appendChild(gradeRow);
      wrap.appendChild(row);
    });
    return wrap;
  }

  teamsToShow.forEach(t => {
    const players = TEAM_PLAYERS[t.id] || [];
    const gradesForCount = gradesToShow.filter(g => g.id !== "TRANSCENDENT");
    const countGrades = gradesForCount.length > 0 ? gradesForCount : gradesToShow; // 초월만 필터링한 경우엔 그대로 카운트
    const teamSlots = players.length * countGrades.length;
    const teamOwned = players.reduce((sum, pl) => sum + countGrades.filter(g => owned[`${t.id}_${pl}_${g.id}`]).length, 0);

    const teamBlock = document.createElement("div");
    teamBlock.style.marginBottom = "10px";
    const header = document.createElement("div");
    header.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:linear-gradient(155deg,#20202c,#131319); border-radius:8px; cursor:pointer;";
    header.innerHTML = `<span style="color:${t.color}; font-weight:700; font-size:13px;">${t.name}</span><span style="color:#999; font-size:12px;">${teamOwned}/${teamSlots} ${startExpanded ? "▾" : "▸"}</span>`;
    teamBlock.appendChild(header);

    const gridHolder = document.createElement("div");
    gridHolder.style.marginTop = "8px";
    teamBlock.appendChild(gridHolder);

    let built = false;
    function expand() {
      if (!built) { gridHolder.appendChild(buildPlayerGrid(t, players)); built = true; }
      gridHolder.style.display = "block";
      header.querySelector("span:last-child").textContent = `${teamOwned}/${teamSlots} ▾`;
    }
    function collapse() {
      gridHolder.style.display = "none";
      header.querySelector("span:last-child").textContent = `${teamOwned}/${teamSlots} ▸`;
    }

    if (startExpanded) { expand(); } else { collapse(); }
    header.onclick = () => {
      if (gridHolder.style.display === "none") expand(); else collapse();
    };

    tableWrap.appendChild(teamBlock);
  });

// 부스트 구매/활성화
// 재화상점에서 사면 즉시 적용이 아니라 인벤토리에 개수로 쌓이고, "부스트 보관함" 메뉴에서 직접 활성화한다.
// 같은 등급 부스트는 여러 개를 이어서 활성화(지속시간만 늘어남, 확률배수는 그대로) 가능하지만
// 다른 등급 부스트가 이미 활성화되어 있으면 동시에 쓸 수 없다.
//
// v2.36: 부스트를 "귀속(bound)"과 "거래가능(tradeable)"으로 나눠서 따로 셈.
// 재화상점에서 코인으로 산 건 귀속 - 거래소에 못 올림. 럭키머신/이벤트/업적/쿠폰으로 받은 건 거래가능 - 거래소에 올릴 수 있음.
// 활성화(사용)할 때는 둘 중 아무거나 상관없이 소모됨(귀속분을 먼저 소모).
// ---------------------------------------------------------------------------
function ensureBoostEntry(p, boostId) {
  const cur = p.boostInventory[boostId];
  if (!cur || typeof cur !== "object") {
    // 구버전 호환: 예전엔 부스트 개수가 그냥 숫자 하나였음 -> 전부 귀속(bound)으로 이전
    const legacyCount = typeof cur === "number" ? cur : 0;
    p.boostInventory[boostId] = { bound: legacyCount, tradeable: 0 };
  }
  return p.boostInventory[boostId];
}
function getBoostTotalCount(p, boostId) {
  if (!p.boostInventory[boostId]) return 0;
  const e = ensureBoostEntry(p, boostId);
  return (e.bound || 0) + (e.tradeable || 0);
}
function getTradeableBoostCount(p, boostId) {
  if (!p.boostInventory[boostId]) return 0;
  return ensureBoostEntry(p, boostId).tradeable || 0;
}
function addBoundBoost(p, boostId, count) {
  const e = ensureBoostEntry(p, boostId);
  e.bound += count;
}
function addTradeableBoost(p, boostId, count) {
  const e = ensureBoostEntry(p, boostId);
  e.tradeable += count;
}
// 활성화(사용) 시 소모 - 귀속분을 먼저 쓰고 모자라면 거래가능분에서 마저 씀 (사용에는 구분이 의미 없음)
function consumeAnyBoost(p, boostId, count) {
  const e = ensureBoostEntry(p, boostId);
  let remain = count;
  const fromBound = Math.min(e.bound, remain);
  e.bound -= fromBound; remain -= fromBound;
  const fromTradeable = Math.min(e.tradeable, remain);
  e.tradeable -= fromTradeable; remain -= fromTradeable;
  return remain === 0;
}
function consumeTradeableBoost(p, boostId, count) {
  const e = ensureBoostEntry(p, boostId);
  if (e.tradeable < count) return false;
  e.tradeable -= count;
  return true;
}
function buyBoostToInventory(p, boostId) {
  const def = BOOSTS.find(b => b.id === boostId);
  if (!def) return { ok: false, reason: "존재하지 않는 부스트예요." };
  if (p.coins < def.cost) return { ok: false, reason: "코인이 부족해요." };
  p.coins -= def.cost;
  addBoundBoost(p, boostId, 1); // 재화상점 구매 = 귀속(거래 불가)
  return { ok: true };
}

function activateBoostFromInventory(p, boostId) {
  const def = ALL_BOOST_DEFS.find(b => b.id === boostId); // v2.0: 슈퍼 럭키머신 전용 부스트도 여기서 조회됨
  if (!def) return { ok: false, reason: "존재하지 않는 부스트예요." };
  if (!(getBoostTotalCount(p, boostId) > 0)) return { ok: false, reason: "보유한 부스트가 없어요." };

  const currentlyActive = p.activeBoost && p.activeBoost.expiresAt > Date.now();
  if (currentlyActive && p.activeBoost.boostId !== boostId) {
    return { ok: false, reason: "다른 등급 부스트가 이미 활성화 중이에요. 같은 등급 부스트만 중첩해서 쓸 수 있어요." };
  }

  consumeAnyBoost(p, boostId, 1);
  if (currentlyActive && p.activeBoost.boostId === boostId) {
    p.activeBoost.expiresAt += def.durationMs; // 같은 부스트 추가 사용 -> 지속시간만 연장 (배율은 그대로)
  } else {
    p.activeBoost = { boostId, grades: def.grades, multiplier: def.multiplier, expiresAt: Date.now() + def.durationMs };
  }
  return { ok: true };
}

// 광고 부스트 시청(mock): 나중에 실제 광고 SDK의 "시청완료" 콜백에서 이 함수만 호출하면 됨
// 진행 중인 광고부스트는 연장 불가 - 끝난 뒤에만 다시 볼 수 있음
function watchAdForBoost(p, adBoostId) {
  const def = AD_BOOSTS.find(a => a.id === adBoostId);
  if (!def) return { ok: false };
  const currentlyActive = p.activeAdBoost && p.activeAdBoost.expiresAt > Date.now();
  if (currentlyActive) {
    return { ok: false, reason: "광고부스트가 끝난 뒤에 다시 볼 수 있어요." };
  }
  p.activeAdBoost = { multiplier: def.multiplier, expiresAt: Date.now() + def.durationMs };
  return { ok: true };
}

function applyReward(p, reward) {
  if (!reward) return;
  if (reward.coin) p.coins += reward.coin;
  if (reward.diamond) p.diamonds += reward.diamond;
  if (reward.materialType && reward.materialAmt) {
    p.materialsByType[reward.materialType] = (p.materialsByType[reward.materialType] || 0) + reward.materialAmt;
  }
  if (reward.boostId) {
    addTradeableBoost(p, reward.boostId, reward.boostCount || 1); // 럭키머신/업적/미션/쿠폰 등 이벤트성 보상 = 거래가능
  }
  if (reward.pill) p.pill = (p.pill || 0) + reward.pill; // v2.0: 카드 연구소 전용 재화
  if (reward.managerTicket) { // v2.0: 럭키머신류 보상에서 티켓 지급
    ensureManagerTickets(p);
    p.managerTickets += reward.managerTicket;
  }
}

function resetMissionsIfNeeded(p) {
  const now = Date.now();
  if (!p.missions) {
    p.missions = { dailyResetAt: getNextKSTMidnightTs(now), weeklyResetAt: getNextKSTWeekResetTs(now), dailyProgress: {}, weeklyProgress: {}, dailyClaimed: {}, weeklyClaimed: {} };
  }
  if (now >= p.missions.dailyResetAt) {
    p.missions.dailyProgress = {};
    p.missions.dailyClaimed = {};
    p.missions.dailyResetAt = getNextKSTMidnightTs(now);
  }
  if (now >= p.missions.weeklyResetAt) {
    p.missions.weeklyProgress = {};
    p.missions.weeklyClaimed = {};
    p.missions.weeklyResetAt = getNextKSTWeekResetTs(now);
  }
}

// 실제 행동 지점에서 호출: 터치/카드획득/분해/상점구매/부스트사용/거래소이용
function bumpMission(p, actionKey, amount) {
  resetMissionsIfNeeded(p);
  amount = amount || 1;
  p.missions.dailyProgress[actionKey] = (p.missions.dailyProgress[actionKey] || 0) + amount;
  p.missions.weeklyProgress[actionKey] = (p.missions.weeklyProgress[actionKey] || 0) + amount;
}

function claimMission(p, missionId, period) {
  resetMissionsIfNeeded(p);
  const list = period === "daily" ? DAILY_MISSIONS : WEEKLY_MISSIONS;
  const progress = period === "daily" ? p.missions.dailyProgress : p.missions.weeklyProgress;
  const claimed = period === "daily" ? p.missions.dailyClaimed : p.missions.weeklyClaimed;
  const def = list.find(m => m.id === missionId);
  if (!def) return { ok: false, reason: "존재하지 않는 미션이에요." };
  if (claimed[missionId]) return { ok: false, reason: "이미 보상을 받았어요." };
  if ((progress[def.actionKey] || 0) < def.target) return { ok: false, reason: "아직 목표를 달성하지 못했어요." };
  claimed[missionId] = true;
  applyReward(p, def.reward);
  return { ok: true };
}

/* =========================================================
   출석 시스템 (28일판, KST 기준)
   ========================================================= */
// 출석 보상 대폭 상향: 7/14/21/28일 특별보상은 특히 크게, 28일차는 코인+다이아+희귀재료까지 지급
function buildAttendanceRewards() {
  const rewards = [];
  for (let day = 1; day <= 28; day++) {
    if (day === 28) rewards.push({ day, reward: { coin: 150000000, diamond: 5000, materialType: "DRAGON_SCALE", materialAmt: 50, pill: 300 } });
    else if (day === 21) rewards.push({ day, reward: { coin: 20000000, diamond: 1000, pill: 150 } });
    else if (day === 14) rewards.push({ day, reward: { coin: 5000000, diamond: 400, pill: 60 } });
    else if (day === 7) rewards.push({ day, reward: { coin: 1000000, diamond: 150, pill: 20 } });
    else if (day % 5 === 0) rewards.push({ day, reward: { diamond: 30, pill: 5 } }); // v2.0: 5/10/15/20/25일차에 알약 소량 추가
    else rewards.push({ day, reward: { coin: 30000 } });
  }
  return rewards;
}
const ATTENDANCE_REWARDS = buildAttendanceRewards();

function ensureAttendance(p) {
  if (!p.attendance) {
    p.attendance = { currentDay: 0, lastAttendDateKey: null, claimedDays: {}, cycleCompleted: false };
  }
}
function canClaimAttendanceToday(p) {
  ensureAttendance(p);
  const todayKey = getKSTDateKey();
  return p.attendance.lastAttendDateKey !== todayKey;
}
function claimAttendanceToday(p) {
  ensureAttendance(p);
  const todayKey = getKSTDateKey();
  if (p.attendance.lastAttendDateKey === todayKey) return { ok: false, reason: "오늘은 이미 출석했어요." };

  let nextDay = p.attendance.currentDay + 1;
  if (nextDay > 28) { nextDay = 1; p.attendance.claimedDays = {}; p.attendance.cycleCompleted = false; }

  p.attendance.currentDay = nextDay;
  p.attendance.lastAttendDateKey = todayKey;
  p.attendance.claimedDays[nextDay] = true;
  if (nextDay === 28) p.attendance.cycleCompleted = true;

  const def = ATTENDANCE_REWARDS.find(r => r.day === nextDay);
  applyReward(p, def.reward);
  return { ok: true, day: nextDay, reward: def.reward };
}

/* =========================================================
   시즌 시스템 (30일 - 카드/코인/다이아/계정정보는 시즌 종료해도 그대로, 시즌 데이터만 초기화)
   ========================================================= */
const SEASON_LENGTH_DAYS = 30;
function ensureSeason(p) {
  const now = Date.now();
  if (!p.season) {
    p.season = { seasonId: 1, startedAt: now, endsAt: now + SEASON_LENGTH_DAYS * 24 * 60 * 60 * 1000, touchCount: 0, rewardClaimed: false, lastFinishedSeasonId: 0, lastFinishedTouchCount: 0 };
  }
  if (now >= p.season.endsAt) {
    // 시즌 종료 -> 다음 시즌으로 롤오버. 카드/코인/다이아/계정정보는 절대 건드리지 않음, 시즌 데이터만 초기화
    p.season = {
      seasonId: p.season.seasonId + 1,
      startedAt: now,
      endsAt: now + SEASON_LENGTH_DAYS * 24 * 60 * 60 * 1000,
      touchCount: 0,
      rewardClaimed: false,
      lastFinishedSeasonId: p.season.seasonId,
      lastFinishedTouchCount: p.season.touchCount,
    };
  }
}
// 시즌 랭킹 대신(실서버 전까지는 다른 유저와 비교 불가) 시즌 누적 터치량 구간별 등급 보상으로 대체
const SEASON_TIER_REWARDS = [
  { minTouch: 1000000, label: "MVP", reward: { coin: 10000000, diamond: 500 } },
  { minTouch: 300000, label: "GOLD", reward: { coin: 3000000, diamond: 200 } },
  { minTouch: 100000, label: "SILVER", reward: { coin: 1000000, diamond: 80 } },
  { minTouch: 10000, label: "BRONZE", reward: { coin: 200000, diamond: 20 } },
  { minTouch: 0, label: "PARTICIPATION", reward: { coin: 20000 } },
];
function getSeasonTier(touchCount) {
  return SEASON_TIER_REWARDS.find(t => touchCount >= t.minTouch) || SEASON_TIER_REWARDS[SEASON_TIER_REWARDS.length - 1];
}

/* =========================================================
   구단 주간 경쟁 (기존 누적 구단랭킹과 별개로 "이번 주" 기여도만 집계)
   서버 이전 시 fanCount(활동 팬 수) 기반 보정을 넣기 쉽게 계산 함수를 분리해둠
   ========================================================= */
function ensureTeamWeekly(p) {
  const weekKey = getKSTWeekKey();
  if (!p.teamWeekly || p.teamWeekly.weekKey !== weekKey) {
    p.teamWeekly = { weekKey, contribution: 0 };
  }
}
async function bumpTeamWeeklyContribution(p, amount) {
  ensureTeamWeekly(p);
  p.teamWeekly.contribution += amount;
  const key = `kbo_touch_teamweekly_${p.teamWeekly.weekKey}_${p.teamId}`;
  let current = 0;
  try { const raw = localStorage.getItem(key); current = raw ? JSON.parse(raw) : 0; } catch (e) {}
  try { localStorage.setItem(key, JSON.stringify(current + amount)); } catch (e) {}
}
// v2.67: 로컬(이 기기)만 집계하던 걸 실제 모든 유저를 합산하도록 변경 (이번 주 weekKey가 일치하는 것만 합산해서
// 지난 주 기여도가 섞이지 않게 함). 서버 연결 실패 시엔 로컬 값으로라도 보여줌(오프라인 대비).
async function getWeeklyTeamTotals(weekKey) {
  const totals = {};
  TEAMS.forEach(t => { totals[t.id] = 0; });
  // v2.73: 봇의 주간 기여도는 "시간당 증가량 × 최대 168시간(1주)"으로 근사함(정확한 주 경계까지는 아니지만 충분히 자연스러움)
  const nowElapsedHours = Math.max(0, (Date.now() - BOT_SIM_EPOCH) / 3600000);
  SIMULATED_BOTS.forEach(bot => {
    const weeklyHours = Math.min(168, nowElapsedHours);
    if (totals[bot.teamId] != null) totals[bot.teamId] += Math.floor(bot.tapPerHour * weeklyHours);
  });
  if (window.KBOCloud && window.KBOCloud.fetchAllProfilesForTeamStats) {
    try {
      const result = await window.KBOCloud.fetchAllProfilesForTeamStats();
      if (result.ok && result.rows.length > 0) {
        result.rows.forEach(r => {
          if (r.teamWeeklyKey === weekKey && totals[r.teamId] != null) totals[r.teamId] += Math.floor(r.teamWeeklyContribution || 0);
        });
        return totals;
      }
    } catch (e) { /* 아래 로컬 폴백으로 진행 */ }
  }
  for (const t of TEAMS) {
    try {
      const raw = localStorage.getItem(`kbo_touch_teamweekly_${weekKey}_${t.id}`);
      totals[t.id] += raw ? JSON.parse(raw) : 0;
    } catch (e) { /* 무시 */ }
  }
  return totals;
}
// 향후 서버에서 "활동 팬 수"를 알 수 있게 되면 이 함수만 교체하면 됨 (지금은 raw 합계 그대로 사용)
function calculateTeamScore(rawTotal, fanCount) {
  if (!fanCount || fanCount <= 0) return rawTotal;
  return rawTotal / fanCount;
}

/* =========================================================
   카드 제작 (CRAFTING) - 재료+코인 소모, 확률적으로 지정 등급 카드 생성
   TRANSCENDENT는 제작 대상에서 제외 (부스트/천장과 동일한 원칙 - 순수 확률로만 얻을 수 있음)
   ========================================================= */
const CRAFTING_RECIPES = [
  { id: "craft_COMMON", gradeId: "COMMON", materialType: "PAPER", materialAmt: 50, coin: 150, successRate: 0.95 },
  { id: "craft_UNCOMMON", gradeId: "UNCOMMON", materialType: "VINYL", materialAmt: 50, coin: 600, successRate: 0.85 },
  { id: "craft_RARE", gradeId: "RARE", materialType: "PLASTIC", materialAmt: 50, coin: 3000, successRate: 0.70 },
  { id: "craft_EPIC", gradeId: "EPIC", materialType: "METAL", materialAmt: 50, coin: 12000, successRate: 0.55 },
  { id: "craft_UNIQUE", gradeId: "UNIQUE", materialType: "TITANIUM", materialAmt: 50, coin: 70000, successRate: 0.40 },
  { id: "craft_MYSTIC", gradeId: "MYSTIC", materialType: "MYSTIC_MATERIAL", materialAmt: 50, coin: 400000, successRate: 0.25 },
  { id: "craft_LEGENDARY", gradeId: "LEGENDARY", materialType: "LEGENDARY_MATERIAL", materialAmt: 50, coin: 3000000, successRate: 0.10 },
];

// 제작 시도: 재료+코인은 성공/실패와 무관하게 소모됨 (리스크 있는 제작)
function craftCard(p, recipeId) {
  const recipe = CRAFTING_RECIPES.find(r => r.id === recipeId);
  if (!recipe) return { ok: false, reason: "존재하지 않는 레시피예요." };
  const have = (p.materialsByType && p.materialsByType[recipe.materialType]) || 0;
  if (have < recipe.materialAmt) return { ok: false, reason: `${MATERIAL_LABELS[recipe.materialType]}이(가) 부족해요.` };
  if (p.coins < recipe.coin) return { ok: false, reason: "코인이 부족해요." };

  p.materialsByType[recipe.materialType] -= recipe.materialAmt;
  p.coins -= recipe.coin;
  p.stats_craftCount = (p.stats_craftCount || 0) + 1;

  const effectiveRate = Math.min(1, recipe.successRate + getEquippedTitleBonus(p, "craftSuccessBonus"));
  const success = Math.random() < effectiveRate;
  if (!success) return { ok: true, success: false };

  const picked = pickRandomPlayerAnyTeam();
  const card = createCard({ gradeId: recipe.gradeId, teamId: picked.teamId, teamName: picked.teamName, playerName: picked.playerName });
  p.cards.push(card);
  markDexUnlocked(p, card);
  return { ok: true, success: true, card };
}

// 재료/코인으로 최대 몇 번 제작을 시도할 수 있는지 계산 (드래그 슬라이더 최댓값용)
function maxCraftableCount(p, recipeId) {
  const recipe = CRAFTING_RECIPES.find(r => r.id === recipeId);
  if (!recipe) return 0;
  const have = (p.materialsByType && p.materialsByType[recipe.materialType]) || 0;
  const byMaterial = Math.floor(have / recipe.materialAmt);
  const byCoin = recipe.coin > 0 ? Math.floor(p.coins / recipe.coin) : Infinity;
  return Math.max(0, Math.min(byMaterial, byCoin));
}

// 지정한 개수만큼 제작 시도를 연속으로 수행 (각 회차마다 독립적으로 성공/실패 판정)
function craftCardMultiple(p, recipeId, qty) {
  let successCount = 0, failCount = 0;
  const obtainedCards = [];
  for (let i = 0; i < qty; i++) {
    const result = craftCard(p, recipeId);
    if (!result.ok) break; // 도중에 재료/코인이 떨어지면 중단
    if (result.success) { successCount++; obtainedCards.push(result.card); }
    else failCount++;
  }
  return { successCount, failCount, obtainedCards };
}

/* =========================================================
   카드 강화 (1강~10강) - 동일 카드(같은 선수+같은 등급) N장을 재료로 소모
   ========================================================= */
// index 0 = 1강으로 갈 때 필요, ... index 9 = 10강으로 갈 때 필요
const ENHANCE_LEVELS = [
  { level: 1, dupNeeded: 1, materialAmt: 5, coin: 1000 },
  { level: 2, dupNeeded: 1, materialAmt: 10, coin: 3000 },
  { level: 3, dupNeeded: 2, materialAmt: 20, coin: 8000 },
  { level: 4, dupNeeded: 2, materialAmt: 35, coin: 20000 },
  { level: 5, dupNeeded: 3, materialAmt: 60, coin: 50000 },
  { level: 6, dupNeeded: 4, materialAmt: 100, coin: 120000 },
  { level: 7, dupNeeded: 5, materialAmt: 160, coin: 300000 },
  { level: 8, dupNeeded: 6, materialAmt: 250, coin: 700000 },
  { level: 9, dupNeeded: 8, materialAmt: 400, coin: 1500000 },
  { level: 10, dupNeeded: 10, materialAmt: 600, coin: 3000000 },
];

function getEnhanceMaterialType(gradeId) {
  const g = getGrade(gradeId);
  return g ? g.materialType : "PAPER";
}

// 강화 대상 카드와 동일한 [선수+등급] 카드 중 강화재료로 쓸 수 있는(잠금/거래소등록 아닌) 개수
function countEnhanceFuel(p, targetCard) {
  return p.cards.filter(c =>
    c.cardId !== targetCard.cardId &&
    c.playerName === targetCard.playerName &&
    c.gradeId === targetCard.gradeId &&
    !c.locked && !c.inMarket && !c.inLab
  ).length;
}

// 강화 대상 카드 자체는 잠겨 있어도 강화 가능 (잠금은 "재료로 쓰이는 것"만 막음). 거래소 등록중이면 불가.
function enhanceCard(p, targetCard) {
  if (targetCard.inMarket) return { ok: false, reason: "거래소에 등록된 카드는 강화할 수 없어요." };
  if (targetCard.inLab) return { ok: false, reason: "연구 중인 카드는 강화할 수 없어요." };
  const curLevel = targetCard.enhanceLevel || 0;
  if (curLevel >= 10) return { ok: false, reason: "이미 10강이에요." };
  const step = ENHANCE_LEVELS[curLevel]; // curLevel=0이면 1강으로 가는 단계
  const materialType = getEnhanceMaterialType(targetCard.gradeId);
  const haveMat = (p.materialsByType && p.materialsByType[materialType]) || 0;

  const fuelCards = p.cards.filter(c =>
    c.cardId !== targetCard.cardId &&
    c.playerName === targetCard.playerName &&
    c.gradeId === targetCard.gradeId &&
    !c.locked && !c.inMarket && !c.inLab
  );
  if (fuelCards.length < step.dupNeeded) return { ok: false, reason: `동일 카드(같은 선수+같은 등급)가 ${step.dupNeeded}장 필요해요. (보유 ${fuelCards.length}장)` };
  if (haveMat < step.materialAmt) return { ok: false, reason: `${MATERIAL_LABELS[materialType]}이(가) 부족해요.` };
  if (p.coins < step.coin) return { ok: false, reason: "코인이 부족해요." };

  // 소비
  const toConsume = fuelCards.slice(0, step.dupNeeded).map(c => c.cardId);
  p.cards = p.cards.filter(c => !toConsume.includes(c.cardId));
  p.materialsByType[materialType] -= step.materialAmt;
  p.coins -= step.coin;

  targetCard.enhanceLevel = curLevel + 1;
  targetCard.ovr = targetCard.ovr + 1;
  p.stats_enhanceCount = (p.stats_enhanceCount || 0) + 1;
  if (targetCard.enhanceLevel >= 10) p.stats_enhanceMaxCount = (p.stats_enhanceMaxCount || 0) + 1;
  addBonusExp(p, getGradeBonusExp(targetCard.gradeId, 5)); // v2.47: 강화 성공 시 레벨 EXP 지급 (등급 높을수록 더 많이)

  return { ok: true, newLevel: targetCard.enhanceLevel };
}

const EQUIPMENT_SET_BONUSES = [
  { minTierIdx: 4, ovrBonus: 16, label: "전 슬롯 신화" },
  { minTierIdx: 3, ovrBonus: 9, label: "전 슬롯 전설 이상" },
