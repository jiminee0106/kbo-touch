];
// 부옵션 후보 - 장착/업그레이드 시 랜덤으로 하나 부여되고, 다이아로 재련(재굴림) 가능
const EQUIPMENT_SUBSTAT_POOL = [
  { type: "coinMultiplier", label: "코인 획득량", icon: "🪙", roll: () => Math.round((2 + Math.random() * 3) * 10) / 10 },
  { type: "dropRateMultiplier", label: "카드 드랍 확률", icon: "🎴", roll: () => Math.round((1 + Math.random() * 2) * 10) / 10 },
  { type: "materialMultiplier", label: "재료 획득량", icon: "🔨", roll: () => Math.round((2 + Math.random() * 3) * 10) / 10 },
];
const EQUIPMENT_REROLL_COST = 500; // 다이아 - 부옵션 재련(재굴림) 비용
function rollEquipmentSubstat() {
  const def = EQUIPMENT_SUBSTAT_POOL[Math.floor(Math.random() * EQUIPMENT_SUBSTAT_POOL.length)];
  const pct = def.roll();
  return { type: def.type, value: 1 + pct / 100, pct };
}
function ensureEquipment(p) {
  if (!p.equipment) p.equipment = {};
  if (!p.equipmentSubstats) p.equipmentSubstats = {};
  EQUIPMENT_SLOTS.forEach(s => { if (p.equipment[s.id] == null) p.equipment[s.id] = -1; }); // -1 = 미장착
}
function getEquipmentSetBonus(p) {
  ensureEquipment(p);
  const tiers = EQUIPMENT_SLOTS.map(s => p.equipment[s.id]);
  const minTier = Math.min(...tiers);
  const hit = EQUIPMENT_SET_BONUSES.find(b => minTier >= b.minTierIdx);
  return hit || { ovrBonus: 0, label: null };
}
// 장착된 슬롯들의 등급 보너스 합 + 세트 효과 - 전투 시 라인업 OVR에 그대로 더해짐
function getEquipmentOvrBonus(p) {
  ensureEquipment(p);
  const base = EQUIPMENT_SLOTS.reduce((sum, s) => {
    const tierIdx = p.equipment[s.id];
    return sum + (tierIdx >= 0 ? EQUIPMENT_TIERS[tierIdx].ovrBonus : 0);
  }, 0);
  return base + getEquipmentSetBonus(p).ovrBonus;
}
// 부옵션 배수 - 장착 중인 슬롯들의 같은 타입 부옵션을 전부 곱연산으로 합침(칭호 효과와는 독립적으로 곱해짐)
function getEquipmentSubstatMultiplier(p, type) {
  ensureEquipment(p);
  let mult = 1;
  EQUIPMENT_SLOTS.forEach(s => {
    if (p.equipment[s.id] < 0) return;
    const sub = p.equipmentSubstats[s.id];
    if (sub && sub.type === type) mult *= sub.value;
  });
  return mult;
}

function ensureWorldChallenge(p) {
  if (!p.worldChallenge) p.worldChallenge = { clearedStageIds: [], bestMargins: {} };
  if (!p.worldChallenge.clearedStageIds) p.worldChallenge.clearedStageIds = [];
  if (!p.worldChallenge.bestMargins) p.worldChallenge.bestMargins = {};
}
function isWorldChallengeStageUnlocked(p, idx) {
  if (idx === 0) return true;
  return p.worldChallenge.clearedStageIds.includes(WORLD_CHALLENGE_STAGES[idx - 1].id);
}
// 첫 클리어 보상: 스테이지가 뒤로 갈수록 기하급수적으로 커짐 (마지막 USA WORLD가 게임 전체 최고 보상 중 하나가 되도록)
function getWorldChallengeFirstClearReward(idx) {
  const t = idx / (WORLD_CHALLENGE_STAGES.length - 1); // 0~1
  const reward = {
    coin: Math.round(2000000 * Math.pow(5000, t)),
    diamond: Math.round(200 * Math.pow(1000, t)),
    pill: Math.round(200 * Math.pow(200, t)),
  };
  const stage = WORLD_CHALLENGE_STAGES[idx];
  if (stage.id === "usa_world") {
    // 게임 최종 보스 - 공식값 위에 전용 보너스를 추가로 얹음
    reward.materialType = "DRAGON_SCALE";
    reward.materialAmt = 30000;
    reward.managerTicket = 50;
    reward.titleId = "title_world_champion";
  } else if (stage.id === "usa_legend") {
    reward.materialType = "DRAGON_SCALE";
    reward.materialAmt = 10000;
    reward.managerTicket = 20;
  }
  return reward;
}

function generateWorldChallengeOpponent(stage) {
  const effectiveOvr = stage.targetOvr + (stage.extraBonus || 0); // v2.56: 목표 OVR이 99를 넘길 수 있어서 상한 제거
  const lineup = {};
  POSITIONS.forEach(pos => {
    const player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    const ovr = Math.max(40, Math.round(effectiveOvr + (Math.random() * 4 - 2)));
    lineup[pos] = { teamId: player.teamId, teamName: player.teamName, playerName: player.playerName, ovr };
  });
  return { id: "wc_" + stage.id, name: `${stage.flag} ${stage.countryName} 대표팀`, lineup, rating: 0, tier: { name: stage.label, color: "#e53935", icon: stage.flag } };
}

// 아직 안 딴 업적 중 조건을 만족한 게 있으면 지급 + 새로 달성한 목록 반환 (호출부에서 토스트로 안내)
function checkAchievements(p) {
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(ach => {
    if (p.achievements[ach.id]) return;
    if (!ach.check(p)) return;
    p.achievements[ach.id] = true;
    if (ach.reward.coin) p.coins += ach.reward.coin;
    if (ach.reward.diamond) p.diamonds += ach.reward.diamond;
    if (ach.reward.titleId && !p.titles.includes(ach.reward.titleId)) p.titles.push(ach.reward.titleId);
    newlyUnlocked.push(ach);
  });
  return newlyUnlocked;
}

function getEquippedTapMultiplier(p) {
  if (!p.equippedTitle) return 1;
  const t = TITLES[p.equippedTitle];
  return (t && t.tapMultiplier) || 1;
}
// v2.34: "명예 칭호"뿐이던 대부분의 칭호에 등급별로 실제 효과를 부여함 (터치량 말고 코인/드랍률/재료도 다양하게)
function getEquippedTitleMultiplier(p, field) {
  if (!p.equippedTitle) return 1;
  const t = TITLES[p.equippedTitle];
  return (t && t[field]) || 1;
}
// v2.60: 칭호 효과와 장비 부옵션을 곱연산으로 합쳐서 최종 배수를 계산함
function getEquippedCoinMultiplier(p) { return getEquippedTitleMultiplier(p, "coinMultiplier") * getEquipmentSubstatMultiplier(p, "coinMultiplier"); }
function getEquippedDropRateMultiplier(p) { return getEquippedTitleMultiplier(p, "dropRateMultiplier") * getEquipmentSubstatMultiplier(p, "dropRateMultiplier"); }
function getEquippedMaterialMultiplier(p) { return getEquippedTitleMultiplier(p, "materialMultiplier") * getEquipmentSubstatMultiplier(p, "materialMultiplier"); }
// 곱연산 배수(getEquippedTitleMultiplier, 기본값 1)와 달리, 확률에 그대로 더하는 %p 가산값(기본값 0)이 필요한 효과용
function getEquippedTitleBonus(p, field) {
  if (!p.equippedTitle) return 0;
  const t = TITLES[p.equippedTitle];
  return (t && t[field]) || 0;
}

// 프로필 표시용 레벨 시스템: 누적 TAP 기준, 레벨이 오를수록 다음 레벨까지 필요한 TAP이 늘어남
// 게임플레이(확률/보상 등)에는 전혀 영향을 주지 않는 순수 표시/성취감용 지표
// v2.47: 레벨 EXP는 원래 누적 TAP 하나였는데, 이제 카드 연구/강화 완료, 감독모드 승리로도 보너스 EXP(p.bonusExp)를 얻음.
// 두 값을 합쳐서 총 EXP로 계산함.
function getLevelInfo(p) {
  const tap = Math.floor(p.personalTap || 0) + Math.floor(p.bonusExp || 0);
  let level = 1, need = 100, cumulative = 0;
  while (tap >= cumulative + need && level < 9999) {
    cumulative += need;
    level++;
    need = Math.floor(need * 1.35);
  }
  const curExp = tap - cumulative;
  return { level, curExp, need, pct: Math.max(0, Math.min(100, Math.floor((curExp / need) * 100))) };
}

// 각 봇마다 고정된 티어/능력치/성장속도를 갖고 "실제 흐른 시간"에 비례해서 결정적으로 계산됨.
// 그래서 유저가 아무리 성장해도 봇이 따라오지 않고, 봇은 봇 나름의 페이스로 계속 성장함.
// 브론즈~다이아몬드 구간에만 존재하고, 마스터 이상은 100% 실제 유저만 매칭됨.
// 유저 수가 충분히 늘어나면 이 시스템 자체를 지워도 되도록 격리해서 설계함.
// ============================================================================
const BOT_SIM_EPOCH = new Date("2026-08-31T00:00:00+09:00").getTime(); // 봇 성장 계산 기준 시각(KST) - 이 시점 능력치가 각 밴드의 목표치가 되도록 설계
const BOT_NICKNAME_POOL = [
  "피아노를 어떻게 피하노", "김도영그는신이야", "집가고싶다", "어리고싶다", "hide on bush",
  "줴줴이야", "쉬었음청년", "코리안좀비 엄태양", "농업혁명은덫이다", "지은경",

];
const BOT_TIER_BANDS = [
  { name: "bronze",   count: 5, ratingRange: [50, 750],    levelRange: [3, 8],   ovrRange: [45, 58], tapPerHour: [15, 50] },
  { name: "silver",   count: 4, ratingRange: [850, 1650],  levelRange: [8, 15],  ovrRange: [55, 68], tapPerHour: [35, 90] },
  { name: "gold",     count: 4, ratingRange: [1750, 2650], levelRange: [15, 24], ovrRange: [65, 78], tapPerHour: [70, 160] },
  { name: "platinum", count: 4, ratingRange: [2750, 3750], levelRange: [24, 34], ovrRange: [75, 88], tapPerHour: [130, 260] },
  { name: "diamond",  count: 4, ratingRange: [3850, 4950], levelRange: [34, 43], ovrRange: [85, 98], tapPerHour: [220, 400] },
]; // v2.84: 닉네임 8개 추가(21개)에 맞춰 밴드별 봇 수를 5/4/4/4/4로 재분배
// 특정 레벨에 "막 도달한" 시점의 누적 TAP을 역산 (getLevelInfo의 레벨공식과 동일한 로직을 거꾸로 계산)
function getTapForLevelTarget(targetLevel, progressPct) {
  let need = 100, cumulative = 0;
  for (let lvl = 1; lvl < targetLevel; lvl++) {
    cumulative += need;
    need = Math.floor(need * 1.35);
  }
  return cumulative + Math.floor(need * (progressPct != null ? progressPct : 0.3));
}
function seededRandom(seed) {
  // 고정된 시드로 매번 같은 "랜덤값"을 재현하기 위한 간단한 의사난수 생성기 (봇 능력치를 서버 없이도 고정하기 위함)
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}
const SIMULATED_BOTS = (() => {
  const bots = [];
  let nicknameIdx = 0;
  let seed = 1;
  const rand = () => seededRandom(seed++);
  BOT_TIER_BANDS.forEach(band => {
    for (let i = 0; i < band.count; i++) {
      const nickname = BOT_NICKNAME_POOL[nicknameIdx % BOT_NICKNAME_POOL.length];
      nicknameIdx++;
      const teamId = TEAMS[Math.floor(rand() * TEAMS.length)].id;
      const rating = Math.round(band.ratingRange[0] + rand() * (band.ratingRange[1] - band.ratingRange[0]));
      const level = Math.round(band.levelRange[0] + rand() * (band.levelRange[1] - band.levelRange[0]));
      const ovr = Math.round(band.ovrRange[0] + rand() * (band.ovrRange[1] - band.ovrRange[0]));
      const tapPerHour = Math.round(band.tapPerHour[0] + rand() * (band.tapPerHour[1] - band.tapPerHour[0]));
      bots.push({
        id: `simbot_${band.name}_${i}`,
        nickname, teamId, band: band.name,
        ratingBase: rating, ovrBase: ovr,
        tapAtEpoch: getTapForLevelTarget(level, rand() * 0.6 + 0.1),
        tapPerHour,
      });
    }
  });
  return bots;
})();
// 지금 이 순간 기준 봇의 실제 능력치를 계산함 (호출할 때마다 "현재 시각"으로 다시 계산되므로 항상 최신 상태)
function getBotCurrentStats(bot) {
  const elapsedHours = Math.max(0, (Date.now() - BOT_SIM_EPOCH) / 3600000);
  const personalTap = Math.floor(bot.tapAtEpoch + bot.tapPerHour * elapsedHours);
  const levelInfo = getLevelInfo({ personalTap, bonusExp: 0 });
  // 레이팅/OVR은 티어 밴드를 유지한 채로 아주 완만하게(등락 없이) 소폭 상승하는 정도로만 흉내냄
  const ratingDrift = Math.min(40, Math.floor(elapsedHours / 48)); // 이틀에 1점씩, 최대 +40 정도로 완만하게
  const managerRating = bot.ratingBase + ratingDrift;
  const deckOvr = bot.ovrBase;
  return { personalTap, level: levelInfo.level, managerRating, deckOvr };
}

// 등급이 높을수록 지수적으로 커지는 보너스 EXP 계산 (연구/강화 완료 시 사용)
function getGradeBonusExp(gradeId, baseAmount) {
  const rarityIndex = GRADES.findIndex(g => g.id === gradeId);
  return Math.round(baseAmount * Math.pow(2, Math.max(0, rarityIndex)));
}
function addBonusExp(p, amount) {
  p.bonusExp = (p.bonusExp || 0) + amount;
}

      💎 구단 변경 (${TEAM_CHANGE_COST_DIAMOND.toLocaleString()} 다이아 · 누적 TAP까지 그대로 유지)
    </button>
    <div class="sectionTitle">칭호 (${p.titles.length}개 보유, 거래 불가)</div>
    <div id="titleList"></div>
  `;

  document.getElementById("levelInfoRow").onclick = () => {
    state.profileLevelInfoExpanded = !state.profileLevelInfoExpanded;
    render();
  };

  document.getElementById("nicknameSaveBtn").onclick = async () => {
    const v = document.getElementById("nicknameInput").value.trim();
    if (!v) { toast("닉네임을 입력해주세요."); return; }
    if (v.length > 12) { toast("닉네임은 12자 이내로 입력해주세요."); return; }
    if (v === p.nickname) { toast("현재 닉네임과 동일해요."); return; }
    const isFreeChange = !(p.nicknameChangeCount > 0); // v2.72: 첫 변경은 무료, 두 번째부터 다이아 소모
    if (!isFreeChange && p.diamonds < NICKNAME_CHANGE_COST_DIAMOND) { toast("다이아가 부족해요."); return; }
    const myUid = window.KBOCloud ? window.KBOCloud.getUid() : null;
    if (await isNicknameTaken(v, myUid)) { toast("이미 사용 중인 닉네임이에요."); return; }
    const ok = await askConfirm(isFreeChange ? `닉네임을 "${v}"(으)로 바꿀까요? (첫 변경은 무료예요)` : `💎${NICKNAME_CHANGE_COST_DIAMOND.toLocaleString()}을 사용해서 닉네임을 "${v}"(으)로 바꿀까요?`, "닉네임 변경");
    if (!ok) return;
    if (!isFreeChange) p.diamonds -= NICKNAME_CHANGE_COST_DIAMOND;
    p.nickname = v;
    p.nicknameChangeCount = (p.nicknameChangeCount || 0) + 1;
    await saveProfile(p);
    toast(isFreeChange ? "닉네임이 변경됐어요! (무료 변경 사용됨)" : "닉네임이 변경됐어요.");
    render();
  };

  document.getElementById("teamChangeBtn").onclick = async () => {
    if (p.coins < TEAM_CHANGE_COST) { toast("코인이 부족해요."); return; }
    const newTeamId = await showTeamPickerOverlay();
    if (!newTeamId) return;
    if (newTeamId === p.teamId) { toast("이미 응원 중인 구단이에요."); return; }
    const newTeam = TEAMS.find(t => t.id === newTeamId);
    const ok = await askConfirm(
      `${newTeam.name}(으)로 구단을 변경하시겠습니까?\n${TEAM_CHANGE_COST.toLocaleString()} 코인 소모\n카드/코인/재료/업적은 그대로 유지되고, 누적 TAP만 0으로 초기화돼요.`,
      "구단 변경"
    );
    if (!ok) return;
    p.coins -= TEAM_CHANGE_COST;
    p.teamId = newTeamId;
    p.personalTap = 0;
    p.stats_teamChangeCount = (p.stats_teamChangeCount || 0) + 1;
    await saveProfile(p);
    toast(`${newTeam.name} 팬이 되었어요!`);
    render();
  };

  document.getElementById("teamChangeDiaBtn").onclick = async () => {
    if (p.diamonds < TEAM_CHANGE_COST_DIAMOND) { toast("다이아가 부족해요."); return; }
    const newTeamId = await showTeamPickerOverlay();
    if (!newTeamId) return;
    if (newTeamId === p.teamId) { toast("이미 응원 중인 구단이에요."); return; }
    const newTeam = TEAMS.find(t => t.id === newTeamId);
    const ok = await askConfirm(
      `${newTeam.name}(으)로 구단을 변경하시겠습니까?\n💎${TEAM_CHANGE_COST_DIAMOND.toLocaleString()} 다이아 소모\n카드/코인/재료/업적/누적 TAP 전부 그대로 유지돼요.`,
      "구단 변경 (다이아)"
    );
    if (!ok) return;
    p.diamonds -= TEAM_CHANGE_COST_DIAMOND;
    p.teamId = newTeamId;
    // 다이아 이적은 누적 TAP을 초기화하지 않음(코인 이적과의 차이점)
    p.stats_teamChangeCount = (p.stats_teamChangeCount || 0) + 1;
    await saveProfile(p);
    toast(`${newTeam.name} 팬이 되었어요! (누적 TAP 유지)`);
    render();
  };

  const list = document.getElementById("titleList");
  if (p.titles.length === 0) {
    list.innerHTML = `<div class="sub">업적을 달성하면 칭호를 얻을 수 있어요.</div>`;
    return;
  }
  const noneRow = document.createElement("div");
  noneRow.className = "row";
  noneRow.style.cursor = "pointer";
  noneRow.innerHTML = `<span>${!p.equippedTitle ? "✅ " : ""}칭호 없음</span><span></span>`;
  noneRow.onclick = async () => { p.equippedTitle = null; await saveProfile(p); renderProfile(content, p, team); };
  list.appendChild(noneRow);

  p.titles.forEach(tid => {
    const t = TITLES[tid];
    if (!t) return;
    const row = document.createElement("div");
    row.className = "row";
    row.style.cursor = "pointer";
    const equipped = p.equippedTitle === tid;
    row.innerHTML = `<span style="color:${t.color}; font-weight:700;">${equipped ? "✅ " : ""}${t.label}</span><span style="color:#999; font-size:11px;">${t.effectDesc}</span>`;
    row.onclick = async () => { p.equippedTitle = tid; await saveProfile(p); renderProfile(content, p, team); };
    list.appendChild(row);
  });
}

function renderSettings(content, p) {

  content.innerHTML = `

      ` : `<div class="sub" style="margin:4px 0;">구글 계정과 연동돼서, 이 계정으로 로그인하면 어느 기기에서든 이어할 수 있어요.</div>`}
      <div class="row" style="flex-direction:column; align-items:stretch; gap:6px;">
        <span style="font-size:12px; color:#999;">내 복구 코드 (다른 기기/파일에서 이어하려면 이 코드를 적어두세요)</span>
        <div style="display:flex; gap:6px;">
          <input id="myRecoveryCode" type="text" readonly value="${uid}" style="flex:1; box-sizing:border-box; padding:8px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:11px;">
          <button id="copyRecoveryBtn" style="padding:8px 12px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;">복사</button>
        </div>
      </div>
      <div class="row"><span>마지막 동기화</span><span style="font-size:12px; color:#999;">${lastSyncText}</span></div>
      <button id="syncNowBtn" style="width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-weight:700; font-size:13px; margin-top:6px;">☁️ 지금 동기화</button>
    ` : `<div class="sub" style="margin:8px 0;">클라우드 서버에 연결하지 못했어요. 로컬 저장은 정상적으로 계속 동작해요.</div>`}

    <div class="sectionTitle" style="margin-top:16px;">🔁 다른 기기/파일에서 복구하기</div>
    <div class="sub" style="margin-bottom:8px;">이전에 적어둔 복구 코드를 입력하면, 그 진행상황을 이 기기로 가져와요. 지금 진행 중인 데이터는 덮어써져요.</div>
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <input id="restoreCodeInput" type="text" placeholder="복구 코드 붙여넣기" style="flex:1; box-sizing:border-box; padding:9px 10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:12px;">
      <button id="restoreCodeBtn" style="padding:9px 14px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:12px; font-weight:700;">복구</button>
    </div>

    <div class="sectionTitle" style="margin-top:16px;">💾 수동 백업 (다른 주소/환경으로 옮기기)</div>

    <button id="exportCodeBtn" style="width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-weight:700; font-size:13px; margin-bottom:8px;">📤 내보내기 코드 생성</button>
    <textarea id="exportCodeOutput" readonly style="display:none; width:100%; box-sizing:border-box; height:70px; margin-bottom:8px; padding:8px; border-radius:8px; border:none; background:#0B0B12; color:#9f9; font-size:10px; word-break:break-all;"></textarea>

    <button id="importCodeBtn" style="width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-weight:700; font-size:13px;">📥 코드로 가져오기 (덮어씀)</button>

    <div class="sectionTitle" style="margin-top:16px;">🎟️ 쿠폰 코드</div>

      <button id="couponRedeemBtn" style="padding:9px 14px; border:none; border-radius:8px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-size:12px; font-weight:700;">사용하기</button>
    </div>

    <div class="sectionTitle" style="margin-top:16px;">🔊 효과음</div>
    <div class="row"><span>효과음 전체 켜기/끄기</span><button id="soundMasterBtn" style="padding:6px 14px; border:none; border-radius:8px; background:${p.soundSettings.master ? "#4caf50" : "linear-gradient(155deg,#3a3a47,#232330)"}; color:#fff; font-size:12px; font-weight:700;">${p.soundSettings.master ? "ON" : "OFF"}</button></div>
    <div id="soundCategoryList" style="margin-top:10px; opacity:${p.soundSettings.master ? "1" : "0.4"}; pointer-events:${p.soundSettings.master ? "auto" : "none"};"></div>
    <div class="sub" style="margin:10px 0 4px;">카드 등급별 드랍 효과음 (등급이 높을수록 더 웅장해요)</div>
    <div id="gradeSoundList" style="opacity:${p.soundSettings.master ? "1" : "0.4"}; pointer-events:${p.soundSettings.master ? "auto" : "none"};"></div>

    <div class="sectionTitle" style="margin-top:16px;">🎴 카드 등급별 드랍 이펙트</div>
    <div class="sub" style="margin-bottom:6px;">특정 등급의 카드가 나올 때 뜨는 팝업/이펙트를 등급별로 켜고 끌 수 있어요. (꺼두면 그 등급은 사운드도 같이 안 나요)</div>
    <div id="gradeEffectList"></div>

    <button id="resetBtn" style="width:100%; padding:12px; border:none; border-radius:8px; background:#8b1a1a; color:#fff; font-weight:700; margin-top:22px;">데이터 초기화 (처음부터 다시 시작)</button>
  `;

  ensureEffectSettings(p);
  const gradeEffectList = document.getElementById("gradeEffectList");
  GRADES.forEach(g => {
    const enabled = p.effectSettings[g.id] !== false;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <span style="color:${g.color}; font-weight:700;">${g.label}</span>
      <button class="gradeEffectToggleBtn" data-grade="${g.id}" style="padding:6px 14px; border:none; border-radius:8px; background:${enabled ? "#4caf50" : "linear-gradient(155deg,#3a3a47,#232330)"}; color:#fff; font-size:12px; font-weight:700;">${enabled ? "ON" : "OFF"}</button>
    `;
    row.querySelector(".gradeEffectToggleBtn").onclick = async () => {
      ensureEffectSettings(p);
      p.effectSettings[g.id] = !(p.effectSettings[g.id] !== false);
      await saveProfile(p);
      renderSettings(content, p);
    };
    gradeEffectList.appendChild(row);
  });

  if (cloudReady) {
    document.getElementById("copyRecoveryBtn").onclick = async () => {
      try { await navigator.clipboard.writeText(uid); toast("복구 코드를 복사했어요!"); }
      catch (e) { toast("복사에 실패했어요. 직접 선택해서 복사해주세요."); }
    };
    document.getElementById("syncNowBtn").onclick = async () => {
      toast("☁️ 동기화 중...");
      await pushToCloudNow();
      if (state.lastCloudSyncError) toast(`동기화 실패: ${state.lastCloudSyncError}`);
      else toast("☁️ 동기화 완료!");
      renderSettings(content, p);
    };
    const googleBtn = document.getElementById("googleLoginBtn");
    if (googleBtn) {
      googleBtn.onclick = async () => {
        toast("구글 로그인 창을 여는 중...");
        const result = await window.KBOCloud.signInWithGoogle();
        if (!result.ok) { toast(`로그인 실패: ${result.reason}`); return; }
        if (result.merged) {
          // 이미 다른 uid에 연결된 구글 계정이라, 그 계정의 클라우드 데이터로 전환됨
          const pull = await window.KBOCloud.pullMyProfile();
          if (pull.ok) {
            localStorage.setItem(PROFILE_KEY, JSON.stringify(pull.profile));
            toast("이미 사용 중이던 구글 계정이에요. 그 계정의 데이터를 불러올게요!");
            setTimeout(() => location.reload(), 800);
            return;
          }
        }
        await pushToCloudNow();
        toast("🎉 구글 계정 연동 완료! 데이터는 그대로 유지돼요.");
        renderSettings(content, p);
      };
    }
  }

  document.getElementById("restoreCodeBtn").onclick = async () => {
    const code = document.getElementById("restoreCodeInput").value.trim();
    if (!code) { toast("복구 코드를 입력해주세요."); return; }
    if (!window.KBOCloud) { toast("클라우드에 연결되어 있지 않아요."); return; }
    const ok = await askConfirm("지금 진행 중인 데이터를 덮어쓰고 입력한 코드의 데이터로 복구할까요?\n이 작업은 되돌릴 수 없어요.", "복구하시겠어요?");
    if (!ok) return;
    const result = await window.KBOCloud.pullProfileByUid(code);
    if (!result.ok) { toast(result.reason === "not-found" ? "해당 코드로 저장된 데이터를 찾을 수 없어요." : `복구 실패: ${result.reason}`); return; }
    localStorage.setItem(PROFILE_KEY, JSON.stringify(result.profile));
    toast("복구 완료! 새로고침할게요.");
    setTimeout(() => location.reload(), 800);
  };

  document.getElementById("exportCodeBtn").onclick = () => {
    const code = exportProfileCode(p);
    if (!code) { toast("코드 생성에 실패했어요."); return; }
    const output = document.getElementById("exportCodeOutput");
    output.style.display = "block";
    output.value = code;
    output.select();
    try {
      navigator.clipboard.writeText(code);
      toast("코드를 생성하고 클립보드에 복사했어요!");
    } catch (e) {
      toast("코드가 생성됐어요. 아래 텍스트를 길게 눌러 직접 복사해주세요.");
    }
  };
  document.getElementById("importCodeBtn").onclick = async () => {
    const codeInput = document.getElementById("importCodeInput");
    const result = importProfileCode(codeInput.value);
    if (!result.ok) { toast(result.reason); return; }
    const ok = await askConfirm("지금 진행 중인 데이터를 덮어쓰고, 코드에 담긴 데이터로 교체할까요?\n이 작업은 되돌릴 수 없어요.", "가져오기");
    if (!ok) return;
    localStorage.setItem(PROFILE_KEY, JSON.stringify(result.profile));
    toast("가져오기 완료! 새로고침할게요.");
    setTimeout(() => location.reload(), 800);
  };

  document.getElementById("couponRedeemBtn").onclick = async () => {
    const codeInput = document.getElementById("couponInput");
    const result = redeemCoupon(p, codeInput.value);
    if (!result.ok) { toast(result.reason); return; }
    await saveProfile(p);
    toast(`🎉 ${result.message}`);
    codeInput.value = "";
    renderSettings(content, p);
  };

  document.getElementById("soundMasterBtn").onclick = async () => {
    p.soundSettings.master = !p.soundSettings.master;
    await saveProfile(p);
    renderSettings(content, p);
  };

  function buildVolRow(id, label) {
    const vol = p.soundSettings.volumes[id];
    const row = document.createElement("div");
    row.style.cssText = "margin-bottom:14px;";
    row.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
        <span>${label}</span><span id="volLabel_${id}">${Math.round(vol * 100)}%</span>
      </div>
      <input type="range" min="0" max="100" value="${Math.round(vol * 100)}" class="soundVolSlider" data-cat="${id}" style="width:100%;">
    `;
    return row;
  }

  const catList = document.getElementById("soundCategoryList");
  SOUND_CATEGORIES.forEach(cat => catList.appendChild(buildVolRow(cat.id, cat.label)));

  const gradeList = document.getElementById("gradeSoundList");
  GRADE_SOUND_CATEGORIES.forEach((cat, i) => {
    const grade = GRADES[i];
    const row = buildVolRow(cat.id, cat.label);
    row.querySelector("span").style.color = grade.color;
    gradeList.appendChild(row);
  });

  const previewKindByCategory = { uiClick: "click", tap: "tap", luckyMachine: "reel" };
  document.querySelectorAll(".soundVolSlider").forEach(slider => {
    slider.addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10) / 100;
      p.soundSettings.volumes[slider.dataset.cat] = v;
      const label = document.getElementById(`volLabel_${slider.dataset.cat}`);
      if (label) label.textContent = `${Math.round(v * 100)}%`;
    });
    slider.addEventListener("change", async () => {
      await saveProfile(p);
      if (slider.dataset.cat.startsWith("cardDrop_")) {
        playCardDropSound(slider.dataset.cat.replace("cardDrop_", "")); // 등급별 미리듣기
      } else {
        playSound(slider.dataset.cat, previewKindByCategory[slider.dataset.cat] || "click");
      }
    });

  document.getElementById("resetBtn").onclick = async () => {

    // v2.65: 로컬만 지우면 클라우드에 남아있던 데이터가 새로고침 직후 자동으로 다시 불러와져서
    // 초기화가 무효화되는 버그가 있었음 - 클라우드 쪽도 같이 지워야 진짜로 초기화됨.
    if (window.KBOCloud && window.KBOCloud.getUid()) {

    }

}

  const remainMs = Math.max(0, resetAt - Date.now());

  body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-bottom:10px;">초기화까지 ${remainH}시간 ${remainM}분 남음</div>`);

        <span style="font-weight:700;">${m.label}</span>
        <span style="color:#999;">${cur.toLocaleString()} / ${m.target.toLocaleString()}</span>
      </div>
      <div style="background:#0B0B12; border-radius:6px; height:8px; overflow:hidden; margin-bottom:8px;">
        <div style="width:${pct}%; height:100%; background:${done ? '#4caf50' : '#555'};"></div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:#999; font-size:11px;">${rewardText(m.reward)}</span>
        <button class="claimMissionBtn" ${!done || isClaimed ? "disabled" : ""} style="padding:6px 14px; border:none; border-radius:6px; font-size:11px; font-weight:700; background:${isClaimed ? '#2a2a35' : done ? '#1e5c3a' : '#2a2a35'}; color:${isClaimed ? '#777' : '#fff'};">
          ${isClaimed ? "수령완료" : "받기"}
        </button>
      </div>
    `;
    row.querySelector(".claimMissionBtn").onclick = async () => {
      const result = claimMission(p, m.id, isDaily ? "daily" : "weekly");
      if (!result.ok) { toast(result.reason); return; }
      await saveProfile(p);
      toast(`${m.label} 보상 수령! ${rewardTextPlain(m.reward)}`);
      renderMissions(content, p);
    };
    body.appendChild(row);
  });
}

// 티켓 - 144분마다 1장씩 자연 회복(24시간=10장), 재화(코인) 구매는 최대 2회/일,
// 다이아 구매는 회당 가격이 150→300→450→600→750으로 오르며 최대 5회/일.
// 하루 최대치: 기본10 + 코인2 + 다이아5 + 연승보너스5 = 22회
// ============================================================================
const MANAGER_DAILY_TICKETS = 10;
const MANAGER_TICKET_REGEN_INTERVAL_MS = 144 * 60 * 1000; // 144분마다 1장 (24시간에 10장)
const MANAGER_TICKET_BUY_COST = 50000000;
const MANAGER_TICKET_BUY_MAX_PER_DAY = 2;
const MANAGER_TICKET_DIA_COSTS = [150, 300, 450, 600, 750]; // 다이아 구매 1~5회차 가격
const MANAGER_STREAK_TICKET_MAX_PER_DAY = 5;
const MANAGER_STREAK_TICKET_THRESHOLD = 10; // v2.1: 이 연승 수 이상부터 승리할 때마다 티켓 지급 (기존 5연승 → 10연승으로 상향)

function ensureManagerTickets(p) {
  const todayKey = getKSTDateKey();
  if (p.managerTicketsDateKey !== todayKey) {
    // 날짜가 바뀌면 "구매 횟수"류 일일 카운터만 초기화. 티켓 개수 자체는 자연회복 방식이라 강제로 채우지 않음.
    p.managerTicketsDateKey = todayKey;
    p.managerTicketBuyCount = 0;
    p.managerTicketDiaBuyCount = 0;
    p.managerStreakTicketCount = 0;
  }
  if (p.managerTickets == null) p.managerTickets = MANAGER_DAILY_TICKETS;
  if (p.managerTicketBuyCount == null) p.managerTicketBuyCount = 0;
  if (p.managerTicketDiaBuyCount == null) p.managerTicketDiaBuyCount = 0;
  if (p.managerStreakTicketCount == null) p.managerStreakTicketCount = 0;
  if (p.managerWinStreak == null) p.managerWinStreak = 0;
  if (!p.managerLastTicketRegenAt) p.managerLastTicketRegenAt = Date.now();

  // 자연 회복: 마지막 회복 시점 이후 144분이 지날 때마다 1장씩, 최대 10장까지만 자연 회복됨
  // (다이아/코인으로 산 추가 티켓은 10장을 넘어갈 수 있고, 그건 자연회복 대상이 아님)
  const now = Date.now();
  const elapsed = now - p.managerLastTicketRegenAt;
  const ticksToAdd = Math.floor(elapsed / MANAGER_TICKET_REGEN_INTERVAL_MS);
  if (ticksToAdd > 0) {
    if (p.managerTickets < MANAGER_DAILY_TICKETS) {
      p.managerTickets = Math.min(MANAGER_DAILY_TICKETS, p.managerTickets + ticksToAdd);
    }
    p.managerLastTicketRegenAt += ticksToAdd * MANAGER_TICKET_REGEN_INTERVAL_MS;
  }
}

function getManagerTicketRegenRemainingMs(p) {
  if (p.managerTickets >= MANAGER_DAILY_TICKETS) return 0;
  const elapsed = Date.now() - p.managerLastTicketRegenAt;
  return Math.max(0, MANAGER_TICKET_REGEN_INTERVAL_MS - elapsed);
}

// ============================================================================
// 감독모드 (매니저 모드) - 실시간 매칭이 아닌 "방어덱 설정 → 상대 방어덱 선택 → 공격" 방식
// ============================================================================
// ============================================================================
// v2.54: 월드 챌린지 - 감독모드(PvP)와 완전히 별개인 PvE 엔드게임 콘텐츠.
// 국가별 스테이지를 순서대로 뚫는 방식이며, 뒤로 갈수록 상대 스쿼드 OVR이 급격히 올라감.
// 티켓/레이팅을 전혀 건드리지 않는 독립된 진행도(p.worldChallenge)를 사용함.
// 마지막 USA 구간은 난이도 5단계(NORMAL~WORLD)로 나뉘고, WORLD 난이도는 개인 최고 기록(점수차)을 저장함.
// v2.76: 브론즈~다이아몬드는 각 등급 안에서 III(낮음)→II→I(높음) 3단계로 세분화함.
// 마스터 이상(마스터/그랜드마스터)은 기존처럼 단일 티어로 유지.
function buildSubTieredBand(name, min, max, color, icon) {
  const span = (max - min) / 3;
  return [
    { name: `${name} III`, min: min, color, icon },
    { name: `${name} II`, min: Math.round(min + span), color, icon },
    { name: `${name} I`, min: Math.round(min + span * 2), color, icon },
  ];
}
const MANAGER_TIERS = [
  ...buildSubTieredBand("브론즈", 0, 800, "#8c5a3c", "🥉"),
  ...buildSubTieredBand("실버", 800, 1700, "#adb5bd", "🥈"),
  ...buildSubTieredBand("골드", 1700, 2700, "#e0b13a", "🥇"),
  ...buildSubTieredBand("플래티넘", 2700, 3800, "#5fd0c9", "💠"),
  ...buildSubTieredBand("다이아몬드", 3800, 5000, "#6fa8ff", "💎"),
  { name: "마스터", min: 5000, color: "#c56bff", icon: "👑" }, // 5000~6999까지 넓은 구간 - 여기까진 도달할 만하게
  { name: "그랜드마스터", min: 7000, color: "#e53935", icon: "⚔️" }, // v2.79: 마스터 구간을 넓게 채운 뒤 여기서 확실하게 펄쩍 뛰도록 설계
];
// v2.37: "챌린저"는 더 이상 점수(레이팅) 기준이 아니라, 그랜드마스터(7000+, v2.78 상향) 중에서
// 실시간 랭킹 상위 5명에게만 붙는(v2.80: 10명→5명) "칭호형 표시"임. MANAGER_TIERS에서 제외하고 별도로 관리함.
const CHALLENGER_BADGE = { name: "챌린저", color: "#ffd700", icon: "🏆", textClass: "pearlRank" };
function getManagerTier(rating) {
  let cur = MANAGER_TIERS[0];
  for (const t of MANAGER_TIERS) if (rating >= t.min) cur = t;
  return cur;
}

// 라인업(9포지션) 기준으로 포지션 보정 OVR 계산
// v2.29: 같은 구단 선수로 라인업을 채우면 붙는 시너지 보너스 (전체 OVR에 %로 적용).
// 구단별로 "몇 명을 채웠는지"에 따라 3/5/9명 구간 중 가장 높은 구간의 보너스가 그 구단 몫으로 붙고,
// 여러 구단이 섞여 있으면 구단별 보너스가 각각 한 번씩 더해짐(중첩). 단, 어떻게 섞어도
// 9명을 한 구단으로 채웠을 때의 보너스보다는 항상 낮게 설계함(구간별 %가 인원수 대비 체증하도록 잡음).
const TEAM_SYNERGY_TIERS = [
  { count: 9, bonusPct: 12 },
  { count: 5, bonusPct: 5 },
  { count: 3, bonusPct: 2 },
];
function getTeamSynergyBonusPct(filledSlots) {
  const teamCounts = {};
  filledSlots.forEach(s => {
    if (s.card) teamCounts[s.card.teamId] = (teamCounts[s.card.teamId] || 0) + 1;
  });
  let bonusPct = 0;
  Object.values(teamCounts).forEach(count => {
    const tier = TEAM_SYNERGY_TIERS.find(t => count >= t.count);
    if (tier) bonusPct += tier.bonusPct;
  });
  return bonusPct;
}
function computeLineupInfo(p, lineup) {
  const slots = POSITIONS.map(pos => {
    const cardId = lineup[pos];
    const card = cardId ? p.cards.find(c => c.cardId === cardId) : null;
    if (!card) return { pos, card: null, adjOvr: 0, posOnlyOvr: 0 };
    const adjOvr = getPositionAdjustedOVR(card.ovr, card.teamId, card.playerName, pos);
    return { pos, card, adjOvr, posOnlyOvr: adjOvr }; // posOnlyOvr: 시너지/장비 보너스가 섞이기 전, 순수 포지션 적합도만 반영된 값 (UI의 "부적합" 표시는 반드시 이걸로만 판단해야 함)
  });
  const filled = slots.filter(s => s.card);
  const synergyPct = getTeamSynergyBonusPct(filled);
  if (synergyPct > 0) {
    slots.forEach(s => { if (s.card) s.adjOvr = Math.round(s.adjOvr * (1 + synergyPct / 100)); });
  }
  // v2.55: 장비(훈련 장비 3슬롯) 보너스를 라인업 전체에 고정 수치로 더함
  const equipBonus = getEquipmentOvrBonus(p);
  if (equipBonus > 0) {
    slots.forEach(s => { if (s.card) s.adjOvr = s.adjOvr + equipBonus; }); // v2.56: OVR이 99를 넘을 수 있어서 상한 제거
  }
  const pitcherSlot = slots.find(s => s.pos === "P");
  const fielderSlots = slots.filter(s => s.pos !== "P");
  const avgFielderOvr = fielderSlots.filter(s => s.card).length
    ? Math.round(fielderSlots.reduce((a, s) => a + (s.card ? s.adjOvr : 0), 0) / fielderSlots.filter(s => s.card).length)
    : 0;
  // 전체(투수 포함) 평균 OVR - UI에 "공격 OVR 92.4" 식으로 표시할 때만 사용, 실제 승패 로직에는 영향 없음
  const overallOvr = filled.length ? Math.round((filled.reduce((a, s) => a + s.adjOvr, 0) / filled.length) * 10) / 10 : 0;
  return {
    slots,
    complete: filled.length === POSITIONS.length,
    filledCount: filled.length,
    pitcherOvr: pitcherSlot && pitcherSlot.card ? pitcherSlot.adjOvr : 0,
    avgFielderOvr,
    overallOvr,
    synergyPct,
    equipBonus,
    battingOrder: fielderSlots.filter(s => s.card).map(s => ({ name: s.card.playerName, ovr: s.adjOvr, pos: s.pos, realPos: getRealPosition(s.card.teamId, s.card.playerName) })),
  };
}

// 카드 하나를 고르는 오버레이 (검색 가능) - 감독모드 라인업 슬롯 배정용
function showCardPickerOverlay(p, title) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; display:flex; align-items:center; justify-content:center; padding:16px;";
    const box = document.createElement("div");
    box.style.cssText = "background:#15151d; border-radius:14px; padding:16px; width:100%; max-width:380px; max-height:80vh; display:flex; flex-direction:column;";
    box.innerHTML = `
      <div style="font-weight:800; font-size:15px; margin-bottom:8px;">${title || "카드 선택"}</div>
      <input id="cardPickSearch" type="text" placeholder="🔍 선수 이름 검색" style="width:100%; box-sizing:border-box; padding:8px 10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:13px; margin-bottom:8px;">
      <div id="cardPickList" style="overflow-y:auto; flex:1;"></div>
      <button id="cardPickCancel" style="margin-top:10px; padding:10px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff;">취소</button>
    `;
    overlay.classList.add("modalOverlay");
    box.classList.add("modalBox");
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const listEl = box.querySelector("#cardPickList");
    function draw(keyword) {
      const kw = (keyword || "").trim().toLowerCase();
      const eligible = p.cards.filter(c => !c.inMarket && (!kw || c.playerName.toLowerCase().includes(kw)));
      eligible.sort((a, b) => b.ovr - a.ovr);
      if (eligible.length === 0) {
        listEl.innerHTML = `<div class="sub" style="padding:14px 0;">해당하는 카드가 없어요.</div>`;
        return;
      }
      listEl.innerHTML = "";
      eligible.slice(0, 100).forEach(c => {
        const grade = getGrade(c.gradeId);
        const t = TEAMS.find(x => x.id === c.teamId);
        const real = getRealPosition(c.teamId, c.playerName);
        const row = document.createElement("div");
        row.className = "row";
        row.style.cursor = "pointer";
        row.innerHTML = `<span style="color:${grade.color};">${c.playerName} <span style="color:#777; font-size:10px;">(${t ? t.name : ""}${real ? " · 실제:" + POSITION_LABELS[real] : ""})</span></span><span>OVR ${c.ovr}${c.enhanceLevel ? ` (+${c.enhanceLevel})` : ""}</span>`;
        row.onclick = () => { overlay.remove(); resolve(c.cardId); };
        listEl.appendChild(row);
      });
    }
    draw("");
    box.querySelector("#cardPickSearch").addEventListener("input", (e) => draw(e.target.value));
    box.querySelector("#cardPickCancel").onclick = () => { overlay.remove(); resolve(null); };
    overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(null); } };
  });
}

function renderManager(content, p) {
  ensureManagerTickets(p);
  if (!state.managerView) state.managerView = "main";
  if (state.managerView === "battle" && (!state.managerBattle || state.managerBattle.finished)) {
    state.managerView = state.managerBattle && state.managerBattle.finished ? "result" : "main";
  }
  if (state.managerView === "attackSetup") { renderManagerDeckSetup(content, p, "attack"); return; }
  if (state.managerView === "defenseSetup") { renderManagerDeckSetup(content, p, "defense"); return; }
  if (state.managerView === "opponents") { renderManagerOpponents(content, p); return; }
  if (state.managerView === "battle" && state.managerBattle) { renderManagerBattleScreen(content, p); return; }
  if (state.managerView === "result" && state.managerBattle) { renderManagerResult(content, p); return; }
  if (state.managerView === "history") { renderManagerHistory(content, p); return; }
  renderManagerMain(content, p);
}

// ---------------------------------------------------------------------------
// 덱 설정 화면 - 포지션을 다이아몬드 형태의 그리드로 배치, 선택형 카드 형태로 표시
// ---------------------------------------------------------------------------
// 자동배치: 보유 카드 중 (선수별 최고 OVR 카드만) 후보로 놓고, 포지션 적합도까지 반영한
// 배치OVR이 가장 높은 조합을 그리디하게 채워준다. 실제 승률/포지션 보정 로직은 그대로 사용.
function autoAssignLineup(p, lineupType) {
  const lineup = lineupType === "attack" ? p.attackLineup : p.defenseLineup;
  const eligible = p.cards.filter(c => !c.inMarket);
  const bestByPlayer = {};
  eligible.forEach(c => {
    const key = c.teamId + "_" + c.playerName;
    if (!bestByPlayer[key] || c.ovr > bestByPlayer[key].ovr) bestByPlayer[key] = c;
  });
  const candidates = [];
  Object.values(bestByPlayer).forEach(c => {
    POSITIONS.forEach(pos => {
      candidates.push({ cardId: c.cardId, pos, adjOvr: getPositionAdjustedOVR(c.ovr, c.teamId, c.playerName, pos) });
    });
  });
  candidates.sort((a, b) => b.adjOvr - a.adjOvr);
  const usedCards = new Set();
  const filled = {};
  for (const cand of candidates) {
    if (filled[cand.pos] || usedCards.has(cand.cardId)) continue;
    filled[cand.pos] = cand.cardId;
    usedCards.add(cand.cardId);
    if (Object.keys(filled).length === POSITIONS.length) break;
  }
  POSITIONS.forEach(pos => { if (filled[pos]) lineup[pos] = filled[pos]; });
  return Object.keys(filled).length;
}

// 프리셋 - 공격덱/방어덱 각각 기본 3칸 무료, 이후 슬롯은 다이아 500개로 하나씩 추가 구매
const MANAGER_PRESET_BASE_SLOTS = 3;
const MANAGER_PRESET_MAX_SLOTS = 10;
const MANAGER_PRESET_SLOT_COST = 500;
function ensureManagerPresets(p) {
  if (!p.managerPresets) p.managerPresets = { attack: [], defense: [] };
  if (!p.managerPresets.attack) p.managerPresets.attack = [];
  if (!p.managerPresets.defense) p.managerPresets.defense = [];
  if (!p.managerPresetSlots) p.managerPresetSlots = { attack: MANAGER_PRESET_BASE_SLOTS, defense: MANAGER_PRESET_BASE_SLOTS };
  ["attack", "defense"].forEach(k => {
    if (p.managerPresetSlots[k] == null) p.managerPresetSlots[k] = MANAGER_PRESET_BASE_SLOTS;
    while (p.managerPresets[k].length < p.managerPresetSlots[k]) p.managerPresets[k].push(null);
  });
}

      ${info.synergyPct > 0 ? `<div style="font-size:12px; color:#d9b45c; font-weight:700; margin-top:2px;">🔗 같은 구단 시너지 +${info.synergyPct}% 적용 중</div>` : ""}
      ${info.equipBonus > 0 ? `<div style="font-size:12px; color:#7fd8ff; font-weight:700; margin-top:2px;">🛡️ 장비 보너스 +${info.equipBonus} OVR 적용 중</div>` : ""}
    </div>
    <div class="sub" style="text-align:center; margin-bottom:10px;">${desc}</div>
    <div class="sub" style="text-align:center; margin:-4px 0 10px; font-size:11px;">같은 구단 선수를 3명/5명/9명 채우면 OVR 보너스가 붙어요 (여러 구단 동시 적용 가능, 단 9명 한 구단 몰빵보다는 항상 낮아요)</div>
    <button id="mgrAutoAssignBtn" style="width:100%; padding:10px; border:none; border-radius:8px; background:#2e5f8a; color:#fff; font-weight:700; font-size:13px; margin-bottom:12px;">🎯 자동배치 (보유 카드 중 최적 조합)</button>
    <div id="mgrPosGrid" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;"></div>
    <div class="sub" style="text-align:center; margin-bottom:14px;">본래 포지션에 배치하면 <span style="color:#4caf50;">적합 +3</span>, 비슷한 포지션은 <span style="color:#e5a02f;">부적합 -5</span>, 완전히 다른 포지션은 <span style="color:#e53935;">심각한 부적합 -15</span></div>

    <div class="sectionTitle" style="margin-top:0;">📁 프리셋</div>
    <div class="sub" style="margin-bottom:8px;">기본 ${MANAGER_PRESET_BASE_SLOTS}칸 무료, 이후 슬롯은 💎${MANAGER_PRESET_SLOT_COST}로 하나씩 추가할 수 있어요.</div>
    <div id="mgrPresetList"></div>
    <button id="mgrBuyPresetBtn" style="width:100%; margin-top:6px; padding:10px; border:none; border-radius:8px; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:12px;">
      ${slots >= MANAGER_PRESET_MAX_SLOTS ? "슬롯 최대치에 도달했어요" : `+ 프리셋 슬롯 추가 (💎${MANAGER_PRESET_SLOT_COST})`}
    </button>
  `;
  document.getElementById("mgrBackBtn").onclick = () => { state.managerView = "main"; render(); };

  document.getElementById("mgrAutoAssignBtn").onclick = async () => {
    const filledCount = autoAssignLineup(p, lineupType);
    if (lineupType === "defense") p.defenseLineupSnapshot = computeDefenseLineupSnapshot(p); // v2.72: 실제 유저 매칭용 스냅샷 갱신
    await saveProfile(p);
    toast(`자동배치 완료 (${filledCount}/9 포지션 배치됨)`);
    renderManagerDeckSetup(content, p, lineupType);
  };

  // 3열 그리드: 투수 / 좌익-유격-우익 / 3루-2루-1루 / 포수 (모바일에 맞춘 단순화된 다이아몬드 배치)
  const gridPos = [null, "P", null, "LF", "SS", "RF", "3B", "2B", "1B", null, "C", null];
  const grid = document.getElementById("mgrPosGrid");
  gridPos.forEach(pos => {
    if (!pos) { grid.appendChild(document.createElement("div")); return; }
    const slot = info.slots.find(s => s.pos === pos);
    const box = document.createElement("div");
    box.style.cssText = "background:linear-gradient(155deg,#20202c,#131319); border-radius:10px; padding:8px; text-align:center; cursor:pointer; min-height:78px; display:flex; flex-direction:column; justify-content:center;";
    if (slot.card) {
      const real = getRealPosition(slot.card.teamId, slot.card.playerName);
      const grade = getGrade(slot.card.gradeId);
      const diff = slot.posOnlyOvr - slot.card.ovr;
      let fitLabel, fitColor;
      if (diff > 0) { fitLabel = "적합 +3"; fitColor = "#4caf50"; }
      else if (diff === 0) { fitLabel = "정보없음"; fitColor = "#777"; }
      else if (diff === -5) { fitLabel = "부적합 -5"; fitColor = "#e5a02f"; }
      else { fitLabel = "심각한 부적합 -15"; fitColor = "#e53935"; }

        ${real ? `<div style="font-size:8px; color:#666;">실제:${POSITION_LABELS[real]}</div>` : ""}
      `;
    } else {
      box.innerHTML = `<div style="font-size:10px; color:#888;">${POSITION_LABELS[pos]}</div><div style="font-size:20px; color:#555; margin-top:4px;">+</div>`;

      await saveProfile(p);
      renderManagerDeckSetup(content, p, lineupType);
    };
    grid.appendChild(box);
  });

  // 프리셋 슬롯 목록
  const presetList = document.getElementById("mgrPresetList");
  presets.forEach((preset, idx) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <span>${idx + 1}. ${preset ? escapeHtml(preset.name) : "비어있음"}</span>
      <span style="display:flex; gap:6px;">
        <button class="mgrPresetLoad" style="padding:5px 10px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;" ${preset ? "" : "disabled"}>불러오기</button>
        <button class="mgrPresetSave" style="padding:5px 10px; border:none; border-radius:6px; background:#2e7d32; color:#fff; font-size:11px;">저장</button>
      </span>
    `;
    row.querySelector(".mgrPresetLoad").onclick = async () => {
      if (!preset) return;
      const ok = await askConfirm(`"${preset.name}" 프리셋을 불러올까요? 현재 ${label} 배치가 덮어써져요.`);
      if (!ok) return;
      POSITIONS.forEach(pos => { delete lineup[pos]; });
      Object.assign(lineup, preset.lineup);
      if (lineupType === "defense") p.defenseLineupSnapshot = computeDefenseLineupSnapshot(p); // v2.72: 실제 유저 매칭용 스냅샷 갱신
      await saveProfile(p);
      toast(`"${preset.name}" 프리셋을 불러왔어요.`);
      renderManagerDeckSetup(content, p, lineupType);
    };
    row.querySelector(".mgrPresetSave").onclick = async () => {
      const overwrite = !!preset;
      if (overwrite) {
        const ok = await askConfirm(`${idx + 1}번 슬롯("${preset.name}")에 현재 배치를 덮어쓸까요?`);
        if (!ok) return;
      }
      const result = await askInput(overwrite ? "프리셋 덮어쓰기" : "프리셋 저장", [
        { id: "presetName", label: "프리셋 이름", defaultValue: preset ? preset.name : `프리셋 ${idx + 1}` },
      ]);
      if (!result) return;
      const name = (result.presetName || `프리셋 ${idx + 1}`).slice(0, 12);
      presets[idx] = { name, lineup: { ...lineup } };
      await saveProfile(p);
      toast(`"${name}" 저장 완료`);
      renderManagerDeckSetup(content, p, lineupType);
    };
    presetList.appendChild(row);
  });

  document.getElementById("mgrBuyPresetBtn").onclick = async () => {
    if (slots >= MANAGER_PRESET_MAX_SLOTS) return;
    if (p.diamonds < MANAGER_PRESET_SLOT_COST) { toast("다이아가 부족해요."); return; }

    if (!ok) return;
    p.diamonds -= MANAGER_PRESET_SLOT_COST;
    p.managerPresetSlots[lineupType] = slots + 1;

    await saveProfile(p);
    toast("프리셋 슬롯이 추가됐어요!");
    renderManagerDeckSetup(content, p, lineupType);
  };

function renderWorldChallenge(content, p) {

  if (state.worldChallengeView === "battle" && (!state.managerBattle || state.managerBattle.mode !== "worldChallenge" || state.managerBattle.finished)) {
    state.worldChallengeView = (state.managerBattle && state.managerBattle.mode === "worldChallenge" && state.managerBattle.finished) ? "result" : "list";
  }
  if (state.worldChallengeView === "battle" && state.managerBattle) { renderManagerBattleScreen(content, p); return; }
  if (state.worldChallengeView === "result" && state.managerBattle) { renderWorldChallengeResult(content, p); return; }
  renderWorldChallengeStageList(content, p);
}

      ${stage.isWorldRecord && p.worldChallenge.bestMargins[stage.countryId] != null ? `<div class="sub" style="margin-top:4px; font-size:10px; color:#ffd700;">🏆 내 최고 기록: ${p.worldChallenge.bestMargins[stage.countryId]}점 차 승리</div>` : ""}

async function finishWorldChallengeBattle(p, bot, battle) {
  if (battle.rewardGiven) return;
  battle.rewardGiven = true;
  const won = battle.myScore > battle.oppScore;
  battle.won = won;
  ensureWorldChallenge(p);
  const idx = state.worldChallengeStageIdx;
  const stage = WORLD_CHALLENGE_STAGES[idx];
  const alreadyCleared = p.worldChallenge.clearedStageIds.includes(stage.id);

  if (won) {
    battle.wcFirstClear = !alreadyCleared;
    if (!alreadyCleared) {
      // v2.56: 최초 클리어에만 보상 지급. 반복 도전은 순수 연습/기록 갱신용으로만 의미가 있고 보상은 전혀 없음.
      const reward = getWorldChallengeFirstClearReward(idx);
      applyReward(p, reward);
      battle.wcRewardText = rewardTextPlain(reward);
      p.worldChallenge.clearedStageIds.push(stage.id);
      addBonusExp(p, 50 * (idx + 1)); // 스테이지가 뒤로 갈수록 EXP도 더 많이
    } else {
      battle.wcRewardText = null;
    }
    if (stage.isWorldRecord) {
      const margin = battle.myScore - battle.oppScore;
      const prevBest = p.worldChallenge.bestMargins[stage.countryId];
      if (prevBest == null || margin > prevBest) {
        p.worldChallenge.bestMargins[stage.countryId] = margin;
        battle.wcNewRecord = true;
      }
    }
  } else {
    battle.wcRewardText = null;
  }
  await saveProfile(p);
}

// v2.72: 실제 유저를 감독모드 상대로 매칭하려면, 상대 클라이언트가 배틀을 시뮬레이션할 수 있도록
// 방어 라인업을 가벼운 스냅샷(카드ID 대신 팀/선수명/OVR만) 형태로 클라우드에 올려둬야 함.
function computeDefenseLineupSnapshot(p) {
  const snap = {};
  POSITIONS.forEach(pos => {
    const cardId = p.defenseLineup[pos];
    const card = cardId ? p.cards.find(c => c.cardId === cardId) : null;
    if (card) snap[pos] = { teamId: card.teamId, teamName: card.teamName, playerName: card.playerName, ovr: card.ovr };
  });
  return snap;
}

function generateBotOpponent(myRating) {
  const variance = Math.floor((Math.random()*2-1) * 200);
  const rating = Math.max(0, myRating + variance);
  const tier = getManagerTier(rating);
  // 내 레이팅과 비슷한 수준으로 랜덤 라인업(카드 스탯) 생성
  const targetOvrBase = 50 + Math.min(45, Math.floor(rating / 90));
  const lineup = {};
  POSITIONS.forEach(pos => {
    const player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    const ovr = Math.max(40, Math.min(99, Math.round(targetOvrBase + (Math.random()*14 - 7))));
    lineup[pos] = { teamId: player.teamId, teamName: player.teamName, playerName: player.playerName, ovr };
  });
  return { id: "bot_" + Date.now() + Math.floor(Math.random()*100000), name: generateBotManagerName(), rating, tier, lineup, fakeWinRate: Math.floor(35 + Math.random()*40) };
}

function computeBotLineupInfo(bot) {
  const slots = POSITIONS.map(pos => {
    const c = bot.lineup[pos];
    const adjOvr = getPositionAdjustedOVR(c.ovr, c.teamId, c.playerName, pos);
    return { pos, card: c, adjOvr };
  });
  const fielderSlots = slots.filter(s => s.pos !== "P");
  const pitcherSlot = slots.find(s => s.pos === "P");
  const overallOvr = Math.round((slots.reduce((a, s) => a + s.adjOvr, 0) / slots.length) * 10) / 10;
  return {
    slots,
    pitcherOvr: pitcherSlot.adjOvr,
    avgFielderOvr: Math.round(fielderSlots.reduce((a, s) => a + s.adjOvr, 0) / fielderSlots.length),
    overallOvr,
    battingOrder: fielderSlots.map(s => ({ name: s.card.playerName, ovr: s.adjOvr, pos: s.pos, realPos: getRealPosition(s.card.teamId, s.card.playerName) })),
  };
}

// UI 표시용 "예상 승률" 미리보기 - 실제 경기 결과는 이 수치와 무관하게 기존 타석 시뮬레이션으로 결정됨
function predictedWinRatePct(myOvr, oppOvr) {
  const pct = 50 + (myOvr - oppOvr) * 1.5;
  return Math.max(5, Math.min(95, Math.round(pct * 10) / 10));
}

const MANAGER_OPP_REFRESH_COOLDOWN_MS = 10 * 60 * 1000; // 10분
const MANAGER_OPP_REFRESH_DIA_COST = 100;
const MANAGER_REAL_ONLY_RATING = 5000; // v2.79: 마스터 티어 기준선(3000→5000) - 이 이상은 실제 유저만 매칭됨 (브론즈~다이아몬드는 시뮬레이션 봇 존재)
// 시뮬레이션 봇 하나를 배틀 가능한 "상대" 객체로 변환 (라인업은 봇의 현재 OVR 근처에서 매번 새로 뽑음)
function buildBotOpponentFromSimBot(bot) {
  const stats = getBotCurrentStats(bot);
  const lineup = {};
  POSITIONS.forEach(pos => {
    const player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    const ovr = Math.max(40, Math.min(99, Math.round(stats.deckOvr + (Math.random() * 10 - 5))));
    lineup[pos] = { teamId: player.teamId, teamName: player.teamName, playerName: player.playerName, ovr };
  });
  return { id: bot.id, name: bot.nickname, rating: stats.managerRating, tier: getManagerTier(stats.managerRating), lineup, fakeWinRate: Math.floor(35 + Math.random() * 40) };
}
// v2.73: 마스터 미만은 시뮬레이션 봇(고정 성장) 위주로 채우되 실제 유저가 있으면 섞어서 보여주고,
// 마스터 이상은 100% 실제 유저만 매칭됨. 실제 유저 후보는 방어 라인업 스냅샷을 클라우드에 올려둔 유저 중에서,
// 내 레이팅과 가까운 순으로 고름.
async function buildManagerOpponentBatch(p) {
  const rating = p.managerRating || 0;
  const isRealOnly = rating >= MANAGER_REAL_ONLY_RATING;
  let realCandidates = [];
  if (window.KBOCloud && window.KBOCloud.fetchRealManagerCandidates) {
    try {
      const myUid = window.KBOCloud.getUid ? window.KBOCloud.getUid() : null;
      const result = await window.KBOCloud.fetchRealManagerCandidates(myUid, 50);
      if (result.ok) {
        realCandidates = result.rows.sort((a, b) => Math.abs(a.managerRating - rating) - Math.abs(b.managerRating - rating));
      }
    } catch (e) { /* 실패하면 봇으로 폴백 */ }
  }
  const realOpponents = realCandidates.slice(0, 5).map(r => ({
    id: "real_" + r.uid,
    name: r.nickname,
    rating: r.managerRating,
    tier: getManagerTier(r.managerRating),
    lineup: r.lineup,
    fakeWinRate: Math.floor(35 + Math.random() * 40),
    isRealPlayer: true,
  }));
  if (isRealOnly) {
    // 마스터 이상 - 실제 유저만 보여줌. 부족하면 부족한 대로만 보여주고 봇으로 채우지 않음.
    return realOpponents;
  }
  // 마스터 미만 - 실제 유저를 우선 포함하고, 나머지는 내 레이팅과 가까운 시뮬레이션 봇으로 채움
  const batch = [...realOpponents];
  const nearbyBots = SIMULATED_BOTS
    .map(bot => ({ bot, stats: getBotCurrentStats(bot) }))
    .sort((a, b) => Math.abs(a.stats.managerRating - rating) - Math.abs(b.stats.managerRating - rating));
  let botIdx = 0;
  while (batch.length < 5 && botIdx < nearbyBots.length) {
    batch.push(buildBotOpponentFromSimBot(nearbyBots[botIdx].bot));
    botIdx++;
  }
  return batch;
}

// ---- 경기 시뮬레이션 ----
function simulateAtBatOutcome(batterOvr, pitcherOvr) {
  const diff = Math.max(-40, Math.min(40, batterOvr - pitcherOvr));
  const shift = diff * 0.0035;
  const base = { out: 0.62 - shift, walk: 0.08 + shift*0.15, single: 0.17 + shift*0.35, double: 0.06 + shift*0.25, triple: 0.01 + shift*0.05, hr: 0.06 + shift*0.35 };
  Object.keys(base).forEach(k => { if (base[k] < 0.01) base[k] = 0.01; });
  const total = Object.values(base).reduce((a,b) => a+b, 0);
  Object.keys(base).forEach(k => base[k] /= total);
  const r = Math.random();
  let acc = 0;
  for (const [k, v] of Object.entries(base)) { acc += v; if (r <= acc) return k; }
  return "out";
}
function advanceOnHit(bases, numBases) {
  const newBases = [false, false, false];
  let runs = 0;
  for (let i = 2; i >= 0; i--) {
    if (bases[i]) {
      const dest = i + numBases;
      if (dest >= 3) runs++; else newBases[dest] = true;
    }
  }
  const battDest = numBases - 1;
  if (battDest >= 3) runs++; else if (battDest >= 0) newBases[battDest] = true;
  return { bases: newBases, runs };
}
function advanceOnWalk(bases) {
  const b1 = bases[0], b2 = bases[1], b3 = bases[2];
  let runs = 0, newB2 = b2, newB3 = b3;
  if (b1) {
    if (b2) {
      if (b3) runs = 1;
      newB3 = true;
    }
    newB2 = true;
  }
  return { bases: [true, newB2, newB3], runs };
}

function createManagerBattle(p, bot, mode) {
  const myInfo = computeLineupInfo(p, p.attackLineup);
  const oppInfo = computeBotLineupInfo(bot);
  return {
    mode: mode || "manager", // v2.54: "manager"(PvP) 또는 "worldChallenge"(PvE) - 같은 엔진을 공유하되 결과 처리만 갈라짐
    inning: 1,
    half: "top", // top = 원정(나) 공격, bottom = 상대 공격 (나는 항상 원정팀으로 공격)
    outs: 0,
    bases: [false, false, false],
    myScore: 0,
    oppScore: 0,
    myBatterIdx: 0,
    oppBatterIdx: 0,
    myBattingOrder: myInfo.battingOrder,
    oppBattingOrder: oppInfo.battingOrder,
    myPitcherOvr: myInfo.pitcherOvr,
    oppPitcherOvr: oppInfo.pitcherOvr,
    myName: p.nickname || "내 팀",
    oppName: bot.name,
    myPitcherName: (myInfo.slots.find(s => s.pos === "P") && myInfo.slots.find(s => s.pos === "P").card && myInfo.slots.find(s => s.pos === "P").card.playerName) || "내 투수",
    oppPitcherName: (bot.lineup.P && bot.lineup.P.playerName) || "상대 투수",
    log: [],
    finished: false,
    playTimer: null,
    startedAt: Date.now(),
    stats: { myHits: 0, myHR: 0, oppHits: 0, oppHR: 0 },
    currentBatterName: null,
    currentBatterOvr: null,
    currentBatterPos: null,
    currentBatterRealPos: null,
    currentPitcherOvr: null,
    currentAttackingMe: true,
    bigEvent: null,
    walkoff: false,
  };
}

function managerBattleStep(battle) {
  if (battle.finished) return;
  const attackingMe = battle.half === "top";
  const order = attackingMe ? battle.myBattingOrder : battle.oppBattingOrder;
  const idxKey = attackingMe ? "myBatterIdx" : "oppBatterIdx";
  const batter = order[battle[idxKey] % order.length];
  const pitcherOvr = attackingMe ? battle.oppPitcherOvr : battle.myPitcherOvr;
  battle[idxKey]++;

  battle.currentBatterName = batter.name;
  battle.currentBatterOvr = batter.ovr;
  battle.currentBatterPos = batter.pos;
  battle.currentBatterRealPos = batter.realPos;
  battle.currentPitcherOvr = pitcherOvr;
  battle.currentAttackingMe = attackingMe;

  const scoreBefore = { my: battle.myScore, opp: battle.oppScore };
  const outcome = simulateAtBatOutcome(batter.ovr, pitcherOvr);
  let runsScored = 0;
  let logMsg = "";
  let bigEvent = null;
  if (outcome === "out") {
    battle.outs++;
    logMsg = `${batter.name} 아웃`;
  } else if (outcome === "walk") {
    const r = advanceOnWalk(battle.bases);
    battle.bases = r.bases; runsScored = r.runs;
    logMsg = `${batter.name} 볼넷 출루`;
  } else {
    const numBases = { single: 1, double: 2, triple: 3, hr: 4 }[outcome];
    const r = advanceOnHit(battle.bases, numBases);
    battle.bases = r.bases; runsScored = r.runs;
    const labelMap = { single: "안타", double: "2루타", triple: "3루타", hr: "홈런!" };
    logMsg = `${batter.name} ${labelMap[outcome]}${runsScored > 0 ? ` (${runsScored}점 획득)` : ""}`;
    if (attackingMe) { battle.stats.myHits++; if (outcome === "hr") battle.stats.myHR++; }
    else { battle.stats.oppHits++; if (outcome === "hr") battle.stats.oppHR++; }
    if (outcome === "hr") bigEvent = { title: "HOME RUN!", sub: `${batter.name} ${runsScored >= 4 ? "만루 홈런!" : "홈런!"}` };
    else if (outcome === "triple") bigEvent = { title: "TRIPLE!", sub: `${batter.name} 3루타!` };
    else if (outcome === "double" && runsScored >= 2) bigEvent = { title: "BIG HIT!", sub: `${batter.name} ${runsScored}타점 2루타!` };
  }
  if (runsScored > 0) {
    if (attackingMe) battle.myScore += runsScored; else battle.oppScore += runsScored;
  }
  // 역전 감지 (동점→리드, 또는 리드 뒤바뀜)
  const wasLeading = scoreBefore.my > scoreBefore.opp ? "my" : scoreBefore.my < scoreBefore.opp ? "opp" : "tie";
  const isLeadingNow = battle.myScore > battle.oppScore ? "my" : battle.myScore < battle.oppScore ? "opp" : "tie";
  if (!bigEvent && runsScored > 0 && wasLeading !== isLeadingNow && isLeadingNow !== "tie") {
    bigEvent = { title: "역전!", sub: `${isLeadingNow === "my" ? battle.myName : battle.oppName} 역전!` };
  }
  battle.bigEvent = bigEvent;

  const inningPrefix = `${battle.inning}회${battle.half === "top" ? "초" : "말"}`;
  battle.log.push(`${inningPrefix} ${logMsg}`);
  if (battle.log.length > 60) battle.log.shift();

  if (battle.outs >= 3) {
    battle.outs = 0;
    battle.bases = [false, false, false];
    const wasBottomOfNineOrLater = battle.half === "bottom" && battle.inning >= 9;
    if (battle.half === "top") {
      battle.half = "bottom";
    } else {
      battle.half = "top";
      battle.inning++;
    }
    // 경기 종료 조건은 기존 그대로 유지: 9회를 넘겼고 점수가 다르면 종료 (연장 포함)
    if (battle.inning > 9 && battle.myScore !== battle.oppScore) {
      battle.finished = true;
      if (wasBottomOfNineOrLater && battle.oppScore > battle.myScore) {
        battle.walkoff = true;
        battle.bigEvent = { title: "끝내기 패배...", sub: `${battle.oppName}의 끝내기!` };
      }
    } else if (battle.inning > 12) {
      battle.finished = true; // 연장 12회 초과시 강제 종료(무한루프 방지, 기존 로직 그대로)
    }
  }
}

// 연승 배수: 연속 승리 1번째=기본(x1.0), 2번째=x1.2 ... 6번째 이상은 x2.0으로 고정
const MANAGER_STREAK_MULTIPLIERS = { 1: 1.0, 2: 1.2, 3: 1.4, 4: 1.6, 5: 1.8, 6: 2.0 };

// 상대가 나보다 강할수록(레이팅 높을수록) 이겼을 때 더 많은 점수를, 약한 상대에게 지면 더 많이 깎이도록 계산
// v2.74: 다이아몬드(2,500점) 이상은 연승 보너스가 전혀 없고, 승리해도 아주 조금만 오르는 반면
// 패배하면 큰 폭으로 떨어져서 "올라가긴 어렵고 떨어지긴 쉬운" 진짜 최상위 구간처럼 만듦.
function computeManagerRatingDelta(myRatingBefore, oppRating, won, streakBeforeThisGame) {
  const isDiamondPlus = myRatingBefore >= 3800; // v2.79: 다이아몬드 티어 기준선(2500→3800)에 맞춰 조정
  if (won) {
    if (isDiamondPlus) {
      const base = 3 + Math.max(0, Math.min(5, (oppRating - myRatingBefore) / 200));
      const clampedBase = Math.max(2, Math.min(8, Math.round(base)));
      return { delta: clampedBase, newStreak: streakBeforeThisGame + 1, mult: 1, base: clampedBase };
    }
    const base = 20 * (1 + (oppRating - myRatingBefore) / 1000);
    const clampedBase = Math.max(8, Math.min(60, Math.round(base)));
    const streakNumber = Math.min(6, streakBeforeThisGame + 1);
    const mult = MANAGER_STREAK_MULTIPLIERS[streakNumber] || 1.0;
    return { delta: Math.round(clampedBase * mult), newStreak: streakBeforeThisGame + 1, mult, base: clampedBase };
  } else {
    if (isDiamondPlus) {
      const base = 35 * (1 - (oppRating - myRatingBefore) / 1000);
      const clampedBase = Math.max(25, Math.min(60, Math.round(base)));
      return { delta: -clampedBase, newStreak: 0, mult: 1, base: clampedBase };
    }
    const base = 15 * (1 - (oppRating - myRatingBefore) / 1000);
    const clampedBase = Math.max(5, Math.min(30, Math.round(base)));
    return { delta: -clampedBase, newStreak: 0, mult: 1, base: clampedBase };
  }
}

async function finishManagerBattle(p, bot, battle) {
  if (battle.rewardGiven) return;
  battle.rewardGiven = true;
  const won = battle.myScore > battle.oppScore;
  battle.won = won;
  const myRatingBefore = p.managerRating;
  const streakBefore = p.managerWinStreak || 0;
  const result = computeManagerRatingDelta(myRatingBefore, bot.rating, won, streakBefore);
  battle.ratingDelta = result.delta;
  battle.streakMult = result.mult;
  battle.streakAfter = result.newStreak;

  if (won) {
    p.managerRating += result.delta;
    p.managerWins = (p.managerWins || 0) + 1;
    p.managerWinStreak = result.newStreak;
    p.coins += 500000;
    p.diamonds += 20;
    addBonusExp(p, 100); // v2.47: 감독모드 승리 시 레벨 EXP 지급
    let ticketMsg = "";
    if (myRatingBefore < 3800 && result.newStreak >= MANAGER_STREAK_TICKET_THRESHOLD && (p.managerStreakTicketCount || 0) < MANAGER_STREAK_TICKET_MAX_PER_DAY) {
      p.managerTickets += 1;
      p.managerStreakTicketCount = (p.managerStreakTicketCount || 0) + 1;
      ticketMsg = `, 🎟️연승보너스 티켓+1`;
      battle.streakTicketAwarded = true;
    }
    battle.log.push(`🏆 승리! (${battle.myScore}:${battle.oppScore}) ${result.newStreak}연승 ×${result.mult} 레이팅 +${result.delta}, 🪙500,000, 💎20${ticketMsg}`);
  } else {
    p.managerRating = Math.max(0, p.managerRating + result.delta);
    p.managerLosses = (p.managerLosses || 0) + 1;
    p.managerWinStreak = 0;
    battle.log.push(`💔 패배 (${battle.myScore}:${battle.oppScore}) 레이팅 ${result.delta}`);
  }
  if (!p.managerMatchHistory) p.managerMatchHistory = [];
  p.managerMatchHistory.push({
    won, myScore: battle.myScore, oppScore: battle.oppScore,
    opponentName: bot.name, ratingDelta: battle.ratingDelta, ts: Date.now(),
  });
  if (p.managerMatchHistory.length > 30) p.managerMatchHistory = p.managerMatchHistory.slice(-30);
  await saveProfile(p);
}

function getBotRowsForKey(cacheKey) {
  return SIMULATED_BOTS.map(bot => {
    const stats = getBotCurrentStats(bot);
    let value;
    if (cacheKey === "mgr") value = stats.managerRating;
    else if (cacheKey === "level") value = stats.level;
    else if (cacheKey === "touch") value = stats.personalTap;
    else if (cacheKey === "deckOvr") value = stats.deckOvr;
    else value = 0;
    return { nickname: bot.nickname, teamId: bot.teamId, value, isBot: true };
  });

  const list = [...getBotRowsForKey(cacheKey), { nickname: myLabel, teamId: myTeamId, value: myValue, isMe: true }];
  list.sort((a, b) => b.value - a.value);
  return list;
}

];
function ensureRankRewardsClaimed(p) { if (!p.rankRewardsClaimed) p.rankRewardsClaimed = {}; }
function getRankKeyValue(p, rankKey) {
  if (rankKey === "mgr") return p.managerRating || 0;
  if (rankKey === "touch") return Math.floor(p.personalTap || 0);
  return 0;
}
function findRankRewardTier(table, rank, value) {
  return table.find(t => {
    const rankMatches = (t.rank && rank === t.rank) || (t.rankRange && rank >= t.rankRange[0] && rank <= t.rankRange[1]);
    if (!rankMatches) return false;
    if (t.minValue && (value == null || value < t.minValue)) return false;
    return true;
  }) || null;
}
function claimRankReward(p, tier) {
  ensureRankRewardsClaimed(p);
  if (p.rankRewardsClaimed[tier.key]) return { ok: false, reason: "이미 받은 보상이에요." };
  applyReward(p, tier.reward);
  p.rankRewardsClaimed[tier.key] = true;
  return { ok: true };
}
// 순위표 + 보상 안내 + (실시간 순위 확인되면) 수령 버튼을 그려줌
function renderRankRewardBox(boxId, table, p, rankKey) {
  const box = document.getElementById(boxId);
  if (!box) return;
  ensureRankRewardsClaimed(p);
  const liveRank = state.liveRank && state.liveRank[rankKey];
  const myValue = getRankKeyValue(p, rankKey);
  const minValueInTable = table[0] && table[0].minValue;
  const tableHtml = table.map(t => {
    const already = p.rankRewardsClaimed[t.key];
    return `<div class="row" style="${already ? 'opacity:0.5;' : ''}"><span>${already ? "✅ " : "🎁 "}${t.label}</span><span style="font-size:11px; color:#999;">${rewardTextPlain(t.reward)}${t.reward.titleId ? ` · 🏷️${TITLES[t.reward.titleId].label}` : ""}</span></div>`;
  }).join("");
  let claimHtml = "";
  if (liveRank) {
    const tier = findRankRewardTier(table, liveRank, myValue);
    const rankOnlyTier = findRankRewardTier(table, liveRank, Infinity); // 순위만으로 걸리는지 확인(최소 기준 무시)용
    if (tier && !p.rankRewardsClaimed[tier.key]) {
      claimHtml = `<button class="rankClaimBtn" data-rankkey="${rankKey}" style="width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-weight:700; font-size:13px; margin-top:6px;">🎁 ${tier.label} 보상 받기!</button>`;
    } else if (tier) {
      claimHtml = `<div class="sub" style="margin-top:6px;">이미 ${tier.label} 보상을 받았어요.</div>`;
    } else if (rankOnlyTier) {
      claimHtml = `<div class="sub" style="margin-top:6px; color:#e5a02f;">순위 조건은 만족했지만 최소 기준(${rankOnlyTier.minValue.toLocaleString()})을 넘어야 받을 수 있어요. (현재 ${myValue.toLocaleString()})</div>`;
    }
  } else {
    claimHtml = `<div class="sub" style="margin-top:6px; font-size:11px;">🌐 실시간 순위가 확인되면 보상 수령 버튼이 여기에 떠요.</div>`;
  }
  box.innerHTML = `<div class="sectionTitle" style="margin-top:14px;">🎁 순위 보상</div><div class="sub" style="margin-top:-6px; margin-bottom:6px; font-size:11px;">순위와 별개로 최소 기준(${minValueInTable ? minValueInTable.toLocaleString() : 0}) 이상이어야 받을 수 있어요.</div>${tableHtml}${claimHtml}`;
  const claimBtn = box.querySelector(".rankClaimBtn");
  if (claimBtn) {
    claimBtn.onclick = async () => {
      const rank = state.liveRank && state.liveRank[rankKey];
      const value = getRankKeyValue(p, rankKey);
      const tier = rank && findRankRewardTier(table, rank, value);
      if (!tier) return;
      const result = claimRankReward(p, tier);
      if (!result.ok) { toast(result.reason); return; }
      await saveProfile(p);
      toast(`🎉 ${tier.label} 보상 수령완료! ${rewardTextPlain(tier.reward)}`);
      pushAnnouncement(`🏆 ${p.nickname || "누군가"}님이 랭킹 ${tier.label} 보상을 수령했어요!`);
      renderRankRewardBox(boxId, table, p, rankKey);
    };
  }
}

async function refreshLeaderboardWithLiveData(content, p, team, field, myValue, expectedSubTab, tierMode, deriveDisplayValue) {
  if (!window.KBOCloud || !window.KBOCloud.fetchTopProfiles) return;
  const myUid = window.KBOCloud.getUid();
  try {
    const result = await window.KBOCloud.fetchTopProfiles(field, 30);
    if (state.tab !== "ranking" || state.rankingCategory !== "individual" || state.rankingSubTab !== expectedSubTab) return;
    // v2.19: 예전엔 실유저가 3명 이상이어야만 실시간 데이터로 바꿨는데, 그러면 지금처럼 계정이 2~3개뿐인
    // 테스트 단계에서는 서로 다른 기기로 로그인해도 절대 서로를 볼 수 없었음. 1명이라도 있으면 바로 실데이터로 전환.
    if (!result.ok || result.rows.length < 1) return;
    let rows = result.rows.map(r => ({
      nickname: r.nickname || "익명",
      teamId: r.teamId,
      value: deriveDisplayValue ? deriveDisplayValue(r.value) : r.value,
      isMe: !!(myUid && r.uid === myUid),
    }));
    if (!rows.some(r => r.isMe)) {
      rows.push({ nickname: p.nickname || team.name, teamId: team.id, value: deriveDisplayValue ? deriveDisplayValue(myValue) : myValue, isMe: true });
    }
    rows = rows.concat(getBotRowsForKey(expectedSubTab)); // v2.73: 실시간 데이터가 와도 봇은 계속 같이 보여줌(마스터 이상만 실유저 전용)
    rows.sort((a, b) => b.value - a.value);
    const lbList = document.getElementById("lbList");
    if (lbList) renderLeaderboardList(lbList, rows, tierMode);
    const tag = document.getElementById("lbLiveTag");
    if (tag) tag.textContent = "🌐 실시간";
    const myRank = rows.findIndex(r => r.isMe) + 1;
    const subEl = content.querySelector(".sub");
    if (subEl && myRank > 0) subEl.textContent = subEl.textContent.replace(/내 순위: \d+위/, `내 순위: ${myRank}위`);
    if (!state.liveRank) state.liveRank = {};
    if (myRank > 0) {
      state.liveRank[expectedSubTab] = myRank;
      if (expectedSubTab === "mgr") renderRankRewardBox("rankRewardBox_manager", RANK_REWARDS_MANAGER, p, "mgr");
      if (expectedSubTab === "touch") renderRankRewardBox("rankRewardBox_touch", RANK_REWARDS_TOUCH, p, "touch");
    }
  } catch (e) { /* 조용히 무시 - 이미 표시된 봇 목록 유지 */ }
}

function renderRanking(content, p, team) {
  if (!state.rankingCategory) state.rankingCategory = "individual";
  if (!state.rankingSubTab) state.rankingSubTab = "manager";

  content.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:10px;">

      <button class="rankCatTab" data-c="team" style="flex:1; padding:9px; border:none; border-radius:8px; background:${state.rankingCategory==='team'?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:12px; font-weight:700;">🏟️ 구단 랭킹</button>

  content.querySelectorAll(".rankCatTab").forEach(b => {

    { id: "touch", label: "개인 터치수" },

    { id: "season", label: "시즌" },

    const b = document.createElement("button");
    b.style.cssText = `flex:1; min-width:70px; padding:8px; border:none; border-radius:8px; background:${state.rankingSubTab===s.id?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:11px;`;
    b.textContent = s.label;
    b.onclick = () => { state.rankingSubTab = s.id; renderRanking(content, p, team); };
    subRow.appendChild(b);
  });
  if (!subs.find(s => s.id === state.rankingSubTab)) state.rankingSubTab = subs[0].id;

  // ---- 개인 랭킹 ----
  if (state.rankingCategory === "individual") {
    if (state.rankingSubTab === "manager") {
      const tier = getManagerTier(p.managerRating);
      const myLiveRank = state.liveRank && state.liveRank.mgr;
      const isMeChallenger = myLiveRank && myLiveRank <= 5 && p.managerRating >= 7000;
      const list = buildFakeLeaderboard("mgr", p.managerRating, p.nickname || team.name, team.id);
      const myRank = list.findIndex(r => r.isMe) + 1;
      body.innerHTML = `
        <div class="sub">내 순위: ${myRank}위 · ${isMeChallenger ? "🏆 챌린저" : tier.name} (${p.managerRating}점, ${p.managerWins}승 ${p.managerLosses}패)</div>
        <div class="sectionTitle">감독모드 랭킹 <span id="lbLiveTag" style="font-size:10px; color:#999; font-weight:400;"></span></div>
        <div id="lbList"></div>
        <div id="rankRewardBox_manager"></div>
      `;
      renderLeaderboardList(document.getElementById("lbList"), list, true);
      renderRankRewardBox("rankRewardBox_manager", RANK_REWARDS_MANAGER, p, "mgr");
      refreshLeaderboardWithLiveData(content, p, team, "managerRating", p.managerRating, "mgr", true);
      return;
    }
    if (state.rankingSubTab === "level") {
      const lvl = getLevelInfo(p);
      const list = buildFakeLeaderboard("level", lvl.level, p.nickname || team.name, team.id);
      const myRank = list.findIndex(r => r.isMe) + 1;
      body.innerHTML = `
        <div class="sub">내 순위: ${myRank}위 · Lv.${lvl.level}</div>
        <div class="sectionTitle">레벨 랭킹 <span id="lbLiveTag" style="font-size:10px; color:#999; font-weight:400;"></span></div>
        <div id="lbList"></div>
      `;
      renderLeaderboardList(document.getElementById("lbList"), list);
      refreshLeaderboardWithLiveData(content, p, team, "personalTap", Math.floor(p.personalTap || 0), "level", false, v => getLevelInfo({ personalTap: v }).level);
      return;
    }
    if (state.rankingSubTab === "touch") {
      const list = buildFakeLeaderboard("touch", Math.floor(p.personalTap), p.nickname || team.name, team.id);
      const myRank = list.findIndex(r => r.isMe) + 1;
      body.innerHTML = `
        <div class="sub">내 순위: ${myRank}위 · 누적 TAP ${Math.floor(p.personalTap).toLocaleString()}</div>
        <div class="sectionTitle">개인 터치수 랭킹 <span id="lbLiveTag" style="font-size:10px; color:#999; font-weight:400;"></span></div>
        <div id="lbList"></div>
        <div id="rankRewardBox_touch"></div>

      refreshLeaderboardWithLiveData(content, p, team, "personalTap", Math.floor(p.personalTap || 0), "touch", false);
      return;
    }
    if (state.rankingSubTab === "deckOvr") {
      // v2.48: 공격덱/방어덱 중 더 높은 쪽의 OVR로 순위를 매김. 순수 자랑용이라 보상은 없음.
      const atkOvr = computeLineupInfo(p, p.attackLineup).overallOvr || 0;
      const defOvr = computeLineupInfo(p, p.defenseLineup).overallOvr || 0;
      const myDeckOvr = Math.max(atkOvr, defOvr);
      if (p.deckOvr !== myDeckOvr) { p.deckOvr = myDeckOvr; saveProfile(p); } // v2.66: 실시간 랭킹에 쓰이도록 클라우드에 같이 올라가게 캐싱
      const list = buildFakeLeaderboard("deckOvr", myDeckOvr, p.nickname || team.name, team.id);

      body.innerHTML = `
        <div class="sub">내 순위: ${myRank}위 · 최고 덱 OVR ${myDeckOvr} (공격 ${atkOvr || "-"} · 방어 ${defOvr || "-"} 중 높은 쪽)</div>

      return;
    }
    if (state.rankingSubTab === "season") {
      ensureSeason(p);
      const tier = getSeasonTier(p.season.touchCount);
      const remainMs = Math.max(0, p.season.endsAt - Date.now());
      const remainDays = Math.floor(remainMs / (24*60*60*1000));
      body.innerHTML = `
        <div class="sectionTitle">KBO TOUCH SEASON ${p.season.seasonId}</div>
        <div class="row"><span>시즌 종료까지</span><span>${remainDays}일 남음</span></div>
        <div class="row"><span>이번 시즌 터치 수</span><span>${p.season.touchCount.toLocaleString()}</span></div>
        <div class="row"><span>현재 등급</span><span style="font-weight:800;">${tier.label}</span></div>
        <div class="sub" style="margin-top:10px;">시즌 종료 시 등급에 따라 보상이 자동 지급돼요. 카드/코인/다이아/계정 정보는 시즌이 끝나도 그대로 유지돼요.</div>
        ${p.season.lastFinishedSeasonId > 0 ? `<div class="sub" style="margin-top:14px;">지난 시즌(SEASON ${p.season.lastFinishedSeasonId}) 최종 터치 수: ${p.season.lastFinishedTouchCount.toLocaleString()}</div>` : ""}
      `;
      return;
    }
  }

  // ---- 구단 랭킹 ----
  if (state.rankingSubTab === "weekly") {
    ensureTeamWeekly(p);
    getWeeklyTeamTotals(p.teamWeekly.weekKey).then(totals => {
      const myRank = Object.entries(totals).sort((a,b) => b[1]-a[1]).findIndex(([id]) => id === team.id) + 1;
      body.innerHTML = `
        <div class="sub">이번 주(${p.teamWeekly.weekKey}~) 우리 구단 순위: ${myRank || "-"}위</div>
        <div class="row"><span>내 이번 주 기여도</span><span>${p.teamWeekly.contribution.toLocaleString()} TAP</span></div>
        <div class="sectionTitle">주간 구단 랭킹 (터치 수)</div>
        <div id="weeklyRankList"></div>
      `;
      const list = document.getElementById("weeklyRankList");
      Object.entries(totals).sort((a,b) => b[1]-a[1]).forEach(([id, total], idx) => {
        const t = TEAMS.find(x => x.id === id);
        const row = document.createElement("div");
        row.className = "row" + (id === team.id ? " me" : "");
        row.innerHTML = `<span>${idx+1}. ${t.name}</span><span>${total.toLocaleString()} TAP</span>`;
        list.appendChild(row);
      });
