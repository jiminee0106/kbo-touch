    return;
  }

  // 전체 구단랭킹 (누적 터치 수) - v2.71 핫픽스: init() 시점에 한 번만 캐싱된 state.teamTotals를 그대로 쓰고 있어서
  // 다른 기기의 갱신 내용이 전혀 반영되지 않던 버그. 이제 화면을 열 때마다 매번 새로 불러옴.
  body.innerHTML = `
    <div class="sub">불러오는 중...</div>
    <div class="sectionTitle">구단 랭킹 (누적 터치 수)</div>
    <div id="rankList"></div>
  `;
  getAllTeamTotals().then(totals => {
    if (state.tab !== "ranking" || state.rankingCategory !== "team" || state.rankingSubTab !== "total") return; // 그 사이 화면이 바뀌었으면 무시
    state.teamTotals = totals;
    const myRank = Object.entries(totals)
      .sort((a,b) => b[1]-a[1])
      .findIndex(([id]) => id === team.id) + 1;
    body.innerHTML = `
      <div class="sub">우리 구단(${team.name}) 순위: ${myRank || "-"}위</div>
      <div class="sectionTitle">구단 랭킹 (누적 터치 수)</div>
      <div id="rankList"></div>
    `;
    const rankList = document.getElementById("rankList");
    Object.entries(totals)
      .sort((a,b) => b[1]-a[1])
      .forEach(([id, total], idx) => {
        const t = TEAMS.find(x => x.id === id);
        const row = document.createElement("div");
        row.className = "row" + (id === team.id ? " me" : "");
        row.innerHTML = `<span>${idx+1}. ${t.name}</span><span>${total.toLocaleString()} TAP</span>`;
        rankList.appendChild(row);
      });
  });
}

// 전체 공지 플래카드: 초월 카드 등장, 히든 업적 달성 같은 큼직한 이벤트를 메인화면 상단에
// 반투명 회색 배경으로 왼쪽→오른쪽으로 흘러가는 문구로 띄워줌 (서버 연동 후엔 다른 유저 이벤트도 여기로 방송될 예정)
let _announceQueue = [];
let _announceBusy = false;
function pushAnnouncement(text) {
  _announceQueue.push(text);
  if (!_announceBusy) _playNextAnnouncement();
}
function _playNextAnnouncement() {
  const banner = document.getElementById("announceBanner");
  if (!banner || _announceQueue.length === 0) { _announceBusy = false; return; }
  _announceBusy = true;
  const text = _announceQueue.shift();
  banner.style.display = "block";
  banner.innerHTML = `<span class="marqueeText">${text}</span>`;
  const span = banner.querySelector(".marqueeText");
  const duration = Math.max(7, Math.min(16, text.length * 0.16));
  span.style.animationDuration = `${duration}s`;
  span.addEventListener("animationend", () => {
    banner.style.display = "none";
    _playNextAnnouncement();
  }, { once: true });
}

function showFloat(text) {
  const wrap = document.getElementById("floatWrap");
  if (!wrap) return;
  // 너무 빨리 연속으로 뜨면 DOM이 쌓여서 렉의 원인이 되므로 동시 개수를 제한
  while (wrap.children.length >= 8) {
    wrap.removeChild(wrap.firstChild);
  }
  const el = document.createElement("div");
  el.className = "floatText";
  el.textContent = text;
  el.style.color = "#fff";
  wrap.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 900);
}

// 카드 획득 이펙트: 커먼은 다른 등급과 같은 방식이되 아주 작고 심심하게, 등급이 올라갈수록 화려해지고
// EPIC 이상부터는 버스트 링 + 흔들림 효과가 추가로 붙는다.
function showCardEffect(grade, playerName) {
  const p = state.profile;
  if (p && !isGradeEffectEnabled(p, grade.id)) return; // 설정에서 이 등급의 드랍 이펙트를 꺼둔 경우

  // 짧은 시간에 카드 이펙트가 겹쳐 뜨면 무거워지므로 동시 개수를 제한
  const existing = document.querySelectorAll(".cardEffectOverlay");
  if (existing.length >= 4) existing[0].remove();

  const overlay = document.createElement("div");
  overlay.className = "cardEffectOverlay";

  const rarityIndex = GRADES.findIndex(g => g.id === grade.id);
  const epicIndex = GRADES.findIndex(g => g.id === "EPIC");
  const isTranscendent = grade.id === "TRANSCENDENT";
  const isEpicPlus = rarityIndex >= epicIndex;
  const isCommon = grade.id === "COMMON";
  playCardDropSound(grade.id);
  if (isTranscendent) {
    const text = `🌟 ${playerName || "누군가"} 님이 TRANSCENDENT 카드를 뽑았습니다! 🌟`;
    pushAnnouncement(text); // 로컬에는 항상 즉시 표시 (클라우드 연결 여부와 무관하게 작동)
    if (window.KBOCloud && window.KBOCloud.postAnnouncement) window.KBOCloud.postAnnouncement(text); // 서버에 있으면 다른 유저에게도 방송
  }

  if (isCommon) {
    // 미니 버전: 어두운 알약 배경 위에 작게 표시 (색상 플래시 없이 심플하게)
    overlay.innerHTML = `
      <div class="cardRevealMini">
        <span style="color:#aaa; font-size:13px; font-weight:700;">${grade.label}</span>
        <span style="color:#eee; font-size:13px; margin-left:6px;">${playerName || ""}</span>
      </div>
    `;
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 650);
    return;
  }

  // EPIC을 기준(0)으로 그 위 등급마다 화려함이 계속 증가하도록 스케일링
  const tierAboveEpic = Math.max(0, rarityIndex - epicIndex); // EPIC=0, UNIQUE=1, MYSTIC=2, LEGENDARY=3, TRANSCENDENT=4
  const durationMs = isTranscendent ? 4200 : 900 + rarityIndex * 220 + tierAboveEpic * 150;
  const flashColor = grade.effectColor;

  let burstHTML = "";
  if (isEpicPlus) {
    // 등급이 오를수록 버스트 링 개수와 두께가 계속 늘어남
    const ringCount = isTranscendent ? 10 : Math.min(3 + tierAboveEpic, 5);
    for (let i = 0; i < ringCount; i++) {
      const c = isTranscendent ? "#fff" : flashColor;
      const thickness = 3 + tierAboveEpic;
      burstHTML += `<div class="burstRing" style="border-color:${c}; border-width:${thickness}px; animation-delay:${i * (isTranscendent ? 110 : 110)}ms;"></div>`;
    }
  }

  const gradeFontSize = isTranscendent ? 34 : 22 + tierAboveEpic * 4;
  const nameFontSize = isTranscendent ? 17 : 13 + tierAboveEpic;
  const glowSize = isTranscendent ? 60 : 18 + tierAboveEpic * 6;
  const shakeClass = isEpicPlus && !isTranscendent ? (tierAboveEpic >= 2 ? "epicShake bigShake" : "epicShake") : "";
  const panelBorderColor = isTranscendent ? "#ffd700" : flashColor;

  overlay.innerHTML = `
    ${isTranscendent
      ? `<div class="cardEffectFlash" style="background: radial-gradient(circle, #ffffff55 0%, transparent 70%); animation-duration:${durationMs}ms;"></div>`
      : `<div class="cardEffectFlash" style="background: radial-gradient(circle, ${flashColor}${isEpicPlus ? Math.min(60, 40 + tierAboveEpic * 5) : "30"} 0%, transparent 70%); animation-duration:${durationMs}ms;"></div>`
    }
    ${burstHTML}
    <div class="cardRevealPanel ${shakeClass}"
         style="border-color:${panelBorderColor}; box-shadow: 0 0 ${glowSize}px ${panelBorderColor}, 0 14px 34px rgba(0,0,0,0.55); animation-duration:${durationMs}ms;">
      <div class="cardRevealGrade ${isTranscendent ? "pearlText" : ""}" style="${isTranscendent ? "" : `color:${flashColor};`} font-size:${gradeFontSize}px;">✨ ${grade.label} ✨</div>
      <div class="cardRevealName" style="font-size:${nameFontSize}px;">${playerName || ""}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), durationMs + 300);
}

// v2.1: 슬롯머신 릴 애니메이션. 왼쪽 릴부터 순서대로 멈추면서 실제 뽑힌 심볼(finalSymbols)에 착지함.
// allSymbols는 스핀 도중 랜덤하게 보여줄 아이콘 후보 목록 (연출용, 실제 결과에는 영향 없음)
function playSlotAnimation(reelEls, finalSymbols, allSymbols, onDone, speedMultiplier) {
  const speed = speedMultiplier || 1;
  reelEls.forEach(el => el.classList.add("spinning"));
  let ticks = 0;
  const totalTicks = 18; // 총 스핀 프레임 수
  const timer = setInterval(() => {
    ticks++;
    reelEls.forEach((el, i) => {
      const stopAt = totalTicks - (reelEls.length - 1 - i) * 4; // 왼쪽 릴부터 먼저 멈춤
      if (ticks < stopAt) {
        el.textContent = allSymbols[Math.floor(Math.random() * allSymbols.length)].icon;
      } else if (ticks === stopAt) {
        el.textContent = finalSymbols[i].icon;
        el.classList.remove("spinning");
        el.classList.add("locked");
        playSound("luckyMachine", "reel");
      }
    });
    if (ticks >= totalTicks) {
      clearInterval(timer);
      setTimeout(onDone, 650 / speed); // 마지막 릴이 멈춘 금색 테두리를 눈으로 확인할 시간을 줌
    }
  }, 80 / speed);
}

        <div class="luckyResultLabel" style="color:#5fd97a; font-size:24px; animation:none;">✨ 희귀 보상! ✨</div>

async function confirmDismantle(gradeId, count) {
  count = count || 1;
  if (gradeId === "TRANSCENDENT") {
    if (!(await askConfirm("이 카드는 게임 최상위 희귀도 카드입니다.\n정말 분해하시겠습니까?", "⚠️ TRANSCENDENT 카드를 분해하려고 합니다."))) return false;
    if (!(await askConfirm("TRANSCENDENT를 분해하면 복구할 수 없습니다.\n계속하시겠습니까?", "⚠️ 다시 확인합니다."))) return false;
    const result = await askInput("🚨 FINAL CONFIRMATION", [
      { id: "confirmText", label: "이 카드는 게임 내 최상위 등급인 TRANSCENDENT 카드입니다. 분해하면 어떠한 방법으로도 복구할 수 없습니다.\n계속하려면 아래에 정확히 '분해한다'를 입력하세요.", type: "text", placeholder: "분해한다" },
    ]);
    return !!result && result.confirmText === "분해한다";
  }
  if (gradeId === "UNIQUE" || gradeId === "MYSTIC" || gradeId === "LEGENDARY") {
    const grade = getGrade(gradeId);
    return await askConfirm(`${grade.label} 카드 ${count}장을 분해하시겠습니까?\n분해하면 복구할 수 없습니다.`);
  }
  return true; // COMMON~EPIC은 확인 없이 바로 분해
}

async function dismantleOne(p, card) {
  // 안전장치: 잠긴 카드나 거래소에 등록된 카드, 연구소에서 연구 중인 카드는 어떤 경로로 호출되든 절대 분해되지 않음
  if (card.locked || card.inMarket || card.inLab) {
    return { coinGain: 0, materialGain: 0, materialType: null, isSpecial: false, blocked: true };
  }
  const gr = getGrade(card.gradeId);
  const coinGain = Math.round((gr.special
    ? 50000000
    : Math.floor(gr.coin[0] + Math.random() * (gr.coin[1]-gr.coin[0]))) * getEquippedCoinMultiplier(p));
  const materialGain = Math.round(gr.materialAmt * getEquippedMaterialMultiplier(p));
  p.coins += coinGain;
  p.materialsByType[gr.materialType] = (p.materialsByType[gr.materialType] || 0) + materialGain;
  p.cards = p.cards.filter(c => c.cardId !== card.cardId);
  p.stats_dismantleCount = (p.stats_dismantleCount || 0) + 1;
  if (card.gradeId === "TRANSCENDENT") p.stats_transcendentDismantled = (p.stats_transcendentDismantled || 0) + 1;
  return { coinGain, materialGain, materialType: gr.materialType, isSpecial: gr.special };
}

// 자동분해 설정: 구단 + 등급 + 선수 조합별로 "이 카드가 나오면 즉시 자동으로 분해" 여부를 저장
function ensureAutoDismantle(p) {
  if (!p.autoDismantle) p.autoDismantle = { enabled: false, rules: {} };
  if (!p.autoDismantle.rules) p.autoDismantle.rules = {};
  return p.autoDismantle;
}
function isAutoDismantleMatch(p, reward) {
  const ad = p.autoDismantle;
  if (!ad || !ad.enabled) return false;
  const key = `${reward.teamId}_${reward.playerName}_${reward.gradeId}`;
  return !!(ad.rules && ad.rules[key]);
}

function renderAutoDismantle(content, p) {
  const ad = ensureAutoDismantle(p);
  if (!state.adCollapsed) state.adCollapsed = {};

  const gradeIdsForBulk = GRADES.map(g => g.id); // COMMON~TRANSCENDENT 전부 등급별 일괄 선택 지원

  content.innerHTML = `
    <div class="sectionTitle">♻️ 카드 자동분해 설정</div>
    <div class="sub" style="margin-bottom:10px;">터치/오토터치로 카드를 얻는 순간, 여기서 체크한 (구단·선수·등급) 조합이면 인벤토리에 쌓이지 않고 바로 분해돼서 코인/재료로 즉시 전환돼요.</div>
    <div class="row">
      <span style="font-weight:700;">자동분해 전체 사용</span>
      <button id="adMasterToggle" style="padding:6px 14px; border:none; border-radius:8px; background:${ad.enabled ? "#4caf50" : "#555"}; color:#fff; font-size:12px; font-weight:700;">${ad.enabled ? "사용중 ON" : "OFF"}</button>
    </div>
    <div class="sectionTitle" style="margin-top:16px;">등급별 일괄 선택</div>
    <div class="sub" style="margin-bottom:6px;">누르면 전체 10개 구단 모든 선수의 해당 등급이 한 번에 켜지거나 꺼져요.</div>
    <div id="adGradeBulkRow" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;"></div>
    <div class="row" style="margin-bottom:10px;">
      <span>전체 조합 일괄</span>
      <div style="display:flex; gap:6px;">
        <button id="adSelectAll" style="padding:6px 10px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;">전체선택</button>
        <button id="adDeselectAll" style="padding:6px 10px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;">전체해제</button>
      </div>
    </div>
    <div class="sectionTitle">구단별 설정</div>
    <div id="adTeamList"></div>
  `;

  function countGradeOn(gradeId) {
    let on = 0, total = 0;
    TEAMS.forEach(t => (TEAM_PLAYERS[t.id] || []).forEach(name => {
      total++;
      if (ad.rules[`${t.id}_${name}_${gradeId}`]) on++;
    }));
    return { on, total };
  }
  function setGradeAll(gradeId, value) {
    TEAMS.forEach(t => (TEAM_PLAYERS[t.id] || []).forEach(name => {
      const key = `${t.id}_${name}_${gradeId}`;
      if (value) ad.rules[key] = true; else delete ad.rules[key];
    }));
  }
  function setTeamAll(teamId, value) {
    (TEAM_PLAYERS[teamId] || []).forEach(name => {
      GRADES.forEach(g => {
        const key = `${teamId}_${name}_${g.id}`;
        if (value) ad.rules[key] = true; else delete ad.rules[key];
      });
    });
  }

  document.getElementById("adMasterToggle").onclick = async () => {
    ad.enabled = !ad.enabled;
    await saveProfile(p);
    renderAutoDismantle(content, p);
  };

  const bulkRow = document.getElementById("adGradeBulkRow");
  gradeIdsForBulk.forEach(gid => {
    const grade = getGrade(gid);
    const { on, total } = countGradeOn(gid);
    const allOn = on === total;
    const btn = document.createElement("button");
    btn.style.cssText = `padding:8px 10px; border:none; border-radius:8px; background:${allOn ? grade.color : "linear-gradient(155deg,#20202c,#131319)"}; color:${allOn ? "#000" : grade.color}; font-size:11px; font-weight:700;`;
    btn.textContent = `${grade.label} (${on}/${total})`;
    btn.onclick = async () => {
      // 희귀 등급(LEGENDARY/TRANSCENDENT)을 통째로 켜려는 경우 실수 방지용 확인
      if (!allOn && (gid === "LEGENDARY" || gid === "TRANSCENDENT")) {
        const ok = await askConfirm(`${grade.label}은 매우 희귀한 등급이에요.\n전체 구단·전체 선수의 ${grade.label} 카드를 자동분해 대상으로 설정할까요?`);
        if (!ok) return;
      }
      setGradeAll(gid, !allOn);
      await saveProfile(p);
      renderAutoDismantle(content, p);
    };
    bulkRow.appendChild(btn);
  });

  document.getElementById("adSelectAll").onclick = async () => {
    const ok = await askConfirm("모든 구단·선수·등급 조합을 자동분해 대상으로 켤까요?\n(LEGENDARY/TRANSCENDENT 포함, 나중에 개별로 끌 수 있어요)");
    if (!ok) return;
    gradeIdsForBulk.forEach(gid => setGradeAll(gid, true));
    await saveProfile(p);
    renderAutoDismantle(content, p);
  };
  document.getElementById("adDeselectAll").onclick = async () => {
    ad.rules = {};
    await saveProfile(p);
    renderAutoDismantle(content, p);
  };

  const teamList = document.getElementById("adTeamList");
  TEAMS.forEach(team => {
    const players = TEAM_PLAYERS[team.id] || [];
    const isCollapsed = !!state.adCollapsed[team.id];
    let onCount = 0;
    players.forEach(name => GRADES.forEach(g => { if (ad.rules[`${team.id}_${name}_${g.id}`]) onCount++; }));
    const totalCombos = players.length * GRADES.length;

    const section = document.createElement("div");
    section.style.marginBottom = "10px";
    section.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:linear-gradient(155deg,#20202c,#131319); border-radius:8px; border-left:4px solid ${team.color};">
        <div class="adTeamHeader" style="display:flex; gap:8px; align-items:center; cursor:pointer;">
          <span style="font-weight:800;">${team.name}</span>
          <span style="color:#999; font-size:11px;">${onCount}/${totalCombos} 설정됨 ${isCollapsed ? "▸" : "▾"}</span>
        </div>
        <div style="display:flex; gap:4px;">
          <button class="adTeamAllBtn" style="padding:5px 8px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:10px;">전체선택</button>
          <button class="adTeamNoneBtn" style="padding:5px 8px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:10px;">전체해제</button>
        </div>
      </div>
      <div class="adTeamGrid" style="display:${isCollapsed ? "none" : "block"}; margin-top:6px; overflow-x:auto;"></div>
    `;
    teamList.appendChild(section);

    const header = section.querySelector(".adTeamHeader");
    const grid = section.querySelector(".adTeamGrid");
    header.onclick = () => {
      const collapsing = grid.style.display !== "none";
      state.adCollapsed[team.id] = collapsing;
      grid.style.display = collapsing ? "none" : "block";
      const span = header.querySelector("span:last-child");
      if (span) span.textContent = `${onCount}/${totalCombos} 설정됨 ${collapsing ? "▸" : "▾"}`;
    };
    section.querySelector(".adTeamAllBtn").onclick = async (e) => {
      e.stopPropagation();
      const ok = await askConfirm(`${team.name} 소속 전체 선수의 모든 등급을 자동분해 대상으로 켤까요? (LEGENDARY/TRANSCENDENT 포함)`);
      if (!ok) return;
      setTeamAll(team.id, true);
      await saveProfile(p);
      renderAutoDismantle(content, p);
    };
    section.querySelector(".adTeamNoneBtn").onclick = async (e) => {
      e.stopPropagation();
      setTeamAll(team.id, false);
      await saveProfile(p);
      renderAutoDismantle(content, p);
    };

    if (!isCollapsed) {
      // 표 형태: 행=선수, 열=등급. 셀을 누르면 해당 조합만 토글
      let tableHtml = `<table style="width:100%; border-collapse:collapse; font-size:10px;"><thead><tr><th style="text-align:left; padding:4px; color:#999;">선수</th>`;
      GRADES.forEach(g => { tableHtml += `<th style="padding:4px; color:${g.color};">${g.label.slice(0,4)}</th>`; });
      tableHtml += `</tr></thead><tbody>`;
      players.forEach(name => {
        tableHtml += `<tr><td style="padding:4px; color:#ccc;">${name}</td>`;
        GRADES.forEach(g => {
          const key = `${team.id}_${name}_${g.id}`;
          const on = !!ad.rules[key];
          tableHtml += `<td style="text-align:center; padding:2px;"><button class="adCell" data-key="${key}" style="width:22px; height:22px; border:none; border-radius:5px; background:${on ? g.color : "#22222c"}; color:${on ? "#000" : "#555"}; font-size:11px;">${on ? "✓" : ""}</button></td>`;
        });
        tableHtml += `</tr>`;
      });
      tableHtml += `</tbody></table>`;
      grid.innerHTML = tableHtml;
      grid.querySelectorAll(".adCell").forEach(cell => {
        cell.onclick = async () => {
          const key = cell.dataset.key;
          if (ad.rules[key]) delete ad.rules[key]; else ad.rules[key] = true;
          await saveProfile(p);
          renderAutoDismantle(content, p);
        };
      });
    }
  });
}

// v2.6: 카드 탭 안에 "보유 카드"/"자동분해 설정" 서브탭을 둬서, 기존에 별도 메뉴였던 자동분해 설정을
// 여기서 바로 들어갈 수 있게 함 (메뉴 항목 수를 줄이고 카드 관련 기능을 한곳에 모음)
function renderInventory(content, p) {
  if (!state.inventorySubTab) state.inventorySubTab = "cards";
  const adReq = getFeatureLevelReq("autodismantle");
  const adLocked = !isFeatureUnlocked(p, "autodismantle");
  content.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:12px;">
      <button class="invSubTab" data-sub="cards" style="flex:1; padding:9px; border:none; border-radius:8px; background:${state.inventorySubTab === "cards" ? "linear-gradient(135deg,#e6417f,#9e0038)" : "linear-gradient(155deg,#20202c,#131319)"}; color:#fff; font-size:12px; font-weight:700;">🎴 보유 카드</button>
      <button class="invSubTab" data-sub="autodismantle" style="flex:1; padding:9px; border:none; border-radius:8px; background:${state.inventorySubTab === "autodismantle" ? "linear-gradient(135deg,#e6417f,#9e0038)" : "linear-gradient(155deg,#20202c,#131319)"}; color:#fff; font-size:12px; font-weight:700; ${adLocked ? "opacity:0.55;" : ""}">♻️ 자동분해 설정${adLocked ? ` 🔒Lv.${adReq}` : ""}</button>
    </div>
    <div id="invSubBody"></div>
  `;
  content.querySelectorAll(".invSubTab").forEach(b => {
    b.onclick = () => {
      if (b.dataset.sub === "autodismantle" && adLocked) { toast(`🔒 Lv.${adReq}부터 이용할 수 있어요.`); return; }
      state.inventorySubTab = b.dataset.sub;
      renderInventory(content, p);
    };
  });
  const body = document.getElementById("invSubBody");
  if (state.inventorySubTab === "autodismantle") {
    if (adLocked) renderLevelLocked(body, "autodismantle", "카드 자동분해 설정");
    else renderAutoDismantle(body, p);
  } else {
    renderInventoryCardsBody(body, p);
  }
}

function renderInventoryCardsBody(content, p) {
  if (p.cards.length === 0) {
    content.innerHTML = `<div class="sub" style="margin-top:30px">아직 획득한 카드가 없어요. 터치해서 카드를 모아보세요!</div>`;
    return;
  }

  // 등급별로 그룹핑 (희귀 등급이 위로 오도록 역순 정렬)
  const grouped = {};
  p.cards.forEach(card => {
    if (!grouped[card.gradeId]) grouped[card.gradeId] = [];
    grouped[card.gradeId].push(card);
  });
  const gradeOrder = GRADES.map(g => g.id).slice().reverse();

  content.innerHTML = `<div class="sectionTitle">보유 카드 (총 ${p.cards.length}장)</div><div id="gradeGroups"></div>`;
  const wrap = document.getElementById("gradeGroups");

  if (!state.invCollapsed) state.invCollapsed = {};

  gradeOrder.forEach(gradeId => {
    const cards = grouped[gradeId];
    if (!cards || cards.length === 0) return;
    const grade = getGrade(gradeId);
    const unlockedCount = cards.filter(c => !c.locked && !c.inMarket && !c.inLab).length;
    const isCollapsed = !!state.invCollapsed[gradeId];

    const section = document.createElement("div");
    section.style.marginBottom = "12px";
    section.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:linear-gradient(155deg,#20202c,#131319); border-radius:8px; border-left:4px solid ${grade.color};">
        <div class="gradeGroupHeader" style="display:flex; gap:8px; align-items:center; cursor:pointer;">
          <span style="font-weight:800; color:${grade.color}">${grade.label}</span>
          <span style="color:#999; font-size:12px;">${cards.length}장 ${isCollapsed ? "▸" : "▾"}</span>
        </div>
        ${gradeId !== "TRANSCENDENT" && unlockedCount > 0
          ? `<button class="bulkDismantleBtn" style="padding:5px 10px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:11px;">전체분해(${unlockedCount})</button>`
          : ""
        }
      </div>
      <div class="cardGrid" style="margin-top:6px; display:${isCollapsed ? "none" : "grid"};"></div>
    `;
    wrap.appendChild(section);
    const grid = section.querySelector(".cardGrid");
    const header = section.querySelector(".gradeGroupHeader");
    header.onclick = () => {
      const collapsing = grid.style.display !== "none";
      state.invCollapsed[gradeId] = collapsing;
      grid.style.display = collapsing ? "none" : "grid";
      const arrowSpan = header.querySelector("span:last-child");
      if (arrowSpan) arrowSpan.textContent = `${cards.length}장 ${collapsing ? "▸" : "▾"}`;
    };

    const bulkBtn = section.querySelector(".bulkDismantleBtn");
    if (bulkBtn) {
      bulkBtn.onclick = async (e) => {
        e.stopPropagation();
        try {
          const targets = p.cards.filter(c => c.gradeId === gradeId && !c.locked && !c.inMarket && !c.inLab);
          if (targets.length === 0) return;
          const ok = await confirmDismantle(gradeId, targets.length);
          if (!ok) { toast("분해가 취소되었습니다."); return; }
          let totalCoin = 0, totalMaterial = 0, matType = "", dismantledCount = 0;
          for (const t of targets) {
            const result = await dismantleOne(p, t);
            if (result.blocked) continue; // 잠긴 카드/거래소 등록 카드는 절대 제외
            totalCoin += result.coinGain;
            totalMaterial += result.materialGain;
            matType = result.materialType;
            dismantledCount++;
          }
          await saveProfile(p);
          if (dismantledCount > 0) bumpMission(p, "dismantle", dismantledCount);
          toast(`${dismantledCount}장 전체분해: +${totalCoin.toLocaleString()} 코인, +${totalMaterial.toLocaleString()} ${MATERIAL_LABELS[matType] || "재료"}`);
          renderInventoryCardsBody(content, p);
        } catch (err) {
          toast("전체분해 중 오류가 발생했어요: " + (err && err.message ? err.message : err));
        }
      };
    }

    const sortedCards = cards.slice().reverse();
    const PAGE_SIZE = 60;

    function renderCardEl(card) {
      const el = document.createElement("div");
      el.className = "cardItem";
      el.style.borderColor = grade.color;
      el.innerHTML = `
        <div class="grade" style="color:${grade.color}">${grade.label}</div>
        <div class="name">${card.teamName || ""} ${card.playerName}</div>
        <div style="color:#888; font-size:10px; margin-top:2px;">OVR ${card.ovr ?? "-"}</div>
        ${card.locked ? '<div class="lockedTag">🔒 LOCK</div>' : ''}
        ${card.inMarket ? '<div class="lockedTag" style="color:#4caf50;">💱 거래소 등록중</div>' : ''}
        ${card.inLab ? '<div class="lockedTag" style="color:#8e24aa;">🧪 연구중</div>' : ''}
        <div style="display:flex; gap:4px; margin-top:6px;">
          ${card.inMarket
            ? `<button class="marketInfoBtn" style="flex:1; padding:6px; border:none; border-radius:6px; background:#2a2a35; color:#fff; font-size:10px;">거래소에서 관리</button>`
            : card.inLab
            ? `<button class="labInfoBtn" style="flex:1; padding:6px; border:none; border-radius:6px; background:#2a2a35; color:#fff; font-size:10px;">연구소에서 관리</button>`
            : `
              <button class="lockBtn" style="flex:1; padding:6px; border:none; border-radius:6px; background:#2a2a35; color:#fff; font-size:10px;">${card.locked ? "잠금해제" : "잠금"}</button>
              ${!card.locked ? `<button class="dismantleBtn" style="flex:1; padding:6px; border:none; border-radius:6px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:10px;">분해</button>` : ""}
            `
          }
        </div>
      `;

      const marketInfoBtn = el.querySelector(".marketInfoBtn");
      if (marketInfoBtn) marketInfoBtn.onclick = () => { state.tab = "exchange"; state.exchangeSubTab = "mine"; render(); };

      const labInfoBtn = el.querySelector(".labInfoBtn");
      if (labInfoBtn) labInfoBtn.onclick = () => { state.tab = "cardLab"; render(); };

      const lockBtn = el.querySelector(".lockBtn");
      if (lockBtn) lockBtn.onclick = async () => {
        card.locked = !card.locked;
        await saveProfile(p);
        renderInventoryCardsBody(content, p);
      };

      const dismantleBtn = el.querySelector(".dismantleBtn");
      if (dismantleBtn) {
        dismantleBtn.onclick = async () => {
          try {
            const ok = await confirmDismantle(card.gradeId, 1);
            if (!ok) { toast("분해가 취소되었습니다."); return; }
            const result = await dismantleOne(p, card);
            if (result.blocked) { toast("잠긴 카드는 분해할 수 없어요. 먼저 잠금을 해제해주세요."); return; }
            bumpMission(p, "dismantle", 1);
            await saveProfile(p);
            toast(`분해 완료: +${result.coinGain.toLocaleString()} 코인, +${result.materialGain.toLocaleString()} ${MATERIAL_LABELS[result.materialType] || "재료"}`);
            if (result.isSpecial) toast("🐉 DRAGON SCALE 획득!");
            renderInventoryCardsBody(content, p);
          } catch (err) {
            toast("분해 중 오류가 발생했어요: " + (err && err.message ? err.message : err));
          }
        };
      }
      return el;
    }

    let shown = 0;
    const moreBtnWrap = document.createElement("div");
    function renderNextPage() {
      const slice = sortedCards.slice(shown, shown + PAGE_SIZE);
      const frag = document.createDocumentFragment();
      slice.forEach(card => frag.appendChild(renderCardEl(card)));
      grid.insertBefore(frag, moreBtnWrap);
      shown += slice.length;
      moreBtnWrap.innerHTML = "";
      if (shown < sortedCards.length) {
        const moreBtn = document.createElement("button");
        moreBtn.textContent = `더보기 (${(sortedCards.length - shown).toLocaleString()}장 남음)`;
        moreBtn.style.cssText = "grid-column: 1 / -1; padding:10px; border:none; border-radius:8px; background:linear-gradient(155deg,#20202c,#131319); color:#999; font-size:12px; margin-top:6px;";
        moreBtn.onclick = renderNextPage;
        moreBtnWrap.appendChild(moreBtn);
      }
    }
    grid.appendChild(moreBtnWrap);
    renderNextPage();
  });
}

// 거래소 "카드 등록" 피커: 판매 가능한 카드를 (구단+선수+등급) 단위로 묶어 보여주고,
// 가격과 개수를 입력받아 그만큼의 실제 카드 인스턴스를 한번에 매물로 등록한다.
function renderExchangeRegisterPicker(body, p, content) {
  const backBtn = document.createElement("button");
  backBtn.textContent = "← 목록으로";
  backBtn.style.cssText = "background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:12px;";
  backBtn.onclick = () => { state.exchangeRegisterMode = false; renderExchange(content, p); };
  body.appendChild(backBtn);

  const eligible = p.cards.filter(c => !c.locked && !c.inMarket && !c.inLab);
  if (eligible.length === 0) {
    body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-top:10px;">등록 가능한 카드가 없어요. (잠긴 카드/이미 등록된 카드/연구 중인 카드 제외)</div>`);
    return;
  }

  // (구단+선수+등급) 단위로 그룹핑
  const groups = {};
  eligible.forEach(c => {
    const key = `${c.teamId}_${c.playerName}_${c.gradeId}`;
    if (!groups[key]) groups[key] = { teamId: c.teamId, teamName: c.teamName, playerName: c.playerName, gradeId: c.gradeId, ovr: c.ovr, cards: [] };
    groups[key].cards.push(c);
  });

  body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-bottom:8px;">등록할 카드를 선택하세요</div>`);
  Object.values(groups).forEach(g => {
    const grade = getGrade(g.gradeId);
    const row = document.createElement("div");
    row.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:10px; padding:12px; margin-bottom:8px; border-left:3px solid ${grade.color}; cursor:pointer;`;
    row.innerHTML = `
      <div style="color:${grade.color}; font-weight:800; font-size:12px;">${grade.label}</div>
      <div style="font-size:13px;">${g.teamName} ${g.playerName} · OVR ${g.ovr}</div>
      <div style="color:#999; font-size:11px; margin-top:2px;">보유 ${g.cards.length}장</div>
    `;
    row.onclick = async () => {
      const fields = [{ id: "price", label: "1장당 판매 가격 (코인)", type: "number", placeholder: "예: 10000" }];
      if (g.cards.length > 1) {
        fields.unshift({ id: "qty", label: `수량 (보유 ${g.cards.length}장)`, type: "number", defaultValue: "1" });
      }
      const result = await askInput(`${g.teamName} ${g.playerName} (${grade.label})`, fields);
      if (!result) { toast("등록이 취소됐어요."); return; }

      const qty = g.cards.length > 1 ? parseInt(result.qty, 10) : 1;
      if (isNaN(qty) || qty <= 0 || qty > g.cards.length) { toast("개수가 올바르지 않아요."); return; }
      const price = parseInt(result.price, 10);
      if (isNaN(price) || price <= 0) { toast("가격이 올바르지 않아요."); return; }

      const fee = Math.floor(price * LISTING_FEE_RATE);
      const completionFee = Math.floor(price * COMPLETION_FEE_RATE);
      const netEstimate = price - fee - completionFee;
      const totalNet = netEstimate * qty;
      const ok = await askConfirm(
        `1장당 판매가격: ${price.toLocaleString()} 코인 × ${qty}장\n등록 수수료(2%) + 거래완료 수수료(3%) 차감\n1장당 예상 실수령액: ${netEstimate.toLocaleString()} 코인\n총 예상 실수령액: ${totalNet.toLocaleString()} 코인`,
        "거래소에 등록하시겠어요?"
      );
      if (!ok) return;

      for (let i = 0; i < qty; i++) {
        await listMarketCard(p, g.cards[i], price);
      }
      bumpMission(p, "exchangeUse", 1);
      await saveProfile(p);
      toast(`${qty}장을 거래소에 등록했어요.`);
      state.exchangeRegisterMode = false;
      renderExchange(content, p);
    };
    body.appendChild(row);
  });
}

// 거래소 "재료 등록" 피커: 보유 재료 종류를 보여주고 수량+가격을 입력받아 등록
function renderExchangeRegisterMaterialPicker(body, p, content) {
  const backBtn = document.createElement("button");
  backBtn.textContent = "← 목록으로";
  backBtn.style.cssText = "background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:12px;";
  backBtn.onclick = () => { state.exchangeRegisterMode = false; renderExchange(content, p); };
  body.appendChild(backBtn);

  const owned = Object.keys(MATERIAL_LABELS).filter(k => (p.materialsByType[k] || 0) > 0);
  if (owned.length === 0) {
    body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-top:10px;">등록할 재료가 없어요.</div>`);
    return;
  }

  body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-bottom:8px;">등록할 재료를 선택하세요</div>`);
  owned.forEach(materialType => {
    const have = p.materialsByType[materialType];
    const grade = GRADES.find(g => g.materialType === materialType);
    const color = grade ? grade.color : "#4a8fb5";
    const row = document.createElement("div");
    row.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:10px; padding:12px; margin-bottom:8px; border-left:3px solid ${color}; cursor:pointer;`;
    row.innerHTML = `
      <div style="color:${color}; font-weight:800; font-size:13px;">${MATERIAL_LABELS[materialType]}</div>
      <div style="color:#999; font-size:11px; margin-top:2px;">보유 ${have.toLocaleString()}개</div>
    `;
    row.onclick = async () => {
      const result = await askInput(MATERIAL_LABELS[materialType], [
        { id: "amount", label: `수량 (보유 ${have.toLocaleString()}개)`, type: "number", defaultValue: "1" },
        { id: "unitPrice", label: "개당 판매 가격 (코인)", type: "number", placeholder: "예: 100" },
      ]);
      if (!result) { toast("등록이 취소됐어요."); return; }
      const amount = parseInt(result.amount, 10);
      if (isNaN(amount) || amount <= 0 || amount > have) { toast("수량이 올바르지 않아요."); return; }
      const unitPrice = parseInt(result.unitPrice, 10);
      if (isNaN(unitPrice) || unitPrice <= 0) { toast("가격이 올바르지 않아요."); return; }
      const price = unitPrice * amount;

      const fee = Math.floor(price * LISTING_FEE_RATE);
      const completionFee = Math.floor(price * COMPLETION_FEE_RATE);
      const netEstimate = price - fee - completionFee;
      const ok = await askConfirm(
        `${MATERIAL_LABELS[materialType]} ×${amount}\n개당 가격: ${unitPrice.toLocaleString()} 코인\n총 판매가격: ${price.toLocaleString()} 코인\n등록 수수료(2%) + 거래완료 수수료(3%) 차감\n예상 실수령액: ${netEstimate.toLocaleString()} 코인`,
        "거래소에 등록하시겠어요?"
      );
      if (!ok) return;

      const listResult = await listMarketMaterial(p, materialType, amount, unitPrice);
      if (!listResult.ok) { toast(listResult.reason); return; }
      bumpMission(p, "exchangeUse", 1);
      await saveProfile(p);
      toast(`${MATERIAL_LABELS[materialType]} ×${amount} 거래소에 등록했어요.`);
      state.exchangeRegisterMode = false;
      renderExchange(content, p);
    };
    body.appendChild(row);
  });
}

// v2.36: 거래소 "기타 등록" 피커 - 티켓 / 알약 / 거래가능(tradeable) 부스트만 등록 가능

  backBtn.style.cssText = "background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:12px;";
  backBtn.onclick = () => { state.exchangeRegisterMode = false; renderExchange(content, p); };
  body.appendChild(backBtn);

  ensureManagerTickets(p);
  const items = [];
  if ((p.managerTickets || 0) > 0) items.push({ miscKind: "ticket", name: "🎟️ 티켓", color: "#e5a02f", have: p.managerTickets });
  if ((p.pill || 0) > 0) items.push({ miscKind: "pill", name: "💊 알약", color: "#4caf50", have: p.pill });
  Object.keys(p.boostInventory || {}).forEach(id => {
    const tradeable = getTradeableBoostCount(p, id);
    if (tradeable > 0) {
      const def = ALL_BOOST_DEFS.find(b => b.id === id);
      items.push({ miscKind: id, name: `⚡ ${def ? def.name : id}`, color: "#9c27b0", have: tradeable });

    return;
  }

  body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-bottom:8px;">등록할 품목을 선택하세요</div>`);
  items.forEach(item => {
    const row = document.createElement("div");
    row.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:10px; padding:12px; margin-bottom:8px; border-left:3px solid ${item.color}; cursor:pointer;`;
    row.innerHTML = `
      <div style="color:${item.color}; font-weight:800; font-size:13px;">${item.name}</div>
      <div style="color:#999; font-size:11px; margin-top:2px;">보유(거래가능) ${item.have.toLocaleString()}개</div>
    `;
    row.onclick = async () => {
      const result = await askInput(item.name, [
        { id: "amount", label: `수량 (보유 ${item.have.toLocaleString()}개)`, type: "number", defaultValue: "1" },
        { id: "unitPrice", label: "개당 판매 가격 (코인)", type: "number", placeholder: "예: 1000" },
      ]);
      if (!result) { toast("등록이 취소됐어요."); return; }
      const amount = parseInt(result.amount, 10);
      if (isNaN(amount) || amount <= 0 || amount > item.have) { toast("수량이 올바르지 않아요."); return; }
      const unitPrice = parseInt(result.unitPrice, 10);
      if (isNaN(unitPrice) || unitPrice <= 0) { toast("가격이 올바르지 않아요."); return; }
      const price = unitPrice * amount;

      const fee = Math.floor(price * LISTING_FEE_RATE);
      const completionFee = Math.floor(price * COMPLETION_FEE_RATE);
      const netEstimate = price - fee - completionFee;
      const ok = await askConfirm(
        `${item.name} ×${amount}\n개당 가격: ${unitPrice.toLocaleString()} 코인\n총 판매가격: ${price.toLocaleString()} 코인\n등록 수수료(2%) + 거래완료 수수료(3%) 차감\n예상 실수령액: ${netEstimate.toLocaleString()} 코인`,
        "거래소에 등록하시겠어요?"
      );
      if (!ok) return;

      const listResult = await listMarketMisc(p, item.miscKind, amount, unitPrice);
      if (!listResult.ok) { toast(listResult.reason); return; }
      bumpMission(p, "exchangeUse", 1);
      await saveProfile(p);
      toast(`${item.name} ×${amount} 거래소에 등록했어요.`);
      state.exchangeRegisterMode = false;
      renderExchange(content, p);
    };
    body.appendChild(row);
  });
}

async function renderExchange(content, p) {
  if (!state.exchangeSubTab) state.exchangeSubTab = "all";
  if (!state.exFilters) state.exFilters = { itemType: "card", teamId: "all", gradeId: "all", materialType: "all", sort: "recent", keyword: "" };
  ensureMarketListener(content, p);
  claimPendingMarketPayouts(p); // 화면 열 때마다 혹시 밀린 판매 수익이 있으면 자동으로 입금

  content.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:12px;">
      <button class="exSubTab" data-sub="all" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.exchangeSubTab==='all'?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:12px;">전체매물</button>
      <button class="exSubTab" data-sub="mine" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.exchangeSubTab==='mine'?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:12px;">내 판매목록</button>
      <button class="exSubTab" data-sub="history" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.exchangeSubTab==='history'?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:12px;">거래내역</button>
    </div>
    <div id="exBody"></div>
  `;
  content.querySelectorAll(".exSubTab").forEach(b => {
    b.onclick = () => { state.exchangeSubTab = b.dataset.sub; state.exchangeRegisterMode = false; renderExchange(content, p); };
  });

  const body = document.getElementById("exBody");

  if (state.exchangeSubTab === "history") {
    const allTx = await _readTransactions();
    const myUid = getMyMarketUid(p);
    const mine = allTx.filter(t => t.buyerId === myUid || t.sellerId === myUid).sort((a,b) => b.timestamp - a.timestamp);
    if (mine.length === 0) { body.innerHTML = `<div class="sub" style="margin-top:20px;">거래 내역이 없어요.</div>`; return; }
    mine.forEach(t => {
      const isBuy = t.buyerId === myUid;
      const row = document.createElement("div");
      row.className = "row";
      if (t.type === "material") {
        row.innerHTML = `<span>${isBuy ? "🛒 구매" : "💰 판매"} · ${MATERIAL_LABELS[t.materialType] || t.materialType} ×${t.amount}</span><span>${t.price.toLocaleString()} 코인</span>`;
      } else if (t.type === "misc") {
        const label = t.miscKind === "ticket" ? "🎟️ 티켓" : t.miscKind === "pill" ? "💊 알약" : "⚡ 부스트";
        row.innerHTML = `<span>${isBuy ? "🛒 구매" : "💰 판매"} · ${label} ×${t.amount}</span><span>${t.price.toLocaleString()} 코인</span>`;
      } else {
        const grade = getGrade(t.gradeId);
        row.innerHTML = `<span>${isBuy ? "🛒 구매" : "💰 판매"} · <span style="color:${grade.color}">${grade.label}</span> ${t.teamName} ${t.playerName}</span><span>${t.price.toLocaleString()} 코인</span>`;
      }
      body.appendChild(row);
    });
    return;
  }

  if (state.exchangeSubTab === "mine") {
    if (state.exchangeRegisterMode === "card") { renderExchangeRegisterPicker(body, p, content); return; }
    if (state.exchangeRegisterMode === "material") { renderExchangeRegisterMaterialPicker(body, p, content); return; }
    if (state.exchangeRegisterMode === "misc") { renderExchangeRegisterMiscPicker(body, p, content); return; }

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex; gap:8px; margin-bottom:10px;";
    btnRow.innerHTML = `
      <button id="regCardBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:#1e5c3a; color:#fff; font-weight:700; font-size:13px;">+ 카드 등록</button>
      <button id="regMatBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:#1e4a5c; color:#fff; font-weight:700; font-size:13px;">+ 재료 등록</button>
      <button id="regMiscBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:#5c1e4a; color:#fff; font-weight:700; font-size:13px;">+ 기타 등록</button>
    `;
    body.appendChild(btnRow);
    document.getElementById("regCardBtn").onclick = () => { state.exchangeRegisterMode = "card"; renderExchange(content, p); };
    document.getElementById("regMatBtn").onclick = () => { state.exchangeRegisterMode = "material"; renderExchange(content, p); };
    document.getElementById("regMiscBtn").onclick = () => { state.exchangeRegisterMode = "misc"; renderExchange(content, p); };

    const mine = (state.marketListingsCache || []).filter(l => l.sellerId === getMyMarketUid(p)).sort((a,b) => b.listedAt - a.listedAt);
    if (mine.length === 0) { body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-top:10px;">등록한 매물이 없어요. 위 버튼으로 판매를 시작해보세요.</div>`); return; }
    mine.forEach(l => {
      const isMaterial = l.type === "material";
      const isMisc = l.type === "misc";
      const grade = (isMaterial || isMisc) ? null : getGrade(l.gradeId);
      const miscInfo = isMisc ? getMiscListingLabel(l) : null;
      const card = document.createElement("div");
      card.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:10px; padding:12px; margin-bottom:8px; border-left:3px solid ${isMaterial ? "#4a8fb5" : isMisc ? miscInfo.color : grade.color};`;
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between;">
          <div>
            ${isMaterial
              ? `<div style="color:#4a8fb5; font-weight:800; font-size:12px;">재료</div>
                 <div style="font-size:13px;">${MATERIAL_LABELS[l.materialType]} ×${l.amount}</div>`
              : isMisc
              ? `<div style="color:${miscInfo.color}; font-weight:800; font-size:12px;">기타</div>
                 <div style="font-size:13px;">${miscInfo.name} ×${l.amount}</div>`
              : `<div style="color:${grade.color}; font-weight:800; font-size:12px;">${grade.label}</div>
                 <div style="font-size:13px;">${l.teamName} ${l.playerName} · OVR ${l.ovr}</div>`
            }
            <div style="color:#999; font-size:11px; margin-top:2px;">${l.status === "sold" ? "✅ 판매완료" : "남은수량: " + l.amount.toLocaleString() + " · 개당 " + l.unitPrice.toLocaleString() + " 코인"}</div>
          </div>
          ${l.status === "active" ? `<button class="cancelListBtn" style="padding:6px 10px; border:none; border-radius:6px; background:#8b1a1a; color:#fff; font-size:11px; height:fit-content;">취소</button>` : ""}
        </div>
      `;
      body.appendChild(card);
      const cancelBtn = card.querySelector(".cancelListBtn");
      if (cancelBtn) cancelBtn.onclick = async () => {
        if (!(await askConfirm("판매 등록을 취소할까요? 다시 인벤토리로 돌아가요."))) return;
        await cancelMarketListing(p, l.listingId);
        toast("판매 등록을 취소했어요.");
        renderExchange(content, p);
      };
    });
    return;
  }

  // 전체매물
  function getMiscListingLabel(l) {
    if (l.miscKind === "ticket") return { name: "🎟️ 티켓", color: "#e5a02f" };
    if (l.miscKind === "pill") return { name: "💊 알약", color: "#4caf50" };
    const boostDef = ALL_BOOST_DEFS.find(b => b.id === l.miscKind);
    return { name: boostDef ? `⚡ ${boostDef.name}` : "기타 아이템", color: "#9c27b0" };
  }
  body.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <button class="exTypeToggle" data-type="card" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.exFilters.itemType==='card'?'#fff':'linear-gradient(155deg,#20202c,#131319)'}; color:${state.exFilters.itemType==='card'?'#000':'#ccc'}; font-size:12px;">🎴 카드</button>
      <button class="exTypeToggle" data-type="material" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.exFilters.itemType==='material'?'#fff':'linear-gradient(155deg,#20202c,#131319)'}; color:${state.exFilters.itemType==='material'?'#000':'#ccc'}; font-size:12px;">🔨 재료</button>
      <button class="exTypeToggle" data-type="misc" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.exFilters.itemType==='misc'?'#fff':'linear-gradient(155deg,#20202c,#131319)'}; color:${state.exFilters.itemType==='misc'?'#000':'#ccc'}; font-size:12px;">🎁 기타</button>
    </div>
    <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px;">
      ${state.exFilters.itemType === "card" ? `
        <select id="exTeamFilter" style="background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:6px; padding:6px; font-size:11px;">
          <option value="all">전체구단</option>
          ${TEAMS.map(t => `<option value="${t.id}" ${state.exFilters.teamId===t.id?"selected":""}>${t.name}</option>`).join("")}
        </select>
        <select id="exGradeFilter" style="background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:6px; padding:6px; font-size:11px;">
          <option value="all">전체등급</option>
          ${GRADES.map(g => `<option value="${g.id}" ${state.exFilters.gradeId===g.id?"selected":""}>${g.label}</option>`).join("")}
        </select>
      ` : state.exFilters.itemType === "material" ? `
        <select id="exMaterialFilter" style="background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:6px; padding:6px; font-size:11px;">
          <option value="all">전체재료</option>
          ${Object.keys(MATERIAL_LABELS).map(k => `<option value="${k}" ${state.exFilters.materialType===k?"selected":""}>${MATERIAL_LABELS[k]}</option>`).join("")}
        </select>
      ` : ``}
      <select id="exSort" style="background:linear-gradient(155deg,#20202c,#131319); color:#fff; border:none; border-radius:6px; padding:6px; font-size:11px;">
        <option value="recent" ${state.exFilters.sort==="recent"?"selected":""}>최신 등록순</option>
        <option value="priceAsc" ${state.exFilters.sort==="priceAsc"?"selected":""}>가격 낮은순</option>
        <option value="priceDesc" ${state.exFilters.sort==="priceDesc"?"selected":""}>가격 높은순</option>
        ${state.exFilters.itemType === "card" ? `<option value="ovrDesc" ${state.exFilters.sort==="ovrDesc"?"selected":""}>OVR 높은순</option>` : ""}
      </select>
    </div>
    ${state.exFilters.itemType === "card" ? `<input id="exSearch" placeholder="선수명/구단 검색" value="${state.exFilters.keyword}" style="width:100%; padding:8px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; margin-bottom:10px; font-size:13px;" />` : ""}
    <div id="exListings"></div>
  `;
  content.querySelectorAll(".exTypeToggle").forEach(b => {
    b.onclick = () => { state.exFilters.itemType = b.dataset.type; renderExchange(content, p); };
  });
  const teamFilterEl = document.getElementById("exTeamFilter");
  if (teamFilterEl) teamFilterEl.onchange = (e) => { state.exFilters.teamId = e.target.value; renderExchange(content, p); };
  const gradeFilterEl = document.getElementById("exGradeFilter");
  if (gradeFilterEl) gradeFilterEl.onchange = (e) => { state.exFilters.gradeId = e.target.value; renderExchange(content, p); };
  const matFilterEl = document.getElementById("exMaterialFilter");
  if (matFilterEl) matFilterEl.onchange = (e) => { state.exFilters.materialType = e.target.value; renderExchange(content, p); };
  document.getElementById("exSort").onchange = (e) => { state.exFilters.sort = e.target.value; renderExchange(content, p); };
  const searchEl = document.getElementById("exSearch");
  if (searchEl) searchEl.oninput = (e) => { state.exFilters.keyword = e.target.value; renderExchange(content, p); };

  const listings = await getMarketListings(state.exFilters);
  const listingsWrap = document.getElementById("exListings");
  if (listings.length === 0) { listingsWrap.innerHTML = `<div class="sub" style="margin-top:20px;">조건에 맞는 매물이 없어요.</div>`; return; }

  if (state.exFilters.itemType === "material") {
    for (const l of listings) {
      const isMine = l.sellerId === getMyMarketUid(p);
      const priceInfo = await getAverageMaterialUnitPrice(l.materialType);
      const unitPrice = l.unitPrice;
      const totalPrice = unitPrice * l.amount;
      const card = document.createElement("div");
      card.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:12px; padding:14px; margin-bottom:10px; border:2px solid #4a8fb5;`;
      card.innerHTML = `
        <div style="color:#4a8fb5; font-weight:800; font-size:13px;">🔨 재료</div>
        <div style="font-size:15px; font-weight:700; margin-top:2px;">${MATERIAL_LABELS[l.materialType]} × ${l.amount.toLocaleString()} 남음</div>
        <div style="font-size:18px; font-weight:800; margin-top:8px;">${totalPrice.toLocaleString()} COIN <span style="font-size:11px; color:#999; font-weight:400;">(개당 ${unitPrice.toLocaleString()})</span></div>
        <div style="color:#999; font-size:11px; margin-top:2px;">
          ${priceInfo.avg != null
            ? `개당 평균가 ${priceInfo.avg.toLocaleString()} (최근 ${priceInfo.count}회 거래)`
            : `거래 데이터 부족 (${priceInfo.count}/10회) · 10회 이상 거래 시 평균가 표시`}
        </div>
        ${isMine
          ? `<div style="margin-top:10px; text-align:center; color:#777; font-size:12px;">내 매물</div>`
          : `<div style="display:flex; gap:6px; margin-top:10px; align-items:center;">
              <input type="number" class="buyQtyInput" min="1" max="${l.amount}" value="${l.amount}" style="width:70px; box-sizing:border-box; padding:8px; border-radius:8px; border:none; background:#0B0B12; color:#fff; font-size:12px;">
              <button class="buyMatBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:#4a8fb5; color:#000; font-weight:800;">구매</button>
            </div>`
        }
      `;
      listingsWrap.appendChild(card);

      const buyBtn = card.querySelector(".buyMatBtn");
      const qtyInput = card.querySelector(".buyQtyInput");
      if (buyBtn) buyBtn.onclick = async () => {
        const qty = Math.max(1, Math.min(l.amount, parseInt(qtyInput.value, 10) || 1));
        const cost = unitPrice * qty;
        let msg = `${MATERIAL_LABELS[l.materialType]} × ${qty.toLocaleString()}\n가격: ${cost.toLocaleString()} COIN (개당 ${unitPrice.toLocaleString()})`;
        if (priceInfo.avg != null) msg += `\n개당 평균 거래가: ${priceInfo.avg.toLocaleString()} COIN`;
        const ok = await askConfirm(msg, "구매하시겠습니까?");
        if (!ok) return;
        if (priceInfo.avg != null && unitPrice >= priceInfo.avg * 3) {
          const ratio = (unitPrice / priceInfo.avg).toFixed(1);
          const ok2 = await askConfirm(`개당 평균 거래가격보다 ${ratio}배 높은 가격입니다.\n정말 구매하시겠습니까?`, "⚠️ 가격 확인");
          if (!ok2) return;
        }
        const result = await buyMarketItem(p, l.listingId, qty);
        if (!result.ok) { toast(result.reason); return; }
        bumpMission(p, "exchangeUse", 1);
        toast(`구매 완료! ${MATERIAL_LABELS[l.materialType]} ×${result.buyQty} 획득`);
        renderExchange(content, p);
      };
    }
    return;
  }

  if (state.exFilters.itemType === "misc") {
    // v2.37: 티켓/알약/부스트를 섞어서 한 줄로 보여주지 않고, 카테고리별로 구역을 나눠서 보여줌
    const categories = [
      { key: "ticket", label: "🎟️ 티켓" },
      { key: "pill", label: "💊 알약" },
      { key: "boost", label: "⚡ 부스트" },
    ];
    const getCategoryKey = (l) => (l.miscKind === "ticket" ? "ticket" : l.miscKind === "pill" ? "pill" : "boost");

    categories.forEach(cat => {
      const catListings = listings.filter(l => getCategoryKey(l) === cat.key);
      if (catListings.length === 0) return;
      const header = document.createElement("div");
      header.className = "sectionTitle";
      header.style.marginTop = "10px";
      header.textContent = `${cat.label} (${catListings.length})`;
      listingsWrap.appendChild(header);

      catListings.forEach(l => {
        const isMine = l.sellerId === getMyMarketUid(p);
        const info = getMiscListingLabel(l);
        const unitPrice = l.unitPrice;
        const totalPrice = unitPrice * l.amount;
        const card = document.createElement("div");
        card.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:12px; padding:14px; margin-bottom:10px; border:2px solid ${info.color};`;
        card.innerHTML = `
          <div style="font-size:15px; font-weight:700;">${info.name} × ${l.amount.toLocaleString()} 남음</div>
          <div style="font-size:18px; font-weight:800; margin-top:8px;">${totalPrice.toLocaleString()} COIN <span style="font-size:11px; color:#999; font-weight:400;">(개당 ${unitPrice.toLocaleString()})</span></div>
          ${isMine
            ? `<div style="margin-top:10px; text-align:center; color:#777; font-size:12px;">내 매물</div>`
            : `<div style="display:flex; gap:6px; margin-top:10px; align-items:center;">
                <input type="number" class="buyQtyInput" min="1" max="${l.amount}" value="${l.amount}" style="width:70px; box-sizing:border-box; padding:8px; border-radius:8px; border:none; background:#0B0B12; color:#fff; font-size:12px;">
                <button class="buyMiscBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:${info.color}; color:#fff; font-weight:800;">구매</button>
              </div>`
          }
        `;
        listingsWrap.appendChild(card);

        const buyBtn = card.querySelector(".buyMiscBtn");
        const qtyInput = card.querySelector(".buyQtyInput");
        if (buyBtn) buyBtn.onclick = async () => {
          const qty = Math.max(1, Math.min(l.amount, parseInt(qtyInput.value, 10) || 1));
          const cost = unitPrice * qty;
          const ok = await askConfirm(`${info.name} × ${qty.toLocaleString()}\n가격: ${cost.toLocaleString()} COIN (개당 ${unitPrice.toLocaleString()})`, "구매하시겠습니까?");
          if (!ok) return;
          const result = await buyMarketItem(p, l.listingId, qty);
          if (!result.ok) { toast(result.reason); return; }
          bumpMission(p, "exchangeUse", 1);
          toast(`구매 완료! ${info.name} ×${result.buyQty} 획득`);
          renderExchange(content, p);
        };
      });
    });
    if (listings.length === 0) {
      listingsWrap.innerHTML = `<div class="sub" style="margin-top:20px;">등록된 매물이 없어요.</div>`;
    }
    return;
  }

  for (const l of listings) {
    const grade = getGrade(l.gradeId);
    const priceInfo = await getAveragePrice(l.teamId, l.playerName, l.gradeId);
    const isMine = l.sellerId === getMyMarketUid(p);
    const isTranscendent = l.gradeId === "TRANSCENDENT";

    const card = document.createElement("div");
    card.style.cssText = `background:linear-gradient(155deg,#20202c,#131319); border-radius:12px; padding:14px; margin-bottom:10px; border:2px solid ${isTranscendent ? "#f3e9ff" : grade.color};`;
    card.innerHTML = `
      <div style="color:${grade.color}; font-weight:800; font-size:13px;">${isTranscendent ? "⚡ " : ""}${grade.label}</div>
      <div style="font-size:15px; font-weight:700; margin-top:2px;">${l.teamName}</div>
      <div style="font-size:14px; color:#ccc;">${l.playerName} · OVR ${l.ovr}</div>
      <div style="font-size:18px; font-weight:800; margin-top:8px;">${l.unitPrice.toLocaleString()} COIN</div>
      <div style="color:#999; font-size:11px; margin-top:2px;">
        ${priceInfo.avg != null
          ? `평균가 ${priceInfo.avg.toLocaleString()} (최근 ${priceInfo.count}회 거래)`
          : `거래 데이터 부족 (${priceInfo.count}/10회) · 10회 이상 거래 시 평균가 표시`}
      </div>
      ${isMine
        ? `<div style="margin-top:10px; text-align:center; color:#777; font-size:12px;">내 매물</div>`
        : `<button class="buyBtn" style="width:100%; margin-top:10px; padding:10px; border:none; border-radius:8px; background:${grade.color}; color:#000; font-weight:800;">구매</button>`
      }
    `;
    listingsWrap.appendChild(card);

    const buyBtn = card.querySelector(".buyBtn");
    if (buyBtn) buyBtn.onclick = async () => {
      let msg = `${grade.label} · OVR ${l.ovr}\n\n가격: ${l.unitPrice.toLocaleString()} COIN`;
      if (priceInfo.avg != null) msg += `\n평균 거래가: ${priceInfo.avg.toLocaleString()} COIN`;
      const ok = await askConfirm(msg, `${l.teamName} ${l.playerName} 구매하시겠습니까?`);
      if (!ok) return;

      if (priceInfo.avg != null && l.unitPrice >= priceInfo.avg * 3) {
        const ratio = (l.unitPrice / priceInfo.avg).toFixed(1);
        const ok2 = await askConfirm(`평균 거래가격보다 ${ratio}배 높은 가격입니다.\n정말 구매하시겠습니까?`, "⚠️ 가격 확인");
        if (!ok2) return;
      }

      const result = await buyMarketItem(p, l.listingId, 1);
      if (!result.ok) { toast(result.reason); return; }
      bumpMission(p, "exchangeUse", 1);
      toast(`구매 완료! ${l.teamName} ${l.playerName} (${grade.label}) 획득`);
      renderExchange(content, p);
    };
  }
}

function renderCrafting(content, p) {
  if (!state.craftQty) state.craftQty = {};
  content.innerHTML = `
    <div class="sub" style="margin-bottom:12px;">재료+코인을 소모해 지정한 등급의 카드를 시도해요. 실패해도 재료는 소모돼요. TRANSCENDENT는 제작으로 만들 수 없어요 (순수 확률로만 획득 가능).</div>
    <div id="craftList"></div>
  `;
  const list = document.getElementById("craftList");
  CRAFTING_RECIPES.forEach(r => {
    const grade = getGrade(r.gradeId);
    const haveMat = (p.materialsByType && p.materialsByType[r.materialType]) || 0;
    const maxQty = maxCraftableCount(p, r.id);
    if (!state.craftQty[r.id] || state.craftQty[r.id] > Math.max(1, maxQty)) {
      state.craftQty[r.id] = Math.max(1, Math.min(state.craftQty[r.id] || 1, maxQty || 1));
    }
    const qty = maxQty === 0 ? 0 : Math.min(state.craftQty[r.id], maxQty);

    const card = document.createElement("div");
    card.className = "boostCard";
    card.style.borderLeft = `3px solid ${grade.color}`;
    card.innerHTML = `
      <div class="name" style="color:${grade.color};">${grade.label} 제작</div>
      <div class="desc">1회당 ${MATERIAL_LABELS[r.materialType]} ${r.materialAmt}개 (보유 ${haveMat.toLocaleString()}) + ${r.coin.toLocaleString()} 코인</div>
      <div class="desc">성공확률 ${Math.round(r.successRate*100)}%</div>
      ${maxQty > 0 ? `
        <div style="margin-top:8px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; color:#ccc; margin-bottom:4px;">
            <span>제작 개수</span>
            <span id="qtyLabel_${r.id}">${qty}회</span>
          </div>
          <input type="range" class="craftQtySlider" data-recipe="${r.id}" min="1" max="${maxQty}" value="${qty}" style="width:100%;" />
          <div id="totalCost_${r.id}" style="color:#999; font-size:11px; margin-top:4px;">
            총 소모: ${MATERIAL_LABELS[r.materialType]} ${(r.materialAmt*qty).toLocaleString()}개 + ${(r.coin*qty).toLocaleString()} 코인
          </div>
        </div>
        <button class="craftBtn" style="margin-top:8px;">${qty}회 제작 시도</button>
      ` : `<div class="sub" style="margin-top:8px;">재료 또는 코인이 부족해요.</div>`}
    `;

    const slider = card.querySelector(".craftQtySlider");
    const qtyLabel = card.querySelector(`#qtyLabel_${r.id}`);
    const craftBtn = card.querySelector(".craftBtn");
    const totalCostEl = card.querySelector(`#totalCost_${r.id}`);
    if (slider) {
      slider.oninput = (e) => {
        const v = parseInt(e.target.value, 10);
        state.craftQty[r.id] = v;
        qtyLabel.textContent = `${v}회`;
        if (craftBtn) craftBtn.textContent = `${v}회 제작 시도`;
        if (totalCostEl) totalCostEl.textContent = `총 소모: ${MATERIAL_LABELS[r.materialType]} ${(r.materialAmt*v).toLocaleString()}개 + ${(r.coin*v).toLocaleString()} 코인`;
      };
    }
    if (craftBtn) {
      craftBtn.onclick = async () => {
        const finalQty = state.craftQty[r.id] || 1;
        const ok = await askConfirm(
          `${grade.label} 카드 제작을 ${finalQty}회 시도합니다.\n총 ${MATERIAL_LABELS[r.materialType]} ${(r.materialAmt*finalQty).toLocaleString()}개 + ${(r.coin*finalQty).toLocaleString()} 코인 소모\n회당 성공확률 ${Math.round(r.successRate*100)}%\n(실패해도 재료는 소모돼요)`,
          "제작하시겠어요?"
        );
        if (!ok) return;
        const result = craftCardMultiple(p, r.id, finalQty);
        await saveProfile(p);
        if (result.successCount + result.failCount === 0) { toast("재료 또는 코인이 부족해요."); return; }
        toast(`제작 완료: 성공 ${result.successCount}회 / 실패 ${result.failCount}회`);
        renderCrafting(content, p);
      };
    }
    list.appendChild(card);
  });
}

// 오토터치 강화 전용 화면 (성장 > 강화). 나중에 다른 강화 기능도 이 화면에 추가될 예정.
function renderAutoTapEnhance(content, p) {
  content.innerHTML = `<div class="sectionTitle">🤖 오토터치 강화</div><div id="enhBody"></div>`;
  const body = document.getElementById("enhBody");

  const curLevel = p.autoTapLevel || 0;

  // ON/OFF + 가동 레벨 선택 (자기 강화 레벨 이하로만 가능)
  const onOffRow = document.createElement("div");
  onOffRow.className = "row";
  onOffRow.innerHTML = `
    <span style="font-weight:700;">오토터치 작동</span>
    <button id="autoTapOnOffBtn" style="padding:6px 14px; border:none; border-radius:8px; background:${p.autoTapEnabled !== false ? "#4caf50" : "#555"}; color:#fff; font-size:12px; font-weight:700;">${p.autoTapEnabled !== false ? "ON" : "OFF"}</button>
  `;
  body.appendChild(onOffRow);
  document.getElementById("autoTapOnOffBtn").onclick = async () => {
    p.autoTapEnabled = p.autoTapEnabled === false ? true : false;
    await saveProfile(p);
    renderAutoTapEnhance(content, p);
  };

  if (curLevel > 0) {
    const activeLevel = Math.max(1, Math.min(p.autoTapActiveLevel || curLevel, curLevel));
    const levelRow = document.createElement("div");
    levelRow.style.marginBottom = "10px";
    levelRow.innerHTML = `
      <div class="row"><span>가동 레벨</span><span style="font-weight:800;">${activeLevel}강</span></div>
      <input id="autoTapLevelSlider" type="range" min="1" max="${curLevel}" value="${activeLevel}" style="width:100%;">
      <div class="sub" style="margin-top:2px;">보유한 강화 레벨(${curLevel}강) 이하에서만 선택할 수 있어요. 레벨을 낮추면 그만큼 재료 소모 없이 더 느리게 돌아가요.</div>
    `;
    body.appendChild(levelRow);
    levelRow.querySelector("#autoTapLevelSlider").addEventListener("change", async (e) => {
      const v = Math.max(1, Math.min(curLevel, parseInt(e.target.value, 10)));
      p.autoTapActiveLevel = v;
      await saveProfile(p);
      renderAutoTapEnhance(content, p);
    });
  }

  const nextCoin = AUTO_TAP_LEVELS[curLevel];
  body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-bottom:10px;">코인 강화든 다이아 강화든 같은 오토터치 레벨을 공유해요.</div>`);
  const cur = document.createElement("div");
  cur.className = "row";
  cur.innerHTML = `<span>현재 오토터치 레벨</span><span style="font-weight:800;">${curLevel}강 ${curLevel>=AUTO_TAP_LEVELS.length ? "(MAX)" : ""}</span>`;
  body.appendChild(cur);

  if (nextCoin && nextCoin.requiresTranscendentCard) {
    // v2.58: 30강(최종) 전용 - TRANSCENDENT 카드 1장을 직접 골라서 넣어야 하고(분해됨), 다이아로는 절대 구매 불가
    const haveMat = (p.materialsByType && p.materialsByType[nextCoin.materialType]) || 0;
    const transcendentCards = p.cards.filter(c => c.gradeId === "TRANSCENDENT" && !c.inMarket && !c.inLab);
    const baseAfford = p.coins >= nextCoin.cost && haveMat >= nextCoin.materialAmt;
    const card = document.createElement("div");
    card.className = "boostCard";
    card.style.border = "2px solid #ffd700";
    card.innerHTML = `
      <div class="name">🌟 최종 강화 (${curLevel}강 → ${nextCoin.level}강)</div>
      <div class="desc">${nextCoin.intervalSec}초마다 ${nextCoin.tapsPerTick.toLocaleString()}회 자동 터치 · ${nextCoin.cost.toLocaleString()} 코인 + ${MATERIAL_LABELS[nextCoin.materialType]} ${nextCoin.materialAmt.toLocaleString()}개 (보유: ${haveMat.toLocaleString()}) + <b style="color:#f3e9ff;">TRANSCENDENT 카드 1장 소모(분해됨)</b></div>
      <div class="sub" style="color:#e5a02f; margin:6px 0;">⚠️ 다이아로는 구매할 수 없어요. 아래에서 소모할 TRANSCENDENT 카드를 직접 선택하세요.</div>
      ${transcendentCards.length === 0
        ? `<div class="sub">보유한 TRANSCENDENT 카드가 없어요.</div>`
        : `<select id="transcendentPickSelect" style="width:100%; box-sizing:border-box; padding:8px; border-radius:8px; border:none; background:#0B0B12; color:#fff; font-size:12px; margin-bottom:8px;">
            ${transcendentCards.map(c => `<option value="${c.cardId}">${c.teamName} ${c.playerName} (OVR ${c.ovr}${c.locked ? " · 🔒잠김" : ""})</option>`).join("")}
          </select>
          <button id="transcendentUpgradeBtn" ${baseAfford ? "" : "disabled"}>최종 강화</button>`
      }
    `;
    const btn = card.querySelector("#transcendentUpgradeBtn");
    if (btn) {
      btn.onclick = async () => {
        const select = card.querySelector("#transcendentPickSelect");
        const cardId = select.value;
        const targetCard = p.cards.find(c => c.cardId === cardId);
        if (!targetCard) { toast("선택한 카드를 찾을 수 없어요."); return; }
        if (targetCard.locked) { toast("잠긴 카드는 소모할 수 없어요. 잠금을 해제해주세요."); return; }
        const have = (p.materialsByType && p.materialsByType[nextCoin.materialType]) || 0;
        if (p.coins < nextCoin.cost || have < nextCoin.materialAmt) return;
        const ok = await askConfirm(`${targetCard.teamName} ${targetCard.playerName}(OVR ${targetCard.ovr}) 카드를 분해해서 최종 강화에 사용할까요?\n이 카드는 사라지고 되돌릴 수 없어요.`, "최종 강화");
        if (!ok) return;
        p.coins -= nextCoin.cost;
        p.materialsByType[nextCoin.materialType] -= nextCoin.materialAmt;
        p.cards = p.cards.filter(c => c.cardId !== cardId);
        if (!p.autoTapActiveLevel || p.autoTapActiveLevel >= curLevel) p.autoTapActiveLevel = nextCoin.level;
        p.autoTapLevel = nextCoin.level;
        bumpMission(p, "shopBuy", 1);
        await saveProfile(p);
        toast(`🌟 오토터치 ${nextCoin.level}강(MAX) 달성!`);
        renderAutoTapEnhance(content, p);
      };
    }
    body.appendChild(card);
  } else if (nextCoin) {
    const hasMaterial = !!nextCoin.materialType;
    const haveMat = hasMaterial ? ((p.materialsByType && p.materialsByType[nextCoin.materialType]) || 0) : 0;
    const canAfford = p.coins >= nextCoin.cost && (!hasMaterial || haveMat >= nextCoin.materialAmt);
    const card = document.createElement("div");
    card.className = "boostCard";
    card.innerHTML = `
      <div class="name">코인으로 강화 (${curLevel}강 → ${nextCoin.level}강)</div>
      <div class="desc">${nextCoin.intervalSec}초마다 ${nextCoin.tapsPerTick.toLocaleString()}회 자동 터치 · ${nextCoin.cost.toLocaleString()} 코인${hasMaterial ? ` + ${MATERIAL_LABELS[nextCoin.materialType]} ${nextCoin.materialAmt.toLocaleString()}개 (보유: ${haveMat.toLocaleString()})` : ""}</div>
      <button ${canAfford ? "" : "disabled"}>강화</button>
    `;
    card.querySelector("button").onclick = async () => {
      const have = hasMaterial ? ((p.materialsByType && p.materialsByType[nextCoin.materialType]) || 0) : 0;
      if (p.coins < nextCoin.cost || (hasMaterial && have < nextCoin.materialAmt)) return;
      p.coins -= nextCoin.cost;
      if (hasMaterial) p.materialsByType[nextCoin.materialType] -= nextCoin.materialAmt;
      // 가동 레벨을 MAX로 맞춰서 쓰고 있었다면 강화 후에도 계속 MAX를 따라가도록 유지
      if (!p.autoTapActiveLevel || p.autoTapActiveLevel >= curLevel) p.autoTapActiveLevel = nextCoin.level;
      p.autoTapLevel = nextCoin.level;
      bumpMission(p, "shopBuy", 1);
      await saveProfile(p);
      toast(`오토터치 ${nextCoin.level}강 적용!`);
      renderAutoTapEnhance(content, p);
    };
    body.appendChild(card);

    // v2.74: 1강(최초)은 코인 1만으로 단순화했으니 다이아 옵션 자체를 안 보여줌 (재료도 없어서 사실상 무의미)
    if (hasMaterial) {
    // 다이아로 즉시 강화 (코인 강화와 동일한 레벨을 공유)
    const diaCost = AUTO_TAP_DIAMOND_COSTS[curLevel];
    const diaCard = document.createElement("div");
    diaCard.className = "boostCard";
    diaCard.innerHTML = `
      <div class="name">💎 다이아로 즉시 강화 (${curLevel}강 → ${nextCoin.level}강)</div>
      <div class="desc">재료 없이 다이아만으로 즉시 강화해요 · 💎 ${diaCost.toLocaleString()}</div>
      <button ${p.diamonds >= diaCost ? "" : "disabled"}>다이아로 강화</button>
    `;
    diaCard.querySelector("button").onclick = async () => {
      if (p.diamonds < diaCost) return;
      p.diamonds -= diaCost;
      if (!p.autoTapActiveLevel || p.autoTapActiveLevel >= curLevel) p.autoTapActiveLevel = nextCoin.level;
      p.autoTapLevel = nextCoin.level;
      bumpMission(p, "shopBuy", 1);
      await saveProfile(p);
      toast(`💎 오토터치 ${nextCoin.level}강 적용!`);
      renderAutoTapEnhance(content, p);
    };
    body.appendChild(diaCard);
    }
  } else {
    body.insertAdjacentHTML("beforeend", `<div class="sub">오토터치가 MAX 레벨이에요.</div>`);
  }
}

// 카드 강화 전용 화면 (카드 메뉴 > 카드 강화)
function renderEnhance(content, p) {
  content.innerHTML = `<div class="sectionTitle">🎴 카드 강화</div><div id="enhBody"></div>`;
  const body = document.getElementById("enhBody");

  // 카드 강화 - 구단/등급/선수로 필터링 + 검색 가능하도록 개선
  const eligible = p.cards.filter(c => !c.inMarket && !c.inLab);
  if (eligible.length === 0) {
    body.innerHTML = `<div class="sub" style="margin-top:20px;">보유한 카드가 없어요.</div>`;
    return;
  }
  body.insertAdjacentHTML("beforeend", `<div class="sub" style="margin-bottom:10px;">완전히 동일한 카드(같은 선수+같은 등급)를 재료로 소모해 강화해요. 강화 대상은 잠겨 있어도 강화할 수 있지만, 재료로 쓰이는 카드는 잠금 해제되어 있어야 해요.</div>`);

  if (!state.enhanceFilter) state.enhanceFilter = { search: "", teamId: "ALL", gradeId: "ALL" };
  const ef = state.enhanceFilter;

  const filterBar = document.createElement("div");
  filterBar.style.cssText = "margin-bottom:12px;";
  filterBar.innerHTML = `
    <input id="enhSearchInput" type="text" placeholder="🔍 선수 이름으로 검색" value="${ef.search.replace(/"/g,"&quot;")}"
      style="width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:13px; margin-bottom:8px;">
    <select id="enhTeamSelect" style="width:100%; box-sizing:border-box; padding:8px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:12px; margin-bottom:8px;">
      <option value="ALL" ${ef.teamId==="ALL"?"selected":""}>전체 구단</option>
      ${TEAMS.map(t => `<option value="${t.id}" ${ef.teamId===t.id?"selected":""}>${t.name}</option>`).join("")}
    </select>
    <div id="enhGradeChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
  `;
  body.appendChild(filterBar);

  const chipsWrap = filterBar.querySelector("#enhGradeChips");
  const allGradeBtn = document.createElement("button");
  allGradeBtn.textContent = "전체 등급";
  allGradeBtn.style.cssText = `padding:6px 10px; border:none; border-radius:8px; font-size:11px; font-weight:700; background:${ef.gradeId==="ALL"?"#fff":"linear-gradient(155deg,#20202c,#131319)"}; color:${ef.gradeId==="ALL"?"#000":"#999"};`;
  allGradeBtn.onclick = () => { ef.gradeId = "ALL"; renderEnhance(content, p); };
  chipsWrap.appendChild(allGradeBtn);
  GRADES.forEach(g => {
    const btn = document.createElement("button");
    btn.textContent = g.label;
    const active = ef.gradeId === g.id;
    btn.style.cssText = `padding:6px 10px; border:none; border-radius:8px; font-size:11px; font-weight:700; background:${active ? g.color : "linear-gradient(155deg,#20202c,#131319)"}; color:${active ? "#000" : g.color};`;
    btn.onclick = () => { ef.gradeId = g.id; renderEnhance(content, p); };
    chipsWrap.appendChild(btn);
  });

  const listWrap = document.createElement("div");
  body.appendChild(listWrap);

  filterBar.querySelector("#enhSearchInput").addEventListener("input", (e) => {
    ef.search = e.target.value;
    // 검색 중 매 글자마다 select box를 다시 그리지 않도록 목록 부분만 갱신
    renderEnhanceCardList(body, p, ef, listWrap);
  });
  filterBar.querySelector("#enhTeamSelect").addEventListener("change", (e) => {
    ef.teamId = e.target.value;
    renderEnhance(content, p);
  });

  renderEnhanceCardList(body, p, ef, listWrap);
}

// 필터(검색/구단/등급) 조건에 맞는 카드 강화 목록을 listWrap 안에 그려줌
// (검색어 입력할 때는 select box 등 다른 UI를 다시 그리지 않기 위해 목록 부분만 별도 함수로 분리)
function renderEnhanceBox(container, p, body, ef, listWrap, mainCard, grade, fuelCount) {
  const curLevel = mainCard.enhanceLevel || 0;
  const box = document.createElement("div");
  box.className = "boostCard";
  box.style.borderLeft = `3px solid ${grade.color}`;
  box.style.marginBottom = "6px";

  if (curLevel >= 10) {
    box.innerHTML = `
      <div class="name" style="color:${grade.color};">${grade.label} · ${mainCard.playerName}</div>
      <div class="desc">OVR ${mainCard.ovr} · ${curLevel}강 (MAX) ${mainCard.locked ? "🔒" : ""}</div>
    `;
  } else {
    const step = ENHANCE_LEVELS[curLevel];
    const materialType = getEnhanceMaterialType(mainCard.gradeId);
    const haveMat = (p.materialsByType && p.materialsByType[materialType]) || 0;
    const haveDup = fuelCount >= step.dupNeeded;
    const haveMatEnough = haveMat >= step.materialAmt;
    const haveCoin = p.coins >= step.coin;
    const canAfford = haveDup && haveMatEnough && haveCoin;
    const nextOvr = mainCard.ovr + 1;
    const okColor = "#4caf50", ngColor = "#e53935";
    box.innerHTML = `
      <div class="name" style="color:${grade.color};">${grade.label} · ${mainCard.playerName} ${mainCard.locked ? "🔒" : ""}</div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin:8px 0; text-align:center;">
        <div style="flex:1;">
          <div style="font-size:10px; color:#888;">현재</div>
          <div style="font-weight:800; font-size:15px;">+${curLevel}강</div>
          <div style="font-size:11px; color:#999;">OVR ${mainCard.ovr}</div>
        </div>
        <div style="flex:0 0 24px; color:#666; font-size:16px;">→</div>
        <div style="flex:1;">
          <div style="font-size:10px; color:#888;">강화 후</div>
          <div style="font-weight:800; font-size:15px; color:${grade.color};">+${step.level}강</div>
          <div style="font-size:11px; color:#4caf50;">OVR ${nextOvr}</div>
        </div>
      </div>
      <div style="background:#0B0B12; border-radius:8px; padding:8px 10px; margin-bottom:8px;">
        <div style="font-size:11px; color:#888; margin-bottom:4px;">필요 재료</div>
