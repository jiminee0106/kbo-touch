          <span>동일 카드 ${step.dupNeeded}장</span><span>보유 ${fuelCount}장</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px; color:${haveMatEnough ? okColor : ngColor};">
          <span>${MATERIAL_LABELS[materialType]} ${step.materialAmt}개</span><span>보유 ${haveMat.toLocaleString()}개</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:${haveCoin ? okColor : ngColor};">
          <span>코인 ${step.coin.toLocaleString()}</span><span>보유 ${p.coins.toLocaleString()}</span>
        </div>
      </div>
      <button ${canAfford ? "" : "disabled"}>${canAfford ? "강화하기" : "재료 부족"}</button>
    `;
    const btn = box.querySelector("button");
    if (btn) btn.onclick = async () => {
      const result = enhanceCard(p, mainCard);
      if (!result.ok) { toast(result.reason); return; }
      await saveProfile(p);
      toast(`${mainCard.playerName} ${result.newLevel}강 달성! OVR ${mainCard.ovr}`);
      renderEnhanceCardList(body, p, ef, listWrap);
    };
  }
  container.appendChild(box);
}

// v2.14: 보유 카드가 많을 때 버벅거림/가독성을 해결하기 위해
// (1) 강화 가능 / 재료·카드 부족 / MAX 완료 세 구역으로 나눠서 보여주고
// (2) 팀당 한번에 최대 40개까지만 그리고 "더보기"로 확장해서 DOM 생성량을 줄임
function renderEnhanceCardList(body, p, ef, listWrap) {
  listWrap.innerHTML = "";
  const eligible = p.cards.filter(c => !c.inMarket && !c.inLab);
  const keyword = (ef.search || "").trim().toLowerCase();

  const groups = {};
  eligible.forEach(c => {
    if (ef.teamId !== "ALL" && c.teamId !== ef.teamId) return;
    if (ef.gradeId !== "ALL" && c.gradeId !== ef.gradeId) return;
    if (keyword && !c.playerName.toLowerCase().includes(keyword)) return;
    const key = `${c.teamId}_${c.playerName}_${c.gradeId}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });
  const groupList = Object.values(groups).map(g => {
    g.sort((a, b) => (b.enhanceLevel||0) - (a.enhanceLevel||0));
    return g;
  });

  if (groupList.length === 0) {
    listWrap.innerHTML = `<div class="sub" style="margin-top:20px;">조건에 맞는 카드가 없어요.</div>`;
    return;
  }

  const ready = [], blocked = [], maxed = [];
  groupList.forEach(g => {
    const mainCard = g[0];
    const curLevel = mainCard.enhanceLevel || 0;
    if (curLevel >= 10) { maxed.push(g); return; }
    const step = ENHANCE_LEVELS[curLevel];
    const materialType = getEnhanceMaterialType(mainCard.gradeId);
    const haveMat = (p.materialsByType && p.materialsByType[materialType]) || 0;
    const fuelCount = countEnhanceFuel(p, mainCard);
    const canAfford = fuelCount >= step.dupNeeded && haveMat >= step.materialAmt && p.coins >= step.coin;
    (canAfford ? ready : blocked).push(g);
  });

  if (!state.enhanceCollapsed) state.enhanceCollapsed = {};
  if (!state.enhanceShowMore) state.enhanceShowMore = {};
  const forceExpand = !!(keyword || ef.teamId !== "ALL" || ef.gradeId !== "ALL");

  function renderSection(title, list, sectionKey) {
    if (list.length === 0) return;
    const st = document.createElement("div");
    st.className = "sectionTitle";
    st.textContent = `${title} (${list.length})`;
    listWrap.appendChild(st);

    const byTeam = {};
    list.forEach(g => { const tid = g[0].teamId; if (!byTeam[tid]) byTeam[tid] = []; byTeam[tid].push(g); });

    TEAMS.filter(t => byTeam[t.id]).forEach(t => {
      const teamGroups = byTeam[t.id];
      teamGroups.sort((a, b) => GRADES.findIndex(x=>x.id===b[0].gradeId) - GRADES.findIndex(x=>x.id===a[0].gradeId));
      const collapseKey = `${sectionKey}_${t.id}`;
      const isCollapsed = forceExpand ? false : !!state.enhanceCollapsed[collapseKey];

      const teamBlock = document.createElement("div");
      teamBlock.style.marginBottom = "10px";
      const header = document.createElement("div");
      header.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:linear-gradient(155deg,#20202c,#131319); border-radius:8px; cursor:pointer;";
      header.innerHTML = `<span style="color:${t.color}; font-weight:700; font-size:13px;">${t.name}</span><span style="color:#999; font-size:12px;">${teamGroups.length}종 ${isCollapsed ? "▸" : "▾"}</span>`;
      teamBlock.appendChild(header);

      const bodyWrap = document.createElement("div");
      bodyWrap.style.cssText = `margin-top:8px; display:${isCollapsed ? "none" : "block"};`;
      teamBlock.appendChild(bodyWrap);

      const showCount = state.enhanceShowMore[collapseKey] || 40;
      const visibleGroups = teamGroups.slice(0, showCount);
      visibleGroups.forEach(group => {
        const mainCard = group[0];
        const grade = getGrade(mainCard.gradeId);
        const fuelCount = countEnhanceFuel(p, mainCard);
        renderEnhanceBox(bodyWrap, p, body, ef, listWrap, mainCard, grade, fuelCount);
      });
      if (teamGroups.length > showCount) {
        const moreBtn = document.createElement("button");
        moreBtn.textContent = `더보기 (${teamGroups.length - showCount}개 더)`;
        moreBtn.style.cssText = "width:100%; padding:8px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:12px; margin-top:4px;";
        moreBtn.onclick = () => { state.enhanceShowMore[collapseKey] = showCount + 40; renderEnhanceCardList(body, p, ef, listWrap); };
        bodyWrap.appendChild(moreBtn);
      }

      header.onclick = () => {
        const collapsing = bodyWrap.style.display !== "none";
        state.enhanceCollapsed[collapseKey] = collapsing;
        bodyWrap.style.display = collapsing ? "none" : "block";
        const span = header.querySelector("span:last-child");
        if (span) span.textContent = `${teamGroups.length}종 ${collapsing ? "▸" : "▾"}`;
      };

      listWrap.appendChild(teamBlock);
    });
  }

  renderSection("✅ 강화 가능한 카드", ready, "ready");
  renderSection("🔒 재료·카드 부족", blocked, "blocked");
  renderSection("🏆 최대 강화 완료 (10강)", maxed, "maxed");
}

function renderTitles(content, p, team) {
  content.innerHTML = `<div class="sectionTitle">칭호 (${p.titles.length} / ${Object.keys(TITLES).length} 보유)</div><div class="sub" style="margin-bottom:8px;">💎로 표시된 칭호는 다이아로 바로 구매할 수 있어요.</div><div id="titlesList"></div>`;
  const list = document.getElementById("titlesList");

  const noneRow = document.createElement("div");
  noneRow.className = "row";
  noneRow.style.cursor = "pointer";
  noneRow.innerHTML = `<span>${!p.equippedTitle ? "✅ " : ""}칭호 없음</span><span></span>`;
  noneRow.onclick = async () => { p.equippedTitle = null; await saveProfile(p); renderTitles(content, p, team); };
  list.appendChild(noneRow);

  Object.keys(TITLES).forEach(tid => {
    const t = TITLES[tid];
    const owned = p.titles.includes(tid);
    const equipped = p.equippedTitle === tid;
    const price = PURCHASABLE_TITLE_PRICES[tid];
    const row = document.createElement("div");
    row.className = "row";
    row.style.flexDirection = "column";
    row.style.alignItems = "flex-start";
    row.style.cursor = owned ? "pointer" : "default";
    row.style.opacity = owned ? "1" : "0.5";
    row.innerHTML = `
      <div style="display:flex; justify-content:space-between; width:100%;">
        <span style="color:${t.color}; font-weight:700;">${owned ? (equipped ? "✅ " : "") : "🔒 "}${t.label}${!owned && price ? ` <span style="color:#7fd8ff; font-weight:800;">💎${price.toLocaleString()}</span>` : ""}</span>
        <span style="color:#666; font-size:10px;">${t.tier}</span>
      </div>
      <div style="color:#999; font-size:11px; margin-top:2px;">${owned ? t.effectDesc : (price ? t.effectDesc : "미획득")}</div>
      ${!owned && price ? `<button class="buyTitleBtn" style="width:100%; margin-top:6px; padding:8px; border:none; border-radius:8px; background:linear-gradient(135deg,#e6417f,#9e0038); color:#fff; font-weight:700; font-size:12px;" ${p.diamonds < price ? "disabled" : ""}>💎 ${price.toLocaleString()}에 구매</button>` : ""}
    `;
    if (owned) {
      row.onclick = async () => { p.equippedTitle = tid; await saveProfile(p); renderTitles(content, p, team); };
    }
    const buyBtn = row.querySelector(".buyTitleBtn");
    if (buyBtn) {
      buyBtn.onclick = async (e) => {
        e.stopPropagation();
        if (p.diamonds < price) { toast("다이아가 부족해요."); return; }
        const ok = await askConfirm(`💎${price.toLocaleString()}을 사용해서 "${t.label}" 칭호를 구매할까요?`, "칭호 구매");
        if (!ok) return;
        p.diamonds -= price;
        p.titles.push(tid);
        await saveProfile(p);
        toast(`"${t.label}" 칭호를 획득했어요!`);
        renderTitles(content, p, team);
      };
    }
    list.appendChild(row);
  });
}

// 릴 매치 결과를 사람이 읽는 문구로 변환 (일치 없으면 빈 문자열)
function slotMatchLabel(result) {
  if (result.matchCount === 3) return `🎉 3개 일치! 잭팟 ×${result.multiplier}`;
  if (result.matchCount === 2) return `✨ 2개 일치 ×${result.multiplier}`;
  return "";
}

    <div class="sectionTitle" style="margin-top:20px;">💎 가격 초기화 (오늘 ${p.superLucky.resetsToday || 0}/${SUPER_LUCKY_RESET_MAX_PER_DAY}회 사용)</div>
    <div class="sub" style="margin-bottom:8px;">사이클 사용 횟수를 0으로 되돌려 가격을 다시 1억부터 시작해요. 초기화할 때마다 다음 초기화 비용이 2배가 되고, 하루 최대 ${SUPER_LUCKY_RESET_MAX_PER_DAY}번까지만 가능해요.</div>
    <div class="row"><span>초기화 비용</span><span style="font-weight:800;">💎 ${resetCost.toLocaleString()}</span></div>
    <button id="superLuckyResetBtn" style="width:100%; padding:12px; border:none; border-radius:10px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-weight:700; font-size:13px; margin-top:6px;" ${canReset ? "" : "disabled"}>
      ${resetsLeftToday > 0 ? `💎 가격 초기화 (${resetCost.toLocaleString()})` : "오늘 초기화 횟수 소진"}
    </button>
  `;
  const spinBtn = document.getElementById("superLuckySpinBtn");
  const resetBtn = document.getElementById("superLuckyResetBtn");
  const reelEls = Array.from(document.querySelectorAll("#superLuckyReels .slotReel"));
  spinBtn.onclick = () => {
    ensureSuperLucky(p);
    const curPrice = getSuperLuckyPrice(p);
    if (p.coins < curPrice) { toast("코인이 부족해요."); return; }
    p.coins -= curPrice;
    p.superLucky.cycleCount += 1;
    const result = spinSuperLuckyMachine();
    spinBtn.disabled = true;
    if (resetBtn) resetBtn.disabled = true;
    spinBtn.textContent = "🔥 돌아가는 중...";
    reelEls.forEach(el => el.classList.remove("locked"));
    playSlotAnimation(reelEls, result.reels, SUPER_LUCKY_SYMBOLS, async () => {
      const isLegendaryBoostJackpot = result.matchCount === 3 && result.reward && result.reward.boostId === "boost_LEGENDARY";
      if (isLegendaryBoostJackpot) {
        showLuckyResultEffect(result.tier, "🎉 레전더리 부스트 잭팟! 보상을 선택하세요");
        const choice = await showSuperLuckyLegendaryChoice(p);
        await saveProfile(p);
        state.lastSuperLuckyResult = `🎉 잭팟 선택 보상 · ${choice.label}`;
        renderSuperLuckyMachine(content, p);
        return;
      }
      const resultText = applyRewardOrList(p, result);
      await saveProfile(p);
      const matchLabel = slotMatchLabel(result);
      state.lastSuperLuckyResult = `${matchLabel ? matchLabel + " · " : ""}${resultText}`;
      showLuckyResultEffect(result.tier, state.lastSuperLuckyResult);
      renderSuperLuckyMachine(content, p);
    });
  };
  resetBtn.onclick = async () => {
    ensureSuperLucky(p);
    const cost = getSuperLuckyResetCost(p);
    if ((p.superLucky.resetsToday || 0) >= SUPER_LUCKY_RESET_MAX_PER_DAY) { toast(`오늘은 이미 ${SUPER_LUCKY_RESET_MAX_PER_DAY}번 초기화했어요. 내일 다시 시도해주세요.`); return; }
    if (p.diamonds < cost) { toast("다이아가 부족해요."); return; }
    const ok = await askConfirm(`💎 ${cost.toLocaleString()} 다이아로 슈퍼 럭키머신 가격을 초기화할까요?\n다음 이용 가격이 다시 1억 코인부터 시작돼요. (오늘 남은 초기화: ${SUPER_LUCKY_RESET_MAX_PER_DAY - (p.superLucky.resetsToday || 0)}회)`, "가격 초기화");
    if (!ok) return;
    p.diamonds -= cost;
    p.superLucky.cycleCount = 0;
    p.superLucky.totalResetCount += 1;
    p.superLucky.resetsToday = (p.superLucky.resetsToday || 0) + 1;
    await saveProfile(p);
    toast("슈퍼 럭키머신 가격이 초기화됐어요!");
    renderSuperLuckyMachine(content, p);
  };
}

// ============================================================================
// v2.2: 카드 연구소 (검색 + 구단/등급 필터, 구단별 그룹핑)
// ============================================================================
let cardLabTimer = null;
function renderCardLab(content, p) {
  ensureCardLab(p);
  if (cardLabTimer) clearInterval(cardLabTimer);
  if (!state.labFilter) state.labFilter = { search: "", teamId: "ALL", gradeId: "ALL" };
  const lf = state.labFilter;

  content.innerHTML = `
    <div class="sectionTitle">🧪 카드 연구소</div>
    <div class="sub" style="margin-bottom:10px;">카드를 넣고 일정 시간이 지나면 OVR이 상승해요. 카드 강화와는 별개의 성장 요소예요. 알약을 소모하며, 슬롯은 최대 ${getLabMaxSlots(p)}개까지 동시에 사용할 수 있어요.</div>
    <div class="row"><span>보유 알약</span><span id="labPillRow" style="font-weight:800;">💊 ${(p.pill || 0).toLocaleString()}</span></div>
    <div class="row"><span>연구 슬롯</span><span id="labSlotCountRow" style="font-weight:800;">${p.cardLab.slots.length} / ${getLabMaxSlots(p)}</span></div>
    <div class="sectionTitle" style="margin-top:14px;">진행 중인 연구</div>
    <div id="labActiveSlots"></div>
    <div class="sectionTitle" style="margin-top:18px;">연구 가능한 카드</div>
    <input id="labSearchInput" type="text" placeholder="🔍 선수 이름으로 검색" value="${lf.search.replace(/"/g,"&quot;")}"
      style="width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:13px; margin-bottom:8px;">
    <select id="labTeamSelect" style="width:100%; box-sizing:border-box; padding:8px; border-radius:8px; border:none; background:linear-gradient(155deg,#20202c,#131319); color:#fff; font-size:12px; margin-bottom:8px;">
      <option value="ALL" ${lf.teamId==="ALL"?"selected":""}>전체 구단</option>
      ${TEAMS.map(t => `<option value="${t.id}" ${lf.teamId===t.id?"selected":""}>${t.name}</option>`).join("")}
    </select>
    <div id="labGradeChips" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;"></div>
    <div id="labEligibleList"></div>
  `;

  // 등급 칩
  const chipsWrap = document.getElementById("labGradeChips");
  const allGradeBtn = document.createElement("button");
  allGradeBtn.textContent = "전체 등급";
  allGradeBtn.style.cssText = `padding:6px 10px; border:none; border-radius:8px; font-size:11px; font-weight:700; background:${lf.gradeId==="ALL"?"#fff":"linear-gradient(155deg,#20202c,#131319)"}; color:${lf.gradeId==="ALL"?"#000":"#999"};`;
  allGradeBtn.onclick = () => { lf.gradeId = "ALL"; renderCardLab(content, p); };
  chipsWrap.appendChild(allGradeBtn);
  GRADES.forEach(g => {
    const btn = document.createElement("button");
    btn.textContent = g.label;
    const active = lf.gradeId === g.id;
    btn.style.cssText = `padding:6px 10px; border:none; border-radius:8px; font-size:11px; font-weight:700; background:${active ? g.color : "linear-gradient(155deg,#20202c,#131319)"}; color:${active ? "#000" : g.color};`;
    btn.onclick = () => { lf.gradeId = g.id; renderCardLab(content, p); };
    chipsWrap.appendChild(btn);
  });

  const listEl = document.getElementById("labEligibleList");
  document.getElementById("labSearchInput").addEventListener("input", (e) => {
    lf.search = e.target.value;
    renderLabEligibleList(content, p, lf, listEl); // 검색 중에는 목록만 갱신해서 입력 포커스가 끊기지 않게 함
  });
  document.getElementById("labTeamSelect").addEventListener("change", (e) => {
    lf.teamId = e.target.value;
    renderCardLab(content, p);
  });

  function refreshLabHeader() {
    const pillRow = document.getElementById("labPillRow");
    if (pillRow) pillRow.textContent = `💊 ${(p.pill || 0).toLocaleString()}`;
    const slotRow = document.getElementById("labSlotCountRow");
    if (slotRow) slotRow.textContent = `${p.cardLab.slots.length} / ${getLabMaxSlots(p)}`;
  }

  function drawActiveSlots() {
    ensureCardLab(p);
    const box = document.getElementById("labActiveSlots");
    if (!box) return;
    const activeSlots = p.cardLab.slots;
    const now = Date.now();
    let activeHTML = "";
    if (activeSlots.length === 0) {
      activeHTML = `<div class="sub" style="margin-bottom:10px;">진행 중인 연구가 없어요.</div>`;
    } else {
      activeSlots.forEach(slot => {
        const card = p.cards.find(c => c.cardId === slot.cardId);
        const grade = getGrade(slot.gradeId);
        const remainMs = slot.completesAt - now;
        const done = remainMs <= 0;
        const diaCost = done ? 0 : getInstantCompleteDiaCost(slot.gradeId, remainMs);
        activeHTML += `
          <div class="boostCard" style="border-left:3px solid ${grade.color};" data-slot="${slot.slotId}">
            <div class="name" style="color:${grade.color};">${grade.label} · ${card ? card.playerName : "(카드 없음)"} (Lv.${slot.fromLevel}→${slot.toLevel})</div>
            <div class="desc">${done ? "✅ 연구 완료!" : `⏳ 완료까지 ${formatDurationKR(remainMs)}`}</div>
            <div style="display:flex; gap:6px; margin-top:6px;">
              ${done
                ? `<button class="labCollectBtn" style="flex:1; padding:8px; border:none; border-radius:8px; background:#4caf50; color:#fff; font-weight:700; font-size:12px;">수령하기</button>`
                : `<button class="labInstantBtn" style="flex:1; padding:8px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:12px;" ${p.diamonds >= diaCost ? "" : "disabled"}>💎 즉시 완료 ${diaCost.toLocaleString()}</button>`
              }
            </div>
          </div>
        `;
      });
    }
    box.innerHTML = activeHTML;
    box.querySelectorAll(".labCollectBtn").forEach(btn => {
      btn.onclick = async () => {
        const slotId = btn.closest("[data-slot]").dataset.slot;
        const result = collectCardResearch(p, slotId);
        if (!result.ok) { toast(result.reason || "수령할 수 없어요."); return; }
        await saveProfile(p);
        toast(result.cardGone ? "연구가 완료됐지만 대상 카드를 찾을 수 없었어요." : `연구 완료! OVR +${result.gain}`);
        drawActiveSlots();
        refreshLabHeader();
        renderLabEligibleList(content, p, lf, listEl);
      };
    });
    box.querySelectorAll(".labInstantBtn").forEach(btn => {
      btn.onclick = async () => {
        const slotId = btn.closest("[data-slot]").dataset.slot;
        const result = instantCompleteResearch(p, slotId);
        if (!result.ok) { toast(result.reason || "즉시완료할 수 없어요."); return; }
        await saveProfile(p);
        toast("💎 즉시 완료했어요!");
        drawActiveSlots();
      };
    });
  }

  drawActiveSlots();
  renderLabEligibleList(content, p, lf, listEl);

  cardLabTimer = setInterval(() => {
    if (state.tab !== "cardLab") { clearInterval(cardLabTimer); return; }
    drawActiveSlots();
  }, 1000);
}

// 검색어/구단/등급 필터에 맞는 "연구 가능한 카드" 목록을 구단별로 그룹핑해서 그려줌.
// 검색창 입력 중에는 이 함수만 다시 호출되므로 포커스가 끊기지 않음.
function renderLabCardBox(container, content, p, c, grade, cfg) {
  const curLevel = c.researchLevel || 0;
  const nextLevel = curLevel + 1;
  const pillCost = getResearchPillCost(c.gradeId, nextLevel);
  const canStart = (p.pill || 0) >= pillCost && p.cardLab.slots.length < getLabMaxSlots(p);
  const havePill = p.pill || 0;
  const okColor = "#4caf50", ngColor = "#e53935";

  const box = document.createElement("div");
  box.className = "boostCard";
  box.style.cssText = `border-left:3px solid ${grade.color}; margin-bottom:8px;`;
  box.innerHTML = `
    <div class="name" style="color:${grade.color}; font-size:14px;">${grade.label} · ${c.playerName}</div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin:8px 0; text-align:center;">
      <div style="flex:1;">
        <div style="font-size:10px; color:#888;">연구 단계</div>
        <div style="font-weight:800; font-size:15px;">Lv.${curLevel}</div>
        <div style="font-size:11px; color:#999;">OVR ${c.ovr}</div>
      </div>
      <div style="flex:0 0 24px; color:#666; font-size:16px;">→</div>
      <div style="flex:1;">
        <div style="font-size:10px; color:#888;">완료 후</div>
        <div style="font-weight:800; font-size:15px; color:${grade.color};">Lv.${nextLevel}</div>
        <div style="font-size:11px; color:#4caf50;">OVR +${cfg.ovrGainPerLevel}</div>
      </div>
    </div>
    <div style="background:#0B0B12; border-radius:8px; padding:8px 10px; margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px; color:${havePill >= pillCost ? okColor : ngColor};">
        <span>💊 알약 ${pillCost}개</span><span>보유 ${havePill.toLocaleString()}개</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:#999;">
        <span>⏳ 소요시간</span><span>${formatDurationKR(cfg.timeMs)}</span>
      </div>
    </div>
    <button class="labStartBtn" ${canStart ? "" : "disabled"}>${canStart ? "연구 시작" : (havePill < pillCost ? "알약 부족" : "슬롯 가득참")}</button>
  `;
  box.querySelector(".labStartBtn").onclick = async () => {
    const ok = await askConfirm(`${c.playerName} 카드를 연구합니다.\n💊 알약 ${pillCost}개 소모, 소요시간 ${formatDurationKR(cfg.timeMs)}\n완료 시 OVR +${cfg.ovrGainPerLevel}`, "연구를 시작할까요?");
    if (!ok) return;
    const result = startCardResearch(p, c.cardId);
    if (!result.ok) { toast(result.reason); return; }
    await saveProfile(p);
    toast("연구를 시작했어요!");
    renderCardLab(content, p); // 슬롯이 새로 생기므로 화면 전체를 다시 그림
  };
  container.appendChild(box);
}

// v2.14: 보유 카드가 많을 때 버벅거림/가독성을 해결하기 위해
// (1) 연구 가능 / 알약 부족 두 구역으로 나눠서 보여주고
// (2) 팀당 한번에 최대 40개까지만 그리고 "더보기"로 확장해서 DOM 생성량을 줄임
function renderLabEligibleList(content, p, lf, listEl) {
  const keyword = (lf.search || "").trim().toLowerCase();
  const eligible = p.cards.filter(c => {
    if (c.inMarket || c.inLab) return false;
    const cfg = CARD_RESEARCH_CONFIG[c.gradeId];
    if (!cfg || (c.researchLevel || 0) >= cfg.maxLevel) return false;
    if (lf.teamId !== "ALL" && c.teamId !== lf.teamId) return false;
    if (lf.gradeId !== "ALL" && c.gradeId !== lf.gradeId) return false;
    if (keyword && !c.playerName.toLowerCase().includes(keyword)) return false;
    return true;
  });

  if (eligible.length === 0) {
    listEl.innerHTML = `<div class="sub">조건에 맞는 연구 가능한 카드가 없어요. (이미 최대 연구단계이거나 거래소/연구 중인 카드는 제외돼요)</div>`;
    return;
  }

  const havePill = p.pill || 0;
  const ready = [], blocked = [];
  eligible.forEach(c => {
    const cfg = CARD_RESEARCH_CONFIG[c.gradeId];
    const pillCost = getResearchPillCost(c.gradeId, (c.researchLevel || 0) + 1);
    (havePill >= pillCost ? ready : blocked).push(c);
  });

  if (!state.labCollapsed) state.labCollapsed = {};
  if (!state.labShowMore) state.labShowMore = {};
  const forceExpand = !!(keyword || lf.teamId !== "ALL" || lf.gradeId !== "ALL");

  listEl.innerHTML = "";

  function renderSection(title, list, sectionKey) {
    if (list.length === 0) return;
    const st = document.createElement("div");
    st.className = "sectionTitle";
    st.textContent = `${title} (${list.length})`;
    listEl.appendChild(st);

    const byTeam = {};
    list.forEach(c => { if (!byTeam[c.teamId]) byTeam[c.teamId] = []; byTeam[c.teamId].push(c); });

    TEAMS.filter(t => byTeam[t.id]).forEach(t => {
      const cards = byTeam[t.id].sort((a, b) => GRADES.findIndex(g => g.id === b.gradeId) - GRADES.findIndex(g => g.id === a.gradeId));
      const collapseKey = `${sectionKey}_${t.id}`;
      const isCollapsed = forceExpand ? false : !!state.labCollapsed[collapseKey];

      const teamBlock = document.createElement("div");
      teamBlock.style.marginBottom = "10px";
      const header = document.createElement("div");
      header.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:linear-gradient(155deg,#20202c,#131319); border-radius:8px; cursor:pointer;";
      header.innerHTML = `<span style="color:${t.color}; font-weight:700; font-size:13px;">${t.name}</span><span style="color:#999; font-size:12px;">${cards.length}장 ${isCollapsed ? "▸" : "▾"}</span>`;
      teamBlock.appendChild(header);

      const body = document.createElement("div");
      body.style.cssText = `margin-top:8px; display:${isCollapsed ? "none" : "block"};`;
      teamBlock.appendChild(body);

      const showCount = state.labShowMore[collapseKey] || 40;
      const visibleCards = cards.slice(0, showCount);
      visibleCards.forEach(c => {
        const grade = getGrade(c.gradeId);
        const cfg = CARD_RESEARCH_CONFIG[c.gradeId];
        renderLabCardBox(body, content, p, c, grade, cfg);
      });
      if (cards.length > showCount) {
        const moreBtn = document.createElement("button");
        moreBtn.textContent = `더보기 (${cards.length - showCount}개 더)`;
        moreBtn.style.cssText = "width:100%; padding:8px; border:none; border-radius:8px; background:linear-gradient(155deg,#3a3a47,#232330); color:#fff; font-size:12px; margin-top:4px;";
        moreBtn.onclick = () => { state.labShowMore[collapseKey] = showCount + 40; renderLabEligibleList(content, p, lf, listEl); };
        body.appendChild(moreBtn);
      }

      header.onclick = () => {
        const collapsing = body.style.display !== "none";
        state.labCollapsed[collapseKey] = collapsing;
        body.style.display = collapsing ? "none" : "block";
        const span = header.querySelector("span:last-child");
        if (span) span.textContent = `${cards.length}장 ${collapsing ? "▸" : "▾"}`;
      };

      listEl.appendChild(teamBlock);
    });
  }

  renderSection("✅ 연구 가능한 카드", ready, "ready");
  renderSection("💊 알약 부족", blocked, "blocked");
}

// ============================================================================
// v2.36: 부스트 보관함 - 보유한 부스트를 귀속/거래가능으로 구분해서 보여주고 사용(활성화)하는 전용 화면
// ============================================================================
function renderBoostStorage(content, p) {
  const ownedBoostIds = Object.keys(p.boostInventory || {}).filter(id => getBoostTotalCount(p, id) > 0);
  const gradeActive = p.activeBoost && p.activeBoost.expiresAt > Date.now();

  content.innerHTML = `
    <div class="sectionTitle">🎒 부스트 보관함</div>
    <div class="sub" style="margin-bottom:10px;">재화상점에서 구매한 부스트는 <b>귀속</b>(거래 불가)이고, 럭키머신/이벤트/업적/쿠폰으로 받은 부스트는 <b>거래가능</b>이에요. 거래가능한 부스트는 거래소 [🎁 기타] 탭에서 판매할 수 있어요.<br>⚡ <b>사용 시에는 항상 귀속 부스트부터 먼저 소모</b>되고, 귀속분이 다 떨어지면 그다음 거래가능한 부스트가 소모돼요.</div>
    <div id="boostStorageActive"></div>
    <div id="boostStorageList"></div>
  `;

  if (gradeActive) {
    const activeDef = ALL_BOOST_DEFS.find(b => b.id === p.activeBoost.boostId);
    const remain = Math.ceil((p.activeBoost.expiresAt - Date.now()) / 60000);
    document.getElementById("boostStorageActive").innerHTML = `<div class="row"><span>⚡ 활성화 중: ${activeDef ? activeDef.name : p.activeBoost.boostId}</span><span>${remain}분 남음</span></div>`;
  }

  const list = document.getElementById("boostStorageList");
  if (ownedBoostIds.length === 0) {
    list.innerHTML = `<div class="sub" style="margin-top:20px;">보유한 부스트가 없어요. 재화상점에서 구매하거나, 럭키머신/업적 등으로 얻어보세요.</div>`;
    return;
  }
  ownedBoostIds.forEach(id => {
    const def = ALL_BOOST_DEFS.find(b => b.id === id);
    if (!def) return;
    const e = ensureBoostEntry(p, id);
    const total = e.bound + e.tradeable;
    const blocked = gradeActive && p.activeBoost.boostId !== id;
    const card = document.createElement("div");
    card.className = "boostCard";
    card.innerHTML = `
      <div class="name">${def.name} <span style="color:#999; font-weight:400;">보유 ${total}개</span></div>
      <div class="desc">${def.desc}</div>
      <div style="display:flex; gap:10px; font-size:11px; color:#999; margin-bottom:8px;">
        <span>🔒 귀속 ${e.bound}개</span><span>💱 거래가능 ${e.tradeable}개</span>
      </div>
      <button ${blocked ? "disabled" : ""}>${blocked ? "다른 등급 부스트 사용중" : "사용 (지속시간 연장)"}</button>
    `;
    card.querySelector("button").onclick = async () => {
      const result = activateBoostFromInventory(p, id);
      if (!result.ok) { toast(result.reason); return; }
      bumpMission(p, "boostUse", 1);
      p.stats_boostUseCount = (p.stats_boostUseCount || 0) + 1;
      await saveProfile(p);
      toast(`${def.name} 사용! 지속시간이 늘어났어요.`);
      renderBoostStorage(content, p);
    };
    list.appendChild(card);
  });
}

function renderShop(content, p) {
  if (!state.shopSubTab) state.shopSubTab = "goods";

  content.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:12px;">
      <button class="shopSubTab" data-sub="goods" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.shopSubTab==='goods'?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:12px;">🪙 재화상점</button>
      <button class="shopSubTab" data-sub="cash" style="flex:1; padding:8px; border:none; border-radius:8px; background:${state.shopSubTab==='cash'?'linear-gradient(155deg,#3a3a47,#232330)':'linear-gradient(155deg,#20202c,#131319)'}; color:#fff; font-size:12px;">💎 현금상점</button>
    </div>
    <div id="shopBody"></div>
  `;
  content.querySelectorAll(".shopSubTab").forEach(b => {
    b.onclick = () => { state.shopSubTab = b.dataset.sub; renderShop(content, p); };

  if (state.shopSubTab === "cash") { renderCashShop(content, p); return; }

  myBox.appendChild(goToStorageBtn);

  // 등급별 부스트 구매 (인벤토리로 적립, 귀속 - 거래 불가)

    card.querySelector("button").onclick = async () => {

    };
    boostBox.appendChild(card);
  });
}

        p.diamonds += pkg.diamonds;
        bumpMission(p, "shopBuy", 1);
        await saveProfile(p);
        toast(`💎 ${pkg.diamonds.toLocaleString()} 지급완료! (테스트 결제)`);
        renderShop(content, p);
      };
      diaBox.appendChild(card);
    });
  }

  const diaBundleBox = document.getElementById("diaBundleBox");
  if (!p.oneTimePurchases) p.oneTimePurchases = {};
  DIAMOND_BUNDLES.forEach(bundle => {
    const boughtToday = (p.diamondBundleDaily.counts[bundle.id] || 0);
    const alreadyBoughtOnce = bundle.oneTime && p.oneTimePurchases[bundle.id];
    const limitReached = alreadyBoughtOnce || (bundle.dailyLimit != null && boughtToday >= bundle.dailyLimit);
    const canAfford = p.diamonds >= bundle.price;
    const materialLines = Object.entries(bundle.materials).map(([type, amt]) => `${MATERIAL_LABELS[type]} ${amt.toLocaleString()}개`).join(" · ");
    const card = document.createElement("div");
    card.className = "boostCard";
    const limitLabel = bundle.oneTime ? "(평생 1회 한정)" : bundle.dailyLimit ? `(오늘 ${boughtToday}/${bundle.dailyLimit})` : "";
    card.innerHTML = `
      <div class="name">${bundle.label}${limitLabel ? ` <span style="color:#999; font-weight:400; font-size:11px;">${limitLabel}</span>` : ""}</div>
      <div class="desc">${bundle.desc}<br/><span style="color:#777;">${materialLines}${bundle.pill ? ` · 💊 알약 ${bundle.pill.toLocaleString()}개` : ""}</span></div>
      <button ${!canAfford || limitReached ? "disabled" : ""}>${alreadyBoughtOnce ? "구매완료" : limitReached ? "오늘 구매 한도 소진" : `💎 ${bundle.price.toLocaleString()}`}</button>
    `;
    card.querySelector("button").onclick = async () => {
      ensureDiamondBundleDaily(p);
      if (!p.oneTimePurchases) p.oneTimePurchases = {};
      if (bundle.oneTime && p.oneTimePurchases[bundle.id]) { toast("이미 구매한 패키지예요."); return; }
      const bought = (p.diamondBundleDaily.counts[bundle.id] || 0);
      if (bundle.dailyLimit != null && bought >= bundle.dailyLimit) { toast("오늘 구매 한도를 모두 사용했어요."); return; }
      if (p.diamonds < bundle.price) { toast("다이아가 부족해요."); return; }
      p.diamonds -= bundle.price;
      Object.entries(bundle.materials).forEach(([type, amt]) => {
        p.materialsByType[type] = (p.materialsByType[type] || 0) + amt;
      });
      if (bundle.pill) p.pill = (p.pill || 0) + bundle.pill;
      if (bundle.coin) p.coins += bundle.coin;
      p.diamondBundleDaily.counts[bundle.id] = bought + 1;
      if (bundle.oneTime) p.oneTimePurchases[bundle.id] = true;
      bumpMission(p, "shopBuy", 1);
      await saveProfile(p);
      toast(`${bundle.label} 지급완료!`);
      renderCashShop(content, p);
    };
    diaBundleBox.appendChild(card);
  });

  const adRemoveBox = document.getElementById("adRemoveBox");
  AD_REMOVAL_PURCHASE_LOCKED
    ? (adRemoveBox.innerHTML = `<div class="boostCard"><div class="desc">🔧 현재 광고 제거 결제는 일시적으로 준비 중이에요.</div></div>`)
    : AD_REMOVAL_ITEMS.forEach(item => {
        const alreadyOwned = adRemoved; // 지금은 상품이 하나뿐이라 영구 광고제거 보유 여부로 판단
        const card = document.createElement("div");
        card.className = "boostCard";
        card.innerHTML = `
          <div class="name">${item.label}</div>
          <div class="desc">${item.priceLabel}</div>
          <button ${alreadyOwned ? "disabled" : ""}>${alreadyOwned ? "구매완료" : "구매"}</button>
        `;
        card.querySelector("button").onclick = async () => {
          if (adRemoved) return;
          p.adRemovedUntil = item.days == null ? "forever" : Date.now() + item.days * 24 * 60 * 60 * 1000;
          bumpMission(p, "shopBuy", 1);
          await saveProfile(p);
          toast(`${item.label} 적용완료! (테스트 결제)`);
          renderShop(content, p);
        };
        adRemoveBox.appendChild(card);
      });

  const bundleBox = document.getElementById("bundleBox");
  if (AD_REMOVAL_PURCHASE_LOCKED) {
    bundleBox.innerHTML = `<div class="boostCard"><div class="desc">🔧 광고제거가 포함된 번들이라 현재 일시적으로 준비 중이에요.</div></div>`;
  } else {
  CASH_BUNDLES.forEach(b => {
    const card = document.createElement("div");
    card.className = "boostCard";
    card.innerHTML = `
      <div class="name">${b.label}</div>
      <div class="desc">${b.desc} · ${b.priceLabel}</div>
      <button ${adRemoved ? "disabled" : ""}>${adRemoved ? "구매완료(광고제거 이미 보유)" : "구매"}</button>
    `;
    card.querySelector("button").onclick = async () => {
      if (adRemoved) return;
      p.coins += b.coins;
      p.adRemovedUntil = b.adRemovalDays == null ? "forever" : Date.now() + b.adRemovalDays * 24 * 60 * 60 * 1000;
      for (let i = 0; i < b.cardCount; i++) {
        const gradeId = rollGradeUniqueOrBelow();
        const picked = pickRandomPlayerAnyTeam();
        const newCard = createCard({ gradeId, teamId: picked.teamId, teamName: picked.teamName, playerName: picked.playerName });
        p.cards.push(newCard);
        markDexUnlocked(p, newCard);
      }
      bumpMission(p, "shopBuy", 1);
      await saveProfile(p);
      toast(`${b.label} 지급완료! 골드 ${b.coins.toLocaleString()} + 카드 ${b.cardCount}장 (테스트 결제)`);
      renderShop(content, p);
    };
    bundleBox.appendChild(card);
  });
  }
}

init();
</script>
</body>
</html>
